<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Homework</title>

  <!-- Add-to-home-screen / PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Homework" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />

  <!-- Fonts (match phant0msecure: clean grotesque + mono accents) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #000;
      --panel: #101014;
      --panel-lit: linear-gradient(180deg, #191920 0%, #101014 60%);
      --line: rgba(255,255,255,0.09);
      --line-strong: rgba(255,255,255,0.24);
      --text: #f5f5f7;
      --dim: #8a8a90;      /* second-line heading grey */
      --muted: #7a7a80;
      --faint: #55555c;    /* uppercase labels */
      --overdue: #e06666;
      --soon: #d9b26a;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased; overflow-x: hidden;
    }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

    /* ---------- Background: grid + subtle static glow (no animation = smoother) ---------- */
    .bg { position: fixed; inset: 0; z-index: -3; background: #000; }
    .grid {
      position: fixed; inset: 0; z-index: -2; pointer-events: none;
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 58px 58px;
      -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 32%, #000 45%, transparent 100%);
              mask-image: radial-gradient(ellipse 90% 70% at 50% 32%, #000 45%, transparent 100%);
    }
    .glow {
      position: fixed; z-index: -1; pointer-events: none; border-radius: 50%;
      filter: blur(70px); opacity: 0.05; background: radial-gradient(circle, #fff 0%, transparent 70%);
      width: 70vw; height: 70vw; left: 15vw; top: -10vh;
    }
    .glow.two { top: auto; bottom: -20vh; left: -10vw; width: 60vw; height: 60vw; opacity: 0.035; }

    /* corner registration ticks (phantom vibe) */
    .ticks { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
    .ticks span { position: absolute; width: 14px; height: 14px; border: 1px solid rgba(255,255,255,0.14); }
    .ticks .tl { top: 10px; left: 10px; border-right: none; border-bottom: none; }
    .ticks .tr { top: 10px; right: 10px; border-left: none; border-bottom: none; }
    .watermark {
      position: fixed; left: 14px; bottom: 10px; z-index: -1; pointer-events: none;
      font-size: 11px; color: rgba(255,255,255,0.14); letter-spacing: 1px;
    }
    .boot-msg {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 40px; font-size: 12px; letter-spacing: 1px;
      color: var(--muted); line-height: 1.8;
    }
    .boot-msg .dots::after { content: ''; animation: dots 1.4s steps(4, end) infinite; }
    @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75%, 100% { content: '...'; } }

    /* ---------- Header ---------- */
    header {
      position: sticky; top: 0; z-index: 10;
      padding: calc(16px + env(safe-area-inset-top)) 18px 14px;
      border-bottom: 1px solid var(--line);
      background: #000;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .ghost { width: 30px; height: 30px; flex: 0 0 auto; }
    .wordmark { line-height: 0.92; font-weight: 700; letter-spacing: 3px; font-size: 15px; }
    .wordmark .ring { display: inline-block; width: 0.6em; height: 0.6em; border: 2px solid currentColor;
      border-radius: 50%; vertical-align: 0.04em; margin: 0 0.04em; box-sizing: border-box; }

    main { max-width: 660px; margin: 0 auto; padding: 0 18px calc(104px + env(safe-area-inset-bottom)); }

    /* ---------- Hero ---------- */
    .hero { padding: 30px 2px 22px; border-bottom: 1px solid var(--line); }
    .eyebrow { margin: 0 0 16px; font-size: 11px; letter-spacing: 3.5px; text-transform: uppercase; color: var(--faint); }
    .hero-title { margin: 0; font-weight: 400; font-size: clamp(30px, 8vw, 44px); line-height: 1.06; letter-spacing: -0.5px; }
    .hero-title .dim { color: var(--dim); }
    .hero-sub { margin: 16px 0 0; font-size: 12px; letter-spacing: 1px; color: var(--muted); }

    /* ---------- Toolbar ---------- */
    .toolbar { display: flex; align-items: center; gap: 16px; padding: 18px 2px; }
    .search {
      flex: 1; background: transparent; border: none; border-bottom: 1px solid var(--line);
      color: var(--text); padding: 8px 2px; font-size: 15px; outline: none; transition: border-color .25s;
    }
    .search:focus { border-color: var(--line-strong); }
    .search::placeholder { color: var(--faint); }
    .filters { display: flex; gap: 22px; overflow-x: auto; -ms-overflow-style: none; scrollbar-width: none; padding: 2px 2px 12px; }
    .filters::-webkit-scrollbar { display: none; }
    .filters button {
      background: none; border: none; color: var(--faint); font-size: 12px; letter-spacing: 1.5px; white-space: nowrap; flex: 0 0 auto;
      text-transform: uppercase; cursor: pointer; padding: 6px 0; position: relative; transition: color .2s;
    }
    .filters button.active { color: var(--text); }
    .filters button.active::after { content: ''; position: absolute; left: 0; right: 0; bottom: -2px; height: 1px; background: #fff;
      transform-origin: left; animation: uline .25s ease; }
    @keyframes uline { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    /* ---------- Cards (sharp corners, thin borders) ---------- */
    .card {
      border: 1px solid var(--line); background: var(--panel-lit);
      box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 10px 30px rgba(0,0,0,0.45);
      padding: 16px; margin-bottom: 12px; animation: cardIn .3s cubic-bezier(.2,.7,.3,1) both;
    }
    @keyframes cardIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .hw { display: flex; gap: 14px; align-items: flex-start; }
    .check {
      flex: 0 0 auto; width: 26px; height: 26px; border: 1px solid var(--line-strong); background: transparent;
      cursor: pointer; display: grid; place-items: center; margin-top: 2px; transition: background .2s ease, border-color .2s ease;
    }
    .check:active { transform: scale(.9); }
    .hw.done .check { background: #fff; border-color: #fff; }
    .check svg { width: 14px; height: 14px; stroke: #000; opacity: 0; transition: opacity .2s; }
    .hw.done .check svg { opacity: 1; }
    .body { flex: 1 1 auto; min-width: 0; }
    .title { font-size: 16.5px; font-weight: 500; margin: 0 0 4px; letter-spacing: -0.2px; word-break: break-word; }
    .hw.done .title { color: var(--muted); text-decoration: line-through; }
    .subtitle { margin: 0 0 6px; font-size: 13px; color: var(--muted); letter-spacing: 0.2px; }
    .hw.done .subtitle { color: var(--faint); }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 2px; }
    .tag { font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); border: 1px solid var(--line); padding: 3px 8px; }
    .due { font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; padding: 3px 8px; border: 1px solid var(--line); color: var(--faint); }
    .due.overdue { color: var(--overdue); border-color: rgba(224,102,102,0.4); }
    .due.soon { color: var(--soon); border-color: rgba(217,178,106,0.35); }
    .notes { font-size: 14px; color: rgba(255,255,255,0.62); margin: 10px 0 0; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
    .attachments { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .thumb { width: 64px; height: 64px; object-fit: cover; border: 1px solid var(--line); }
    .att { display: flex; align-items: center; gap: 7px; text-decoration: none; border: 1px solid var(--line);
      color: var(--text); padding: 7px 10px; font-size: 12px; }
    .att .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }

    /* action buttons — bigger, real tap targets */
    .row-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .row-actions .link {
      border: 1px solid var(--line); padding: 10px 15px; font-size: 11.5px; letter-spacing: 1px; color: var(--dim);
    }
    .row-actions .link:active { background: rgba(255,255,255,0.06); color: #fff; }
    .row-actions .link.danger { color: #c98282; border-color: rgba(224,102,102,0.32); }
    .row-actions .link.danger:active { background: rgba(224,102,102,0.12); color: var(--overdue); }

    .link { background: none; border: none; color: var(--faint); font-size: 11.5px; letter-spacing: 1.5px;
      text-transform: uppercase; cursor: pointer; padding: 0; transition: color .2s; }
    .link:active { color: #fff; }
    .link.danger:active { color: var(--overdue); }
    .link.busy { color: var(--soon); }

    /* transcription block + photo tools */
    .transcript { margin-top: 12px; border: 1px solid var(--line); border-left: 2px solid var(--line-strong);
      background: rgba(255,255,255,0.02); padding: 11px 13px; font-size: 13px; line-height: 1.55;
      color: rgba(255,255,255,0.72); white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow: auto; }
    .transcript .tlabel { display: block; font-size: 9.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--faint); margin-bottom: 7px; }
    .photo-tools { display: flex; flex-wrap: wrap; gap: 14px 18px; margin-top: 14px; }

    .empty { text-align: center; color: var(--faint); padding: 70px 20px; animation: cardIn .4s both; }
    .empty svg { width: 42px; height: 42px; opacity: .35; margin-bottom: 14px; }
    .empty p { margin: 0; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }

    .footer-tools { text-align: center; margin: 26px 0 4px; display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; }

    /* view tabs */
    .viewtabs { display: flex; gap: 20px; margin-top: 12px; overflow-x: auto; -ms-overflow-style: none; scrollbar-width: none; }
    .viewtabs::-webkit-scrollbar { display: none; }
    .viewtabs button { background: none; border: none; color: var(--faint); font-size: 11px; letter-spacing: 2px; white-space: nowrap; flex: 0 0 auto;
      text-transform: uppercase; padding: 4px 0; position: relative; cursor: pointer; transition: color .2s; }
    .viewtabs button.active { color: var(--text); }
    .viewtabs button.active::after { content: ''; position: absolute; left: 0; right: 0; bottom: -3px; height: 1px; background: #fff; }

    /* calendar */
    .cal-wrap { padding-top: 6px; }
    .sembar { display: flex; gap: 8px; overflow-x: auto; padding: 16px 0; -ms-overflow-style: none; scrollbar-width: none; }
    .sembar::-webkit-scrollbar { display: none; }
    .schip { white-space: nowrap; border: 1px solid var(--line); background: none; color: var(--muted);
      padding: 8px 13px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
    .schip.on { border-color: var(--line-strong); color: var(--text); }
    .schip.add { color: var(--faint); border-style: dashed; }
    .seminfo { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center;
      padding: 2px 2px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); letter-spacing: .5px; }
    .seminfo .wk { color: var(--soon); margin-right: 12px; }

    .cal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 2px; }
    .cal-head .mlabel { font-size: 15px; letter-spacing: .5px; text-transform: capitalize; }
    .cal-nav { background: none; border: 1px solid var(--line); color: var(--text); width: 38px; height: 38px; cursor: pointer; font-size: 18px; line-height: 1; }
    .cal-nav:active { background: rgba(255,255,255,0.08); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-dow { text-align: center; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); padding: 2px 0 6px; }
    .cal-cell { min-height: 46px; border: 1px solid var(--line); background: var(--panel); padding: 5px;
      display: flex; flex-direction: column; gap: 2px; cursor: pointer; }
    .cal-cell.out { opacity: .32; }
    .cal-cell.dim { opacity: .14; }
    .cal-cell.today { border-color: var(--line-strong); }
    .cal-cell.sel { background: rgba(255,255,255,0.09); border-color: #fff; }
    .cal-cell .dnum { font-size: 11.5px; color: var(--muted); }
    .cal-cell.today .dnum { color: #fff; font-weight: 600; }
    .cal-dots { display: flex; flex-wrap: wrap; gap: 3px; margin-top: auto; align-items: center; }
    .cal-dots i { width: 6px; height: 6px; border-radius: 50%; display: block; }
    .cal-more { font-size: 8px; color: var(--faint); }

    .day-detail { margin-top: 22px; }
    .day-detail h3 { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--faint); margin: 0 0 12px; }
    .drow { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); background: var(--panel-lit); padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
    .drow .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
    .drow .dsub { font-size: 15px; }
    .drow.done .dsub { color: var(--muted); text-decoration: line-through; }
    .drow .dmeta { margin-left: auto; font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); }
    .day-empty { color: var(--faint); font-size: 12px; letter-spacing: 1px; padding: 8px 2px; }
    .add-day { display: inline-block; margin-top: 8px; }

    .form-err { color: var(--overdue); font-size: 12px; margin: 16px 0 0; letter-spacing: .3px; }

    /* schedule / horario */
    .sched-wrap { padding-top: 8px; }
    .sched-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 2px; border-bottom: 1px solid var(--line); }
    .sched-head .mlabel { font-size: 15px; letter-spacing: .5px; }
    .sched-day { margin-top: 20px; }
    .sched-day h3 { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--faint); margin: 0 0 10px; }
    .cls { display: flex; align-items: center; gap: 14px; border: 1px solid var(--line); border-left: 3px solid #f5f5f7;
      background: var(--panel-lit); padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
    .cls-time { font-size: 13px; color: var(--muted); flex: 0 0 auto; }
    .cls-sub { font-size: 15px; font-weight: 500; }
    .cls-room { margin-left: auto; font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); }
    .cls-empty { color: #3a3a40; font-size: 14px; padding: 2px 2px 4px; }
    .sched-actions { margin-top: 26px; }
    .sched-actions .btn { width: 100%; }
    .sched-note { color: var(--faint); font-size: 12px; line-height: 1.5; letter-spacing: .3px; margin: 14px 2px 0; text-align: center; }

    /* day picker + time row (class sheet) */
    .daypick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .dchip { border: 1px solid var(--line); background: none; color: var(--muted); padding: 10px 13px; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
    .dchip.on { border-color: #fff; color: #fff; background: rgba(255,255,255,0.06); }
    .time-row { display: flex; gap: 16px; }
    .time-row > div { flex: 1; }

    /* subject / class quick-pick chips (new-homework sheet) */
    .subjchips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 2px; }
    .schip2 { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line);
      background: none; color: var(--muted); padding: 10px 13px; font-size: 13px; cursor: pointer; }
    .schip2 i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
    .schip2.on { border-color: #fff; color: #fff; background: rgba(255,255,255,0.06); }
    .field-help { font-size: 12px; color: var(--faint); margin: 9px 0 0; letter-spacing: .2px; line-height: 1.5; }

    /* ---------- Add button — round FAB in the corner (roomier list) ---------- */
    .add {
      position: fixed; right: calc(18px + env(safe-area-inset-right));
      bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 20;
      width: 60px; height: 60px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: #fff; color: #000; border: none;
      font-size: 30px; font-weight: 300; line-height: 1;
      cursor: pointer; box-shadow: 0 8px 30px rgba(0,0,0,0.7); transition: transform .15s;
    }
    .add:active { transform: scale(.9); }

    /* ---------- Sheet ---------- */
    .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.82);
      z-index: 30; display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .sheet {
      width: 100%; max-width: 660px; background: #050506; border: 1px solid var(--line); border-bottom: none;
      padding: 24px 22px calc(24px + env(safe-area-inset-bottom));
      max-height: 92vh; overflow-y: auto; animation: slideUp .28s cubic-bezier(.2,.8,.2,1);
    }
    @keyframes slideUp { from { transform: translateY(40px); opacity: .5; } to { transform: none; opacity: 1; } }
    .sheet h2 { margin: 0 0 22px; font-size: 12px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; color: var(--faint); }
    label { display: block; font-size: 10.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--faint); margin: 22px 0 9px; }
    /* underline-only fields, matching the reference contact form */
    input[type=text], input[type=date], input[type=time], textarea {
      width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--line);
      color: var(--text); padding: 9px 2px; font-size: 16px; font-family: inherit; outline: none; transition: border-color .2s;
    }
    input:focus, textarea:focus { border-color: var(--line-strong); }
    input.err { border-color: var(--overdue); }
    textarea { min-height: 60px; resize: vertical; }
    .file-btns { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
    .file-btn { flex: 1 1 130px; text-align: center; border: 1px dashed var(--line); color: var(--muted);
      padding: 14px; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; transition: border-color .2s, color .2s; }
    .file-btn:active { border-color: var(--line-strong); color: #fff; }
    .staged { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .staged .att .rm { color: var(--overdue); font-weight: 700; cursor: pointer; margin-left: 2px; }
    .staged .att .ok { color: var(--soon); font-weight: 700; margin-left: 2px; }
    .file-btn.wide { flex-basis: 100%; margin-top: 12px; }
    .file-btn.busy { color: var(--soon); border-color: rgba(217,178,106,0.4); border-style: solid; cursor: default; }
    /* subject colour swatches */
    .swatches { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
    .swatch { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); cursor: pointer; padding: 0; transition: transform .15s; }
    .swatch:active { transform: scale(.85); }
    .swatch.on { box-shadow: 0 0 0 2px #000, 0 0 0 3px #fff; }
    .swatch.none { background: #f5f5f7; }
    .sheet-actions { display: flex; gap: 12px; margin-top: 30px; }
    .btn { flex: 1; padding: 16px; font-family: inherit; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: transform .15s, opacity .2s; }
    .btn:active { transform: scale(.97); }
    .btn.primary { background: #fff; color: #000; border: none; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn.ghost { background: #17171b; color: #e8e8ec; border: 1px solid var(--line-strong); font-weight: 500; }
    .btn.danger { background: #17171b; color: #e06666; border: 1px solid rgba(224,102,102,0.4); font-weight: 500; }
    .btn.wide-one { width: 100%; }

    /* subtasks — in the sheet */
    .subtask-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .stcheck { flex: 0 0 auto; width: 26px; height: 26px; border: 1px solid var(--line-strong); background: transparent;
      display: grid; place-items: center; cursor: pointer; }
    .stcheck svg { width: 13px; height: 13px; stroke: #000; opacity: 0; }
    .stcheck.on { background: #fff; border-color: #fff; }
    .stcheck.on svg { opacity: 1; }
    .subtask-row input { flex: 1; }
    .strm { flex: 0 0 auto; background: none; border: none; color: var(--overdue); font-size: 16px; cursor: pointer; padding: 4px 6px; }

    /* subtasks — on a card */
    .subtasks { margin-top: 12px; display: flex; flex-direction: column; gap: 9px; }
    .subtasks .stitle { font-size: 9.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--faint); }
    .subtask { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; color: rgba(255,255,255,0.82); }
    .subtask .box { width: 19px; height: 19px; border: 1px solid var(--line-strong); display: grid; place-items: center; flex: 0 0 auto; }
    .subtask .box svg { width: 11px; height: 11px; stroke: #000; opacity: 0; }
    .subtask.done .box { background: #fff; border-color: #fff; }
    .subtask.done .box svg { opacity: 1; }
    .subtask.done .stx { color: var(--muted); text-decoration: line-through; }

    /* kind + grade tags */
    .kind-tag { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; padding: 3px 8px; border: 1px solid var(--line-strong); color: var(--text); }
    .kind-tag.exam { color: #ffcf70; border-color: rgba(255,207,112,0.5); }
    .grade-tag { font-size: 10.5px; letter-spacing: 1px; padding: 3px 8px; border: 1px solid rgba(95,208,138,0.5); color: #5fd08a; }

    /* grades view */
    .grades-wrap { padding-top: 10px; }
    .grades-overall { display: flex; align-items: center; justify-content: space-between; padding: 16px 2px 18px; border-bottom: 1px solid var(--line); }
    .grades-overall .gnum { font-size: 30px; font-weight: 600; letter-spacing: -0.5px; }
    .grades-overall .gnum small { font-size: 14px; color: var(--muted); font-weight: 400; }
    .grades-overall .glabel { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--faint); text-align: right; }
    .grade-sec { margin-top: 24px; }
    .grade-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; gap: 12px; }
    .grade-subj { font-size: 16px; font-weight: 500; }
    .grade-avg { font-size: 14px; color: var(--muted); font-family: 'JetBrains Mono', ui-monospace, monospace; flex: 0 0 auto; }
    .grade-row { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); background: var(--panel-lit); padding: 10px 12px; margin-bottom: 8px; }
    .grade-kind { flex: 0 0 auto; font-size: 8.5px; letter-spacing: 1px; color: var(--faint); border: 1px solid var(--line); padding: 3px 6px; }
    .grade-name { flex: 1; min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
    .grade-in { flex: 0 0 auto; width: 58px; text-align: center; background: transparent; border: 1px solid var(--line-strong); color: var(--text);
      font-size: 16px; font-family: inherit; padding: 8px 4px; outline: none; }
    .grade-in:focus { border-color: #5fd08a; }
    .grade-slash { flex: 0 0 auto; font-size: 12px; color: var(--faint); }
    .grades-actions { margin-top: 30px; }
    .grades-actions .btn { width: 100%; }

    /* + chooser popup (homework vs exam) */
    .addmenu-backdrop { position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,0.55); animation: fade .18s ease; }
    .addmenu { position: fixed; right: calc(18px + env(safe-area-inset-right)); bottom: calc(92px + env(safe-area-inset-bottom)); z-index: 26;
      display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
    .addmenu button { background: #fff; color: #000; border: none; padding: 15px 20px; font-family: inherit; font-size: 13px; font-weight: 600;
      letter-spacing: 1px; cursor: pointer; box-shadow: 0 8px 30px rgba(0,0,0,0.6); display: flex; align-items: center; gap: 10px; min-width: 168px; }
    .addmenu button:active { transform: scale(.97); }

    /* round save / cancel buttons inside a sheet (match the corner add button) */
    .sheet-fabs {
      position: fixed; right: calc(18px + env(safe-area-inset-right));
      bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 40; display: flex; gap: 12px;
    }
    .fab { width: 58px; height: 58px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      cursor: pointer; border: none; transition: transform .15s; }
    .fab:active { transform: scale(.9); }
    .fab.save { background: #fff; color: #000; box-shadow: 0 8px 30px rgba(0,0,0,0.7); }
    .fab svg { width: 24px; height: 24px; }

    /* sticky sheet header with a close (X) in the corner */
    .sheet-top { position: sticky; top: 0; z-index: 5; background: #050506;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin: 0 0 20px; padding: 2px 0 10px; }
    .sheet-top h2 { margin: 0; }
    .sheet-x { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%;
      background: #17171b; border: 1px solid var(--line-strong); color: #cfcfd4;
      display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform .15s; }
    .sheet-x:active { transform: scale(.9); }
    .sheet-x svg { width: 18px; height: 18px; }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="glow two"></div>
  <div class="ticks"><span class="tl"></span><span class="tr"></span></div>
  <div class="watermark mono">Alex__dem0n</div>

  <div id="root"><div id="boot" class="boot-msg mono">Loading<span class="dots"></span></div></div>

  <script>
    // Surface real script/runtime failures instead of leaving a blank screen.
    window.addEventListener('error', function (e) {
      var boot = document.getElementById('boot');
      if (!boot) return;
      var where = e.filename ? e.filename.split('/').pop() + (e.lineno ? ':' + e.lineno : '') : (e.target && e.target.src ? e.target.src.split('/').pop() : 'unknown file');
      var msg = e.message || (e.error && e.error.message) || 'a script failed to load';
      boot.innerHTML = "Something went wrong loading the app.<br><span style='opacity:.7'>" +
        String(msg).replace(/</g, '&lt;') + "<br>(" + where.replace(/</g, '&lt;') + ")</span><br>Please screenshot this and send it back.";
    }, true);
    setTimeout(function () {
      var boot = document.getElementById('boot');
      if (boot && !window.React) {
        boot.innerHTML = "Still loading&hellip; this can take a few seconds on a slow connection.<br>If this doesn't go away, check your connection and reload.";
      }
    }, 8000);
  </script>

  <!-- React + Babel, bundled locally (no CDN dependency, no build step needed) -->
  <script src="./vendor/react.production.min.js"></script>
  <script src="./vendor/react-dom.production.min.js"></script>
  <script src="./vendor/babel.min.js"></script>

  <script type="text/plain" id="app-source">
  const { useState, useEffect, useRef, useCallback } = React;

  const LOC = 'en-US';
  const GRADE_MAX = 20; // Venezuela 0–20 scale

  /* ---------- IndexedDB ---------- */
  const DB_NAME = 'homework-tracker', DB_VER = 3;
  let db;
  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('homework')) d.createObjectStore('homework', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('attachments')) {
          const s = d.createObjectStore('attachments', { keyPath: 'id' });
          s.createIndex('homeworkId', 'homeworkId', { unique: false });
        }
        if (!d.objectStoreNames.contains('semesters')) d.createObjectStore('semesters', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('classes')) d.createObjectStore('classes', { keyPath: 'id' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  const store = (s, m) => db.transaction(s, m).objectStore(s);
  const reqP = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const getAllHW = () => reqP(store('homework', 'readonly').getAll());
  const putHW = (o) => reqP(store('homework', 'readwrite').put(o));
  const delHWrec = (id) => reqP(store('homework', 'readwrite').delete(id));
  const putAtt = (o) => reqP(store('attachments', 'readwrite').put(o));
  const delAtt = (id) => reqP(store('attachments', 'readwrite').delete(id));
  const getAllAtts = () => reqP(store('attachments', 'readonly').getAll());
  const getAttsFor = (hwId) => reqP(store('attachments', 'readonly').index('homeworkId').getAll(IDBKeyRange.only(hwId)));
  const getAllSem = () => reqP(store('semesters', 'readonly').getAll());
  const putSem = (o) => reqP(store('semesters', 'readwrite').put(o));
  const delSemRec = (id) => reqP(store('semesters', 'readwrite').delete(id));
  const getAllClasses = () => reqP(store('classes', 'readonly').getAll());
  const putClass = (o) => reqP(store('classes', 'readwrite').put(o));
  const delClassRec = (id) => reqP(store('classes', 'readwrite').delete(id));

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const isImage = (a) => (a.type || '').startsWith('image/');

  /* ---------- On-device OCR (Tesseract.js, loaded on first use) ---------- */
  const OCR_LANGS = 'eng+spa';
  let _tessPromise = null;
  function loadTesseract() {
    if (window.Tesseract) return Promise.resolve(window.Tesseract);
    if (_tessPromise) return _tessPromise;
    _tessPromise = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
      s.onload = () => res(window.Tesseract);
      s.onerror = () => { _tessPromise = null; rej(new Error('Could not load the transcriber. Check your connection and try again.')); };
      document.head.appendChild(s);
    });
    return _tessPromise;
  }
  async function transcribeBlob(blob, onProgress) {
    const T = await loadTesseract();
    const { data } = await T.recognize(blob, OCR_LANGS, {
      logger: (m) => { if (m.status === 'recognizing text' && onProgress) onProgress(Math.round(m.progress * 100)); }
    });
    return (data.text || '').replace(/\n{3,}/g, '\n\n').trim();
  }

  const fmtDate = (iso) => iso ? new Date(iso + 'T00:00:00').toLocaleDateString(LOC, { month: 'short', day: 'numeric' }) : '';
  function dueInfo(iso, done) {
    if (!iso) return { cls: '', label: 'No date' };
    const today = new Date(); today.setHours(0,0,0,0);
    const days = Math.round((new Date(iso + 'T00:00:00') - today) / 86400000);
    if (done) return { cls: '', label: fmtDate(iso) };
    if (days < 0) return { cls: 'overdue', label: 'Overdue · ' + fmtDate(iso) };
    if (days === 0) return { cls: 'soon', label: 'Today' };
    if (days === 1) return { cls: 'soon', label: 'Tomorrow' };
    if (days <= 3) return { cls: 'soon', label: 'In ' + days + ' days' };
    return { cls: '', label: fmtDate(iso) };
  }

  /* ---------- Subject colours & days ---------- */
  const COLORS = ['#e06666', '#e9a23b', '#ead24a', '#5fd08a', '#5cc7e0', '#7aa2ff', '#b98bff', '#ff8ac4'];
  const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  const DAYS_SHORT = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

  /* ---------- Calendar reminders (.ics — real iOS notifications via Calendar) ---------- */
  const pad2 = (n) => String(n).padStart(2, '0');
  const icsEsc = (s) => String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
  function icsStamp(d) {
    return d.getUTCFullYear() + pad2(d.getUTCMonth()+1) + pad2(d.getUTCDate()) + 'T' +
           pad2(d.getUTCHours()) + pad2(d.getUTCMinutes()) + pad2(d.getUTCSeconds()) + 'Z';
  }
  const icsLocal = (iso, h, m) => iso.replace(/-/g, '') + 'T' + pad2(h) + pad2(m) + '00';
  function hwTitle(item) { return (item.title && item.title.trim()) || item.subject || 'Homework'; }
  function vevent(item) {
    if (!item.dueDate) return '';
    const summary = 'Homework: ' + hwTitle(item);
    const desc = [item.subject ? ('Subject: ' + item.subject) : '', item.className ? ('Class: ' + item.className) : '', item.notes || ''].filter(Boolean).join('\\n');
    const alarm = (trig) => ['BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(summary), 'TRIGGER:' + trig, 'END:VALARM'];
    return [
      'BEGIN:VEVENT',
      'UID:' + item.id + '@homework-tracker',
      'DTSTAMP:' + icsStamp(new Date()),
      'DTSTART:' + icsLocal(item.dueDate, 8, 0),
      'DTEND:' + icsLocal(item.dueDate, 8, 30),
      'SUMMARY:' + icsEsc(summary),
      desc ? ('DESCRIPTION:' + desc) : '',
      ...alarm('-P1D'),
      ...alarm('PT0S'),
      'END:VEVENT'
    ].filter(Boolean).join('\r\n');
  }
  function buildICS(items) {
    const events = items.map(vevent).filter(Boolean);
    if (!events.length) return null;
    return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Homework Tracker//EN', 'CALSCALE:GREGORIAN', ...events, 'END:VCALENDAR'].join('\r\n');
  }
  function downloadICS(filename, text) {
    const blob = new Blob([text], { type: 'text/calendar' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  /* ---------- Ghost logo ---------- */
  function Ghost() {
    return (
      <svg className="ghost" viewBox="0 0 24 24" fill="#f5f5f7" aria-hidden="true">
        <path d="M3 21V11a9 9 0 0 1 18 0v10l-3-2-3 2-3-2-3 2-3-2Z"/>
        <circle cx="9" cy="10.5" r="1.35" fill="#000"/>
        <circle cx="15" cy="10.5" r="1.35" fill="#000"/>
      </svg>
    );
  }

  /* ---------- Sheet (add / edit homework) ---------- */
  function Sheet({ initial, subjectColors, classSubjects, prefillDate, newKind, onClose, onSaved }) {
    const kind = initial ? (initial.kind || 'homework') : (newKind || 'homework');
    const isExam = kind === 'exam';
    const kindWord = isExam ? 'exam' : 'homework';
    const [title, setTitle] = useState(initial ? (initial.title || '') : '');
    const [subject, setSubject] = useState(initial ? initial.subject : '');
    const [className, setClassName] = useState(initial ? (initial.className || '') : '');
    const [dueDate, setDueDate] = useState(initial ? initial.dueDate : (prefillDate || ''));
    const [notes, setNotes] = useState(initial ? initial.notes : '');
    const [color, setColor] = useState(initial ? (initial.color || '') : '');
    const [subtasks, setSubtasks] = useState(initial && initial.subtasks ? initial.subtasks.map(s => ({ ...s })) : []);
    const [staged, setStaged] = useState([]);
    const [err, setErr] = useState(false);
    const [ocr, setOcr] = useState(null);
    const colorTouched = useRef(!!initial);
    const titleRef = useRef(null);

    const addSubtask = () => setSubtasks(s => [...s, { id: uid(), text: '', done: false }]);
    const setSubtaskText = (id, text) => setSubtasks(s => s.map(x => x.id === id ? { ...x, text } : x));
    const toggleSubtask = (id) => setSubtasks(s => s.map(x => x.id === id ? { ...x, done: !x.done } : x));
    const removeSubtask = (id) => setSubtasks(s => s.filter(x => x.id !== id));

    // typing a subject you've used before adopts its colour (unless you pick one yourself)
    const onSubjectChange = (v) => {
      setSubject(v); setErr(false);
      if (!colorTouched.current) {
        const c = subjectColors[v.trim().toLowerCase()];
        setColor(c || '');
      }
    };
    // tapping a class chip fills subject + colour (tap again to clear)
    const pickSubject = (s, c) => {
      setErr(false);
      if (subject.trim().toLowerCase() === s.toLowerCase()) { setSubject(''); return; }
      setSubject(s);
      if (!colorTouched.current) setColor(c || '');
    };
    const pickColor = (c) => { colorTouched.current = true; setColor(color === c ? '' : c); };

    useEffect(() => {
      let urls = [];
      if (initial) {
        getAttsFor(initial.id).then(atts => {
          const withUrls = atts.map(a => ({ ...a, url: URL.createObjectURL(a.blob) }));
          urls = withUrls.map(a => a.url); setStaged(withUrls);
        });
      }
      setTimeout(() => titleRef.current && titleRef.current.focus(), 120);
      return () => urls.forEach(URL.revokeObjectURL);
    }, []);

    const addFiles = (fileList) => {
      const added = Array.from(fileList).map(f => ({ id: uid(), name: f.name || ('photo-' + Date.now() + '.jpg'), type: f.type, blob: f, url: URL.createObjectURL(f) }));
      setStaged(s => [...s, ...added]);
    };
    const removeStaged = (id) => setStaged(s => {
      const gone = s.find(x => x.id === id);
      if (gone && !gone.homeworkId) URL.revokeObjectURL(gone.url);
      return s.filter(x => x.id !== id);
    });

    async function transcribeStaged() {
      const todo = staged.filter(a => isImage(a) && !a.text);
      if (!todo.length) return;
      setOcr({ pct: 0, i: 0, n: todo.length });
      try {
        const results = {};
        for (let i = 0; i < todo.length; i++) {
          const a = todo[i];
          results[a.id] = await transcribeBlob(a.blob, (pct) => setOcr({ pct, i: i + 1, n: todo.length }));
        }
        setStaged(s => s.map(x => results[x.id] !== undefined ? { ...x, text: results[x.id] } : x));
        const combined = todo.map(a => results[a.id]).filter(Boolean).join('\n\n');
        if (combined) setNotes(n => n ? (n.trimEnd() + '\n\n' + combined) : combined);
      } catch (e) {
        alert(e.message || 'Transcription failed.');
      } finally {
        setOcr(null);
      }
    }

    async function save() {
      const ttl = title.trim(), subj = subject.trim();
      if (!ttl && !subj) { setErr(true); titleRef.current && titleRef.current.focus(); return; }
      const id = initial ? initial.id : uid();
      const cleanSubs = subtasks.filter(s => s.text.trim()).map(s => ({ id: s.id, text: s.text.trim(), done: !!s.done }));
      const hw = { id, kind, title: ttl, subject: subj, classNo: initial ? (initial.classNo || '') : '',
        className: className.trim(), dueDate, notes: notes.trim(), color, subtasks: cleanSubs,
        grade: initial ? (initial.grade || '') : '',
        done: initial ? initial.done : false, createdAt: initial ? initial.createdAt : Date.now() };
      await putHW(hw);
      const prev = initial ? await getAttsFor(id) : [];
      const stagedIds = new Set(staged.map(s => s.id));
      for (const p of prev) if (!stagedIds.has(p.id)) await delAtt(p.id);
      for (const s of staged) await putAtt({ id: s.id, homeworkId: id, name: s.name, type: s.type, blob: s.blob, text: s.text || '' });
      onSaved();
    }

    return (
      <div className="backdrop" onClick={(e) => { if (e.target.classList.contains('backdrop')) onClose(); }}>
        <div className="sheet">
          <div className="sheet-top">
            <h2>{(initial ? 'Edit ' : 'New ') + kindWord}</h2>
            <button className="sheet-x" onClick={onClose} aria-label="Close">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>

          <label>{isExam ? 'Exam title' : 'Homework title'}</label>
          <input ref={titleRef} type="text" className={err ? 'err' : ''} value={title}
            onChange={e => { setTitle(e.target.value); setErr(false); }} placeholder={isExam ? 'e.g. Midterm — Unit 3' : 'e.g. Exercises page 42'} autoComplete="off" />

          <label>Subject</label>
          {classSubjects.length > 0 &&
            <div className="subjchips">
              {classSubjects.map(cs =>
                <button type="button" key={cs.subject}
                  className={'schip2' + (subject.trim().toLowerCase() === cs.subject.toLowerCase() ? ' on' : '')}
                  onClick={() => pickSubject(cs.subject, cs.color)}>
                  <i style={{ background: cs.color || '#f5f5f7' }}></i>{cs.subject}
                </button>)}
            </div>}
          <input type="text" value={subject} onChange={e => onSubjectChange(e.target.value)}
            placeholder={classSubjects.length ? 'or type a new subject' : 'e.g. Mathematics'} autoComplete="off"
            style={color ? { color } : undefined} />
          <p className="field-help">
            {classSubjects.length
              ? 'Tap one of your schedule classes, or type one. You can leave it blank (homework with no class).'
              : 'Optional. Add classes in the Schedule tab to pick them here with one tap.'}
          </p>

          <label>Colour</label>
          <div className="swatches">
            <button type="button" className={'swatch none' + (color ? '' : ' on')} onClick={() => pickColor('')} title="Default (white)"></button>
            {COLORS.map(c =>
              <button type="button" key={c} className={'swatch' + (color === c ? ' on' : '')}
                style={{ background: c }} onClick={() => pickColor(c)} title={c}></button>)}
          </div>

          <label>Class / group (optional)</label>
          <input type="text" value={className} onChange={e => setClassName(e.target.value)} placeholder="e.g. 10-B · Group 7" autoComplete="off" />

          <label>{isExam ? 'Exam date' : 'Due / finish by'}</label>
          <input type="date" value={dueDate} onChange={e => setDueDate(e.target.value)} />

          <label>{isExam ? 'Topics / checklist' : 'Subtasks'}</label>
          {subtasks.map(st =>
            <div className="subtask-row" key={st.id}>
              <button type="button" className={'stcheck' + (st.done ? ' on' : '')} onClick={() => toggleSubtask(st.id)} aria-label="Toggle step">
                <svg viewBox="0 0 24 24" fill="none" strokeWidth="3.2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12l5 5L20 6"/></svg>
              </button>
              <input type="text" value={st.text} onChange={e => setSubtaskText(st.id, e.target.value)} placeholder={isExam ? 'Topic to study…' : 'Step…'} autoComplete="off" />
              <button type="button" className="strm" onClick={() => removeSubtask(st.id)} aria-label="Remove">✕</button>
            </div>)}
          <div className="file-btn wide" onClick={addSubtask}>＋ Add {isExam ? 'topic' : 'subtask'}</div>

          <label>Notes</label>
          <textarea value={notes} onChange={e => setNotes(e.target.value)} placeholder="Pages, questions, details…" />

          <label>Attachments — photos &amp; files</label>
          <div className="file-btns">
            <label className="file-btn">＋ Photo
              <input type="file" accept="image/*" capture="environment" multiple hidden onChange={e => { addFiles(e.target.files); e.target.value = ''; }} />
            </label>
            <label className="file-btn">＋ File
              <input type="file" multiple hidden onChange={e => { addFiles(e.target.files); e.target.value = ''; }} />
            </label>
          </div>
          {staged.length > 0 &&
            <div className="staged">
              {staged.map(a =>
                <div className="att" key={a.id}>
                  <span>{isImage(a) ? '🖼' : '📎'}</span>
                  <span className="name">{a.name}</span>
                  {a.text ? <span className="ok" title="Transcribed">✓</span> : null}
                  <span className="rm" onClick={() => removeStaged(a.id)}>✕</span>
                </div>)}
            </div>}
          {staged.some(a => isImage(a) && !a.text) &&
            <div className={'file-btn wide' + (ocr ? ' busy' : '')} onClick={ocr ? null : transcribeStaged}>
              {ocr ? ('Transcribing ' + ocr.i + '/' + ocr.n + ' · ' + ocr.pct + '%') : '⛯ Transcribe photo text → notes'}
            </div>}

          <div style={{ height: '78px' }}></div>
        </div>

        <div className="sheet-fabs">
          <button className="fab save" onClick={save} aria-label={initial ? 'Save changes' : ('Save ' + kindWord)}>

          </button>
        </div>
      </div>
    );
  }

  /* ---------- Card ---------- */
  function Card({ item, atts, onToggle, onEdit, onDelete, onChanged }) {
    const di = dueInfo(item.dueDate, item.done);
    const [ocr, setOcr] = useState(null);
    const [copied, setCopied] = useState(false);
    const images = atts.filter(isImage);
    const transcripts = atts.filter(a => a.text);
    const combinedText = transcripts.map(a => a.text.trim()).filter(Boolean).join('\n\n');
    const displayTitle = (item.title && item.title.trim()) || item.subject || '(untitled)';
    const showSubjectLine = item.title && item.title.trim() && item.subject;
    const isExam = item.kind === 'exam';
    const subs = item.subtasks || [];
    const subsDone = subs.filter(s => s.done).length;

    async function toggleSub(stId) {
      const subtasks = subs.map(s => s.id === stId ? { ...s, done: !s.done } : s);
      await putHW({ ...item, subtasks });
      await onChanged();
    }

    async function transcribeCard() {
      const todo = images.filter(a => !a.text);
      if (!todo.length) return;
      setOcr({ pct: 0, i: 0, n: todo.length });
      try {
        for (let i = 0; i < todo.length; i++) {
          const a = todo[i];
          const text = await transcribeBlob(a.blob, (pct) => setOcr({ pct, i: i + 1, n: todo.length }));
          await putAtt({ id: a.id, homeworkId: a.homeworkId, name: a.name, type: a.type, blob: a.blob, text });
        }
        await onChanged();
      } catch (e) {
        alert(e.message || 'Transcription failed.');
      } finally {
        setOcr(null);
      }
    }

    async function copyText() {
      if (!combinedText) return;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(combinedText);
        } else {
          const ta = document.createElement('textarea');
          ta.value = combinedText; ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
        }
        setCopied(true); setTimeout(() => setCopied(false), 1600);
      } catch (e) { alert('Could not copy automatically — long-press the text to copy.'); }
    }

    function downloadImages() {
      images.forEach((a, i) => setTimeout(() => {
        const link = document.createElement('a');
        link.href = a.url; link.download = a.name;
        document.body.appendChild(link); link.click(); link.remove();
      }, i * 500));
    }

    return (
      <div className="card">
        <div className={'hw' + (item.done ? ' done' : '')}>
          <button className="check" onClick={() => onToggle(item)} aria-label="Toggle done">
            <svg viewBox="0 0 24 24" fill="none" strokeWidth="3.2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12l5 5L20 6"/></svg>
          </button>
          <div className="body">
            <p className="title" style={!item.done && item.color ? { color: item.color } : undefined}>{displayTitle}</p>
            {showSubjectLine && <p className="subtitle" style={!item.done && item.color ? { color: item.color } : undefined}>{item.subject}</p>}
            {item.classNo && <p className="subtitle">{item.classNo}</p>}
            <div className="meta">
              {isExam && <span className="kind-tag exam">Exam</span>}
              {item.className && <span className="tag">{item.className}</span>}
              <span className={'due ' + di.cls}>{di.label}</span>
              {item.grade !== '' && item.grade != null && <span className="grade-tag">{item.grade} / {GRADE_MAX}</span>}
            </div>
            {subs.length > 0 &&
              <div className="subtasks">
                <span className="stitle">{isExam ? 'Topics' : 'Subtasks'} · {subsDone}/{subs.length}</span>
                {subs.map(st =>
                  <div key={st.id} className={'subtask' + (st.done ? ' done' : '')} onClick={() => toggleSub(st.id)}>
                    <span className="box"><svg viewBox="0 0 24 24" fill="none" strokeWidth="3.2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12l5 5L20 6"/></svg></span>
                    <span className="stx">{st.text}</span>
                  </div>)}
              </div>}
            {item.notes && <p className="notes">{item.notes}</p>}
            {atts.length > 0 &&
              <div className="attachments">
                {atts.map(a => isImage(a)
                  ? <a key={a.id} href={a.url} target="_blank" rel="noopener"><img className="thumb" src={a.url} alt={a.name} /></a>
                  : <a key={a.id} className="att" href={a.url} download={a.name}>📎 <span className="name">{a.name}</span></a>)}
              </div>}
            {combinedText &&
              <div className="transcript">
                <span className="tlabel">Transcribed text</span>{combinedText}
              </div>}
            {images.length > 0 &&
              <div className="photo-tools">
                {images.some(a => !a.text) &&
                  <button className={'link' + (ocr ? ' busy' : '')} onClick={ocr ? null : transcribeCard}>
                    {ocr ? ('Transcribing ' + ocr.i + '/' + ocr.n + ' · ' + ocr.pct + '%') : '⛯ Transcribe photos'}
                  </button>}
                {combinedText &&
                  <button className="link" onClick={copyText}>{copied ? '✓ Copied' : 'Copy text'}</button>}
                <button className="link" onClick={downloadImages}>Download {images.length > 1 ? 'images' : 'image'}</button>
              </div>}
            <div className="row-actions">
              <button className="link" onClick={() => onEdit(item)}>Edit</button>
              {item.dueDate && !item.done &&
                <button className="link" onClick={() => downloadICS(hwTitle(item).replace(/\s+/g, '_') + '.ics', buildICS([item]))}>🔔 Remind me</button>}
              <button className="link danger" onClick={() => onDelete(item)}>Delete</button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  /* ---------- Calendar view ---------- */
  const pad2c = (n) => String(n).padStart(2, '0');
  const toIso = (d) => d.getFullYear() + '-' + pad2c(d.getMonth()+1) + '-' + pad2c(d.getDate());

  function Calendar({ items, semesters, selId, onSelSem, onNewSem, onEditSem, onEditItem, onAddForDay }) {
    const today = new Date(); today.setHours(0,0,0,0);
    const todayIso = toIso(today);
    const sem = semesters.find(s => s.id === selId) || null;

    const [cursor, setCursor] = useState(() => {
      const base = sem ? new Date(sem.start + 'T00:00:00') : today;
      return new Date(base.getFullYear(), base.getMonth(), 1);
    });
    const [selDay, setSelDay] = useState(todayIso);

    useEffect(() => {
      if (sem) { const d = new Date(sem.start + 'T00:00:00'); setCursor(new Date(d.getFullYear(), d.getMonth(), 1)); }
    }, [selId]);

    const byDay = {};
    for (const it of items) if (it.dueDate) (byDay[it.dueDate] = byDay[it.dueDate] || []).push(it);

    const first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
    const startOffset = (first.getDay() + 6) % 7; // Monday-first
    const gridStart = new Date(first); gridStart.setDate(1 - startOffset);
    const cells = [];
    for (let i = 0; i < 42; i++) { const d = new Date(gridStart); d.setDate(gridStart.getDate() + i); cells.push(d); }

    const monthLabel = cursor.toLocaleDateString(LOC, { month: 'long', year: 'numeric' });
    const inSem = (iso) => sem ? (iso >= sem.start && iso <= sem.end) : true;
    const move = (n) => setCursor(new Date(cursor.getFullYear(), cursor.getMonth() + n, 1));

    let weekInfo = null, range = null;
    if (sem) {
      const s = new Date(sem.start + 'T00:00:00'), e = new Date(sem.end + 'T00:00:00');
      const fmt = (d) => d.toLocaleDateString(LOC, { month: 'short', day: 'numeric', year: 'numeric' });
      range = fmt(s) + ' — ' + fmt(e);
      const totalWeeks = Math.max(1, Math.ceil((e - s) / (7*86400000)) + 1);
      if (today >= s && today <= e) weekInfo = 'Week ' + (Math.floor((today - s) / (7*86400000)) + 1) + ' / ' + totalWeeks;
    }

    const dayItems = (byDay[selDay] || []).slice().sort((a,b) => (a.done?1:0) - (b.done?1:0));
    const fmtSel = new Date(selDay + 'T00:00:00').toLocaleDateString(LOC, { weekday: 'long', month: 'short', day: 'numeric' });

    return (
      <div className="cal-wrap">
        <div className="sembar">
          <button className={'schip' + (!selId ? ' on' : '')} onClick={() => onSelSem(null)}>All</button>
          {semesters.map(s => <button key={s.id} className={'schip' + (selId === s.id ? ' on' : '')} onClick={() => onSelSem(s.id)}>{s.name}</button>)}
          <button className="schip add" onClick={onNewSem}>＋ Semester</button>
        </div>
        {sem &&
          <div className="seminfo">
            <span>{range}</span>
            <span>{weekInfo && <span className="wk">{weekInfo}</span>} <button className="link" onClick={() => onEditSem(sem)}>Edit</button></span>
          </div>}

        <div className="cal-head">
          <button className="cal-nav" onClick={() => move(-1)} aria-label="Previous month">‹</button>
          <span className="mlabel">{monthLabel}</span>
          <button className="cal-nav" onClick={() => move(1)} aria-label="Next month">›</button>
        </div>

        <div className="cal-grid">
          {DAYS_SHORT.map(d => <div key={d} className="cal-dow">{d}</div>)}
          {cells.map((d, i) => {
            const iso = toIso(d);
            const out = d.getMonth() !== cursor.getMonth();
            const its = byDay[iso] || [];
            const cls = ['cal-cell'];
            if (out) cls.push('out');
            if (!inSem(iso)) cls.push('dim');
            if (iso === todayIso) cls.push('today');
            if (iso === selDay) cls.push('sel');
            return (
              <div key={i} className={cls.join(' ')} onClick={() => setSelDay(iso)}>
                <span className="dnum">{d.getDate()}</span>
                {its.length > 0 &&
                  <div className="cal-dots">
                    {its.slice(0,4).map((it, j) => <i key={j} style={{ background: it.done ? '#555' : (it.color || '#f5f5f7') }}></i>)}
                    {its.length > 4 && <span className="cal-more">+{its.length - 4}</span>}
                  </div>}
              </div>
            );
          })}
        </div>

        <div className="day-detail">
          <h3>{fmtSel}</h3>
          {dayItems.length
            ? dayItems.map(it =>
                <div key={it.id} className={'drow' + (it.done ? ' done' : '')} onClick={() => onEditItem(it)}>
                  <span className="dot" style={{ background: it.color || '#f5f5f7' }}></span>
                  <span className="dsub">{(it.title && it.title.trim()) || it.subject || '(untitled)'}</span>
                  {it.subject && it.title && it.title.trim() && <span className="dmeta">{it.subject}</span>}
                </div>)
            : <div className="day-empty">Nothing due this day.</div>}
          <button className="link add-day" onClick={() => onAddForDay(selDay)}>＋ Add for this day</button>
        </div>
      </div>
    );
  }

      </div>

  }

  /* ---------- Render the weekly schedule to a downloadable image ---------- */
  function renderScheduleImage(title, days, byDay) {
    const draw = () => {
      const scale = 3, pad = 46, colW = 184, gap = 12, titleH = 88, dayHeadH = 40, cardH = 82, cardGap = 8;
      const N = days.length;
      const W = pad * 2 + N * colW + (N - 1) * gap;
      const maxRows = Math.max(1, ...days.map(d => (byDay[d] || []).length));
      const H = pad + titleH + dayHeadH + maxRows * (cardH + cardGap) - cardGap + pad;
      const canvas = document.createElement('canvas');
      canvas.width = W * scale; canvas.height = H * scale;
      const ctx = canvas.getContext('2d'); ctx.scale(scale, scale);
      ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1;
      for (let x = 0; x <= W; x += 48) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = 0; y <= H; y += 48) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

      const clip = (text, maxW) => {
        if (ctx.measureText(text).width <= maxW) return text;
        let t = text;
        while (t.length && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
        return t + '…';
      };

      ctx.fillStyle = '#f5f5f7'; ctx.font = '700 38px Inter, -apple-system, sans-serif';
      ctx.fillText(clip(title, W - pad * 2), pad, pad + 34);
      ctx.fillStyle = '#7a7a80'; ctx.font = '500 16px "JetBrains Mono", ui-monospace, monospace';
      ctx.fillText('WEEKLY SCHEDULE', pad, pad + 62);

      const gridTop = pad + titleH;
      days.forEach((d, i) => {
        const x = pad + i * (colW + gap);
        ctx.fillStyle = '#f5f5f7'; ctx.font = '700 18px Inter, sans-serif';
        ctx.fillText(DAYS_SHORT[d].toUpperCase(), x, gridTop + 20);
        ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.beginPath(); ctx.moveTo(x, gridTop + 32); ctx.lineTo(x + colW, gridTop + 32); ctx.stroke();
        let cy = gridTop + dayHeadH;
        for (const c of (byDay[d] || [])) {
          const col = c.color || '#f5f5f7';
          ctx.fillStyle = 'rgba(255,255,255,0.03)'; ctx.fillRect(x, cy, colW, cardH);
          ctx.fillStyle = col; ctx.fillRect(x, cy, 4, cardH);
          ctx.fillStyle = '#9a9aa2'; ctx.font = '500 14px "JetBrains Mono", ui-monospace, monospace';
          ctx.fillText(c.start + '–' + c.end, x + 13, cy + 24);
          ctx.fillStyle = col; ctx.font = '700 19px Inter, sans-serif';
          ctx.fillText(clip(c.subject, colW - 24), x + 13, cy + 49);
          if (c.room) { ctx.fillStyle = '#7a7a80'; ctx.font = '400 13px Inter, sans-serif'; ctx.fillText(clip(c.room, colW - 24), x + 13, cy + 70); }
          cy += cardH + cardGap;
        }
      });

      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'schedule.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      }, 'image/png');
    };
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(draw);
  }

  /* ---------- Grades: render averages to a downloadable widget image ---------- */
  function renderGradesImage(title, rows) {
    const draw = () => {
      const scale = 3, pad = 48, W = 680, headH = 118, rowH = 78, rowGap = 10;
      const bodyH = rows.length ? (rows.length * (rowH + rowGap) - rowGap) : 40;
      const H = pad + headH + bodyH + pad;
      const canvas = document.createElement('canvas'); canvas.width = W * scale; canvas.height = H * scale;
      const ctx = canvas.getContext('2d'); ctx.scale(scale, scale); ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1;
      for (let x = 0; x <= W; x += 48) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = 0; y <= H; y += 48) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
      const clip = (t, m) => { if (ctx.measureText(t).width <= m) return t; let s = t; while (s.length && ctx.measureText(s + '…').width > m) s = s.slice(0, -1); return s + '…'; };
      ctx.fillStyle = '#f5f5f7'; ctx.font = '700 40px Inter, -apple-system, sans-serif'; ctx.fillText(clip(title, W - pad * 2), pad, pad + 36);
      ctx.fillStyle = '#7a7a80'; ctx.font = '500 16px "JetBrains Mono", ui-monospace, monospace'; ctx.fillText('GRADES · 0–20', pad, pad + 64);
      let y = pad + headH;
      for (const r of rows) {
        const col = r.color || '#f5f5f7';
        ctx.fillStyle = 'rgba(255,255,255,0.03)'; ctx.fillRect(pad, y, W - pad * 2, rowH);
        ctx.fillStyle = col; ctx.fillRect(pad, y, 5, rowH);
        ctx.fillStyle = '#f5f5f7'; ctx.font = '600 23px Inter, sans-serif'; ctx.fillText(clip(r.subject, W - pad * 2 - 170), pad + 20, y + 34);
        ctx.fillStyle = '#7a7a80'; ctx.font = '400 13px Inter, sans-serif'; ctx.fillText(r.count + (r.count === 1 ? ' grade' : ' grades'), pad + 20, y + 58);
        const avgStr = r.avg == null ? '—' : r.avg.toFixed(1);
        ctx.textAlign = 'right'; ctx.fillStyle = r.avg == null ? '#55555c' : col; ctx.font = '700 32px Inter, sans-serif';
        ctx.fillText(avgStr, W - pad - 16, y + 42);
        ctx.fillStyle = '#7a7a80'; ctx.font = '500 14px "JetBrains Mono", ui-monospace, monospace'; ctx.fillText('/ 20', W - pad - 16, y + 63);
        ctx.textAlign = 'left';
        y += rowH + rowGap;
      }
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'grades.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      }, 'image/png');
    };
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(draw);
  }

  /* ---------- A single 0–20 grade box that saves on blur ---------- */
  function GradeInput({ item, onCommit }) {
    const initV = item.grade == null ? '' : String(item.grade);
    const [v, setV] = useState(initV);
    useEffect(() => { setV(item.grade == null ? '' : String(item.grade)); }, [item.grade]);
    const commit = () => {
      let s = v.trim().replace(',', '.');
      if (s !== '') {
        let n = parseFloat(s);
        if (isNaN(n)) s = ''; else { n = Math.max(0, Math.min(GRADE_MAX, n)); s = String(Math.round(n * 100) / 100); }
      }
      if (s !== (item.grade == null ? '' : String(item.grade))) onCommit(item, s);
      setV(s);
    };
    return <input className="grade-in" type="text" inputMode="decimal" value={v}
      onChange={e => setV(e.target.value)} onBlur={commit} placeholder="—" aria-label="Grade" />;
  }

  /* ---------- Grades view (only for classes you created; 0–20 scale) ---------- */
  function Grades({ items, classes, onSetGrade, onEditItem }) {
    const subjects = []; const seen = new Set();
    for (const c of classes) { const k = (c.subject || '').trim().toLowerCase(); if (k && !seen.has(k)) { seen.add(k); subjects.push({ key: k, subject: c.subject.trim(), color: c.color || '' }); } }
    const bySubj = {};
    for (const it of items) { const k = (it.subject || '').trim().toLowerCase(); if (seen.has(k)) (bySubj[k] = bySubj[k] || []).push(it); }
    const num = (g) => { if (g === '' || g == null) return null; const n = parseFloat(String(g)); return isNaN(n) ? null : n; };
    const avgOf = (list) => { const gs = (list || []).map(x => num(x.grade)).filter(n => n !== null); if (!gs.length) return null; return gs.reduce((a, b) => a + b, 0) / gs.length; };
    const subjAvgs = subjects.map(s => avgOf(bySubj[s.key])).filter(a => a !== null);
    const overall = subjAvgs.length ? (subjAvgs.reduce((a, b) => a + b, 0) / subjAvgs.length) : null;
    const widgetRows = subjects.map(s => { const list = bySubj[s.key] || []; return { subject: s.subject, color: s.color, avg: avgOf(list), count: list.filter(x => num(x.grade) !== null).length }; });
    const titleFor = (it) => (it.title && it.title.trim()) || it.subject || '(untitled)';

    if (!classes.length) {
      return <div className="grades-wrap"><div className="day-empty">Create classes in the Schedule tab first. Then every homework and exam for those classes shows up here with a box for its grade (0–{GRADE_MAX}).</div></div>;
    }

    return (
      <div className="grades-wrap">
        <div className="grades-overall">
          <span className="gnum">{overall == null ? '—' : overall.toFixed(1)}<small> / {GRADE_MAX}</small></span>
          <span className="glabel">Overall<br/>average</span>
        </div>
        {subjects.map(s => {
          const list = (bySubj[s.key] || []).slice().sort((a, b) => (a.dueDate || '').localeCompare(b.dueDate || ''));
          const a = avgOf(list);
          return (
            <div className="grade-sec" key={s.key}>
              <div className="grade-head">
                <span className="grade-subj" style={s.color ? { color: s.color } : undefined}>{s.subject}</span>
                <span className="grade-avg">{a == null ? '—' : a.toFixed(1)} / {GRADE_MAX}</span>
              </div>
              {list.length ? list.map(it =>
                <div className="grade-row" key={it.id}>
                  <span className="grade-kind">{it.kind === 'exam' ? 'EXAM' : 'HW'}</span>
                  <span className="grade-name" onClick={() => onEditItem(it)}>{titleFor(it)}</span>
                  <GradeInput item={it} onCommit={onSetGrade} />
                  <span className="grade-slash">/ {GRADE_MAX}</span>
                </div>) : <div className="day-empty">No homework or exams yet for this class.</div>}
            </div>
          );
        })}
        <div className="grades-actions">
          <button className="btn primary" onClick={() => renderGradesImage('Grades', widgetRows)}>⬇ Download grades widget</button>
        </div>
        <p className="sched-note">Save the image, then add it with a photo‑widget app (e.g. Widgetsmith) to see your averages on your home screen.</p>
      </div>
    );
  }

  /* ---------- App ---------- */
  function App() {
    const [items, setItems] = useState([]);
    const [attsByHw, setAttsByHw] = useState({});
    const [filter, setFilter] = useState('todo');
    const [search, setSearch] = useState('');
    const [sheet, setSheet] = useState(null);
    const [addMenu, setAddMenu] = useState(false);
    const [mode, setMode] = useState('list');           // 'list' | 'exams' | 'grades' | 'cal' | 'sched'
    const [semesters, setSemesters] = useState([]);
    const [selSem, setSelSem] = useState(() => localStorage.getItem('hw_sem') || null);
    const [semSheet, setSemSheet] = useState(null);
    const [classes, setClasses] = useState([]);
    const [classSheet, setClassSheet] = useState(null);
    const urlsRef = useRef([]);
    const importRef = useRef(null);

    const load = useCallback(async () => {
      const [hw, atts, sems, cls] = [await getAllHW(), await getAllAtts(), await getAllSem(), await getAllClasses()];
      urlsRef.current.forEach(URL.revokeObjectURL); urlsRef.current = [];
      const map = {};
      for (const a of atts) {
        const url = URL.createObjectURL(a.blob); urlsRef.current.push(url);
        (map[a.homeworkId] ||= []).push({ ...a, url });
      }
      setItems(hw); setAttsByHw(map);
      setSemesters(sems.slice().sort((a, b) => (a.start || '').localeCompare(b.start || '')));
      setClasses(cls);
    }, []);

    useEffect(() => { openDB().then(d => { db = d; load(); }); }, []);

    const chooseSem = (id) => { setSelSem(id); if (id) localStorage.setItem('hw_sem', id); else localStorage.removeItem('hw_sem'); };
    const deleteSem = async (s) => {
      if (!confirm('Delete this semester? (Your homework is not deleted.)')) return;
      await delSemRec(s.id);
      if (selSem === s.id) chooseSem(null);
      setSemSheet(null); load();
    };
    const deleteClass = async (c) => {
      if (!confirm('Delete this class?')) return;
      await delClassRec(c.id); setClassSheet(null); load();
    };

    const homeworkItems = items.filter(i => (i.kind || 'homework') !== 'exam');
    const examItems = items.filter(i => i.kind === 'exam');
    const openCount = homeworkItems.filter(i => !i.done).length;

    // remember the colour last used for each subject, so new entries match
    const subjectColors = {};
    for (const c of classes) if (c.subject && c.color) subjectColors[c.subject.trim().toLowerCase()] = c.color;
    for (const i of items) if (i.subject && i.color) subjectColors[i.subject.trim().toLowerCase()] = i.color;

    // subjects you can tap-to-pick when adding homework, taken from your schedule classes
    const classSubjects = [];
    const seenSubj = new Set();
    for (const c of classes) {
      const key = (c.subject || '').trim().toLowerCase();
      if (key && !seenSubj.has(key)) { seenSubj.add(key); classSubjects.push({ subject: c.subject.trim(), color: c.color || '' }); }
    }

    function remindAll() {
      const ics = buildICS(items.filter(i => !i.done && i.dueDate));
      if (!ics) { alert('No upcoming homework with a due date to add.'); return; }
      downloadICS('homework.ics', ics);
    }

    const sortByDue = (a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      const ad = a.dueDate || '9999-99-99', bd = b.dueDate || '9999-99-99';
      if (ad !== bd) return ad < bd ? -1 : 1;
      return (a.createdAt||0) - (b.createdAt||0);
    };
    let view = homeworkItems.filter(i => filter === 'all' ? true : filter === 'done' ? i.done : !i.done);
    if (search.trim()) {
      const t = search.toLowerCase();
      view = view.filter(i => (i.title||'').toLowerCase().includes(t) || (i.subject||'').toLowerCase().includes(t) ||
        (i.classNo||'').toLowerCase().includes(t) ||
        (i.className||'').toLowerCase().includes(t) || (i.notes||'').toLowerCase().includes(t));
    }
    view = view.slice().sort(sortByDue);
    const examView = examItems.slice().sort(sortByDue);

    const toggle = async (it) => { await putHW({ ...it, done: !it.done }); load(); };
    const setGrade = async (it, grade) => { await putHW({ ...it, grade }); load(); };
    const del = async (it) => {
      if (!confirm('Delete this item and its attachments?')) return;
      for (const a of await getAttsFor(it.id)) await delAtt(a.id);
      await delHWrec(it.id); load();
    };

    async function exportData() {
      const hw = await getAllHW(), atts = await getAllAtts(), sems = await getAllSem(), cls = await getAllClasses();
      const toB64 = (blob) => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(blob); });
      const attOut = [];
      for (const a of atts) attOut.push({ id: a.id, homeworkId: a.homeworkId, name: a.name, type: a.type, text: a.text || '', data: await toB64(a.blob) });
      const blob = new Blob([JSON.stringify({ version: 2, exportedAt: new Date().toISOString(), homework: hw, attachments: attOut, semesters: sems, classes: cls })], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'homework-backup-' + new Date().toISOString().slice(0,10) + '.json'; a.click();
      URL.revokeObjectURL(url);
    }
    async function importData(file) {
      const data = JSON.parse(await file.text());
      if (!data.homework) { alert('That does not look like a homework backup.'); return; }
      for (const h of data.homework) await putHW(h);
      for (const a of (data.attachments||[])) {
        const blob = await (await fetch(a.data)).blob();
        await putAtt({ id: a.id, homeworkId: a.homeworkId, name: a.name, type: a.type, text: a.text || '', blob });
      }
      for (const s of (data.semesters||[])) await putSem(s);
      for (const c of (data.classes||[])) await putClass(c);
      alert('Restore complete!'); load();
    }

    return (
      <React.Fragment>
        <header>
          <div className="brand">
            <Ghost />
            <div className="wordmark">HOME<br/>W<span className="ring"></span>RK</div>
          </div>
          <div className="viewtabs">
            <button className={mode === 'list' ? 'active' : ''} onClick={() => setMode('list')}>Homework</button>
            <button className={mode === 'exams' ? 'active' : ''} onClick={() => setMode('exams')}>Exams</button>
            <button className={mode === 'grades' ? 'active' : ''} onClick={() => setMode('grades')}>Grades</button>
            <button className={mode === 'cal' ? 'active' : ''} onClick={() => setMode('cal')}>Calendar</button>
            <button className={mode === 'sched' ? 'active' : ''} onClick={() => setMode('sched')}>Schedule</button>
          </div>
        </header>

        <main>
          {mode === 'list' ? (
            <React.Fragment>
              <div className="toolbar">
                <input className="search" placeholder="Search homework…" value={search} onChange={e => setSearch(e.target.value)} />
              </div>
              <div className="filters">
                {[['todo','To do'],['done','Done'],['all','All']].map(([f,lbl]) =>
                  <button key={f} className={filter === f ? 'active' : ''} onClick={() => setFilter(f)}>{lbl}</button>)}
              </div>

              {view.length === 0
                ? <div className="empty">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.3"><rect x="4" y="4" width="16" height="16"/><path d="M8 9h8M8 13h6"/></svg>
                    <p>{filter === 'todo' ? 'All caught up' : 'Nothing here yet'}</p>
                  </div>
                : view.map(it => <Card key={it.id} item={it} atts={attsByHw[it.id] || []} onToggle={toggle} onEdit={(i)=>setSheet({editing:i})} onDelete={del} onChanged={load} />)}

              <div className="footer-tools">
                <button className="link" onClick={remindAll}>🔔 Add to Calendar</button>
                <button className="link" onClick={exportData}>Backup</button>
                <button className="link" onClick={() => importRef.current.click()}>Restore</button>
                <input ref={importRef} type="file" accept="application/json" hidden onChange={e => { if (e.target.files[0]) importData(e.target.files[0]); e.target.value = ''; }} />
              </div>
            </React.Fragment>
          ) : mode === 'exams' ? (
            <React.Fragment>
              <div className="sched-head"><span className="mlabel">Exams</span></div>
              {examView.length === 0
                ? <div className="empty">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.3"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>
                    <p>No exams yet — tap ＋ and pick Exam</p>
                  </div>
                : examView.map(it => <Card key={it.id} item={it} atts={attsByHw[it.id] || []} onToggle={toggle} onEdit={(i)=>setSheet({editing:i})} onDelete={del} onChanged={load} />)}
            </React.Fragment>
          ) : mode === 'grades' ? (
            <Grades items={items} classes={classes} onSetGrade={setGrade} onEditItem={(i)=>setSheet({editing:i})} />
          ) : mode === 'cal' ? (
            <Calendar items={items} semesters={semesters} selId={selSem}
              onSelSem={chooseSem} onNewSem={() => setSemSheet({})} onEditSem={(s) => setSemSheet({ editing: s })}
              onEditItem={(i) => setSheet({ editing: i })} onAddForDay={(iso) => setSheet({ date: iso })} />
          ) : (
            <Schedule classes={classes} semesters={semesters} selId={selSem}
              onNew={() => setClassSheet({})} onEdit={(c) => setClassSheet({ editing: c })} />
          )}
        </main>

        <button className="add" onClick={() => setAddMenu(true)} aria-label="Add">＋</button>
        {addMenu &&
          <div className="addmenu-backdrop" onClick={() => setAddMenu(false)}>
            <div className="addmenu" onClick={e => e.stopPropagation()}>
              <button onClick={() => { setAddMenu(false); setSheet({ newKind: 'exam' }); }}>📝 New exam</button>
              <button onClick={() => { setAddMenu(false); setSheet({ newKind: 'homework' }); }}>📓 New homework</button>
            </div>
          </div>}

        {sheet && <Sheet initial={sheet.editing || null} prefillDate={sheet.date || ''} newKind={sheet.newKind || 'homework'} subjectColors={subjectColors} classSubjects={classSubjects} onClose={() => setSheet(null)} onSaved={() => { setSheet(null); load(); }} />}
        {semSheet && <SemesterSheet initial={semSheet.editing || null} onClose={() => setSemSheet(null)} onDelete={deleteSem} onSaved={(id) => { setSemSheet(null); chooseSem(id); load(); }} />}
        {classSheet && <ClassSheet initial={classSheet.editing || null} subjectColors={subjectColors} onClose={() => setClassSheet(null)} onDelete={deleteClass} onSaved={() => { setClassSheet(null); load(); }} />}
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
  </script>

  <script>
    // Transform and run the app source manually (classic JSX runtime, since
    // React is loaded as a plain global, not an ES module).
    var src = document.getElementById('app-source').textContent;
    var out = Babel.transform(src, {
      presets: [['react', { runtime: 'classic' }]]
    }).code;
    var s = document.createElement('script');
    s.text = out;
    document.head.appendChild(s);
  </script>
</body>
</html>
