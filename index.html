  <div class="ticks"><span class="tl"></span><span class="tr"></span></div>
  <div class="watermark mono">Alex__dem0n</div>

  <div id="root"><div id="boot" class="boot-msg mono">Loading<span class="dots"></span></div></div>

  <script>
    // Surface real script/runtime failures instead of leaving a blank screen.
    window.addEventListener('error', function (e) {
      var boot = document.getElementById('boot');
      if (!boot) return;
      var where = e.filename ? e.filename.split('/').pop() + (e.lineno ? ':' + e.lineno : '') : (e.target && e.target.src ? e.target.src.split('/').pop() : 'unknown file');
      var msg = e.message || (e.error && e.error.message) || 'a script failed to load';
      boot.innerHTML = "Something went wrong loading the app.<br><span style='opacity:.7'>" +
        String(msg).replace(/</g, '&lt;') + "<br>(" + where.replace(/</g, '&lt;') + ")</span><br>Please screenshot this and send it back.";
    }, true);
    setTimeout(function () {
      var boot = document.getElementById('boot');
      if (boot && !window.React) {
        boot.innerHTML = "Still loading&hellip; this can take a few seconds on a slow connection.<br>If this doesn't go away, check your connection and reload.";
      }
    }, 8000);
  </script>

  <!-- React + Babel, bundled locally (no CDN dependency, no build step needed) -->
  <script src="./vendor/react.production.min.js"></script>
  <script src="./vendor/react-dom.production.min.js"></script>
  <script src="./vendor/babel.min.js"></script>

  <script type="text/plain" id="app-source">
  const { useState, useEffect, useRef, useCallback } = React;

  const LOC = 'en-US';
  const GRADE_MAX = 20; // Venezuela 0–20 scale
  const CORTES = [1, 2, 3];
  const DEFAULT_CORTE_W = [15, 35, 55];                     // % each corte is worth
  const maxOf = (o) => { const m = Number(o.max); return isFinite(m) && m > 0 ? m : GRADE_MAX; };
  const corteOf = (o) => { const c = Number(o.corte); return (c === 2 || c === 3) ? c : 1; };
  const gradeNum = (g) => { if (g === '' || g == null) return null; const n = parseFloat(String(g).replace(',', '.')); return isNaN(n) ? null : n; };

  /* How much each corte is worth. Editable, remembered on this phone. */
  function loadCorteW() {
    try {
      const raw = JSON.parse(localStorage.getItem('corte_w') || 'null');
      if (Array.isArray(raw) && raw.length === 3 && raw.every(n => isFinite(n) && n >= 0)) return raw.map(Number);
    } catch (e) {}
    return DEFAULT_CORTE_W.slice();
  }
  const saveCorteW = (w) => { try { localStorage.setItem('corte_w', JSON.stringify(w)); } catch (e) {} };

  /* One corte's score on the 0–20 scale: all the points you earned in it
     divided by all the points that were on the table, then scaled to 20. */
  function corteScore(list) {
    let got = 0, poss = 0, n = 0;
    for (const it of (list || [])) {
      const g = gradeNum(it.grade);
      if (g === null) continue;
      got += g; poss += maxOf(it); n++;
    }
    if (!n || poss <= 0) return null;
    return { score: (got / poss) * GRADE_MAX, got, poss, n };
  }

  /* A class, corte by corte. `current` renormalises over the cortes you have
     grades in, so an unfinished semester is not dragged down by empty ones.
     `locked` is how many of the final 20 points are already banked. */
  function classGrade(list, weights) {
    const per = CORTES.map(c => corteScore((list || []).filter(it => corteOf(it) === c)));
    let wSum = 0, wScore = 0, locked = 0;
    per.forEach((p, i) => {
      const w = Number(weights[i]) || 0;
      if (!p) return;
      wSum += w; wScore += p.score * w;
      locked += p.score * w / 100;
    });
    return { per, current: wSum > 0 ? wScore / wSum : null, locked, weighted: wSum };
  }

  /* ---------- IndexedDB ---------- */
  const DB_NAME = 'homework-tracker', DB_VER = 5;
  let db;
  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('homework')) d.createObjectStore('homework', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('attachments')) {
          const s = d.createObjectStore('attachments', { keyPath: 'id' });
          s.createIndex('homeworkId', 'homeworkId', { unique: false });
        }
        if (!d.objectStoreNames.contains('semesters')) d.createObjectStore('semesters', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('classes')) d.createObjectStore('classes', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('notes')) d.createObjectStore('notes', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('ideas')) d.createObjectStore('ideas', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('wallets')) d.createObjectStore('wallets', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('transactions')) d.createObjectStore('transactions', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('subs')) d.createObjectStore('subs', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('habits')) d.createObjectStore('habits', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('hlog')) d.createObjectStore('hlog', { keyPath: 'key' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  // generic per-store helpers for the newer modules
  const allOf = (s) => reqP(store(s, 'readonly').getAll());
  const putIn = (s, o) => reqP(store(s, 'readwrite').put(o));
  const delFrom = (s, id) => reqP(store(s, 'readwrite').delete(id));
  const store = (s, m) => db.transaction(s, m).objectStore(s);
  const reqP = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const getAllHW = () => reqP(store('homework', 'readonly').getAll());
  const putHW = (o) => reqP(store('homework', 'readwrite').put(o));
  const delHWrec = (id) => reqP(store('homework', 'readwrite').delete(id));
  const putAtt = (o) => reqP(store('attachments', 'readwrite').put(o));
  const delAtt = (id) => reqP(store('attachments', 'readwrite').delete(id));
  const getAllAtts = () => reqP(store('attachments', 'readonly').getAll());
  const getAttsFor = (hwId) => reqP(store('attachments', 'readonly').index('homeworkId').getAll(IDBKeyRange.only(hwId)));
  const getAllSem = () => reqP(store('semesters', 'readonly').getAll());
  const putSem = (o) => reqP(store('semesters', 'readwrite').put(o));
  const delSemRec = (id) => reqP(store('semesters', 'readwrite').delete(id));
  const getAllClasses = () => reqP(store('classes', 'readonly').getAll());
  const putClass = (o) => reqP(store('classes', 'readwrite').put(o));
  const delClassRec = (id) => reqP(store('classes', 'readwrite').delete(id));
  const getAllNotes = () => reqP(store('notes', 'readonly').getAll());
  const putNote = (o) => reqP(store('notes', 'readwrite').put(o));
  const delNoteRec = (id) => reqP(store('notes', 'readwrite').delete(id));

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const isImage = (a) => (a.type || '').startsWith('image/');

  /* ---------- On-device OCR (Tesseract.js, loaded on first use) ---------- */
  const OCR_LANGS = 'eng+spa';
  let _tessPromise = null;
  function loadTesseract() {
    if (window.Tesseract) return Promise.resolve(window.Tesseract);
    if (_tessPromise) return _tessPromise;
    _tessPromise = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
      s.onload = () => res(window.Tesseract);
      s.onerror = () => { _tessPromise = null; rej(new Error('Could not load the transcriber. Check your connection and try again.')); };
      document.head.appendChild(s);
    });
    return _tessPromise;
  }
  // Clean up a photo before OCR: right-size it, convert to grayscale, and boost
  // contrast. This noticeably improves recognition of printed/typed text.
  function preprocessForOCR(blob) {
    return new Promise((resolve) => {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if (!w || !h) { URL.revokeObjectURL(url); resolve(blob); return; }
        const longest = Math.max(w, h);
        let s = 1800 / longest;                 // aim ~1800px on the long edge
        s = Math.max(0.5, Math.min(s, 3));      // upscale small photos, shrink huge ones
        w = Math.round(w * s); h = Math.round(h * s);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        try {
          const id = ctx.getImageData(0, 0, w, h), d = id.data;
          for (let i = 0; i < d.length; i += 4) {
            let g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
            g = (g - 128) * 1.35 + 132;         // contrast + slight brighten
            g = g < 0 ? 0 : g > 255 ? 255 : g;
            d[i] = d[i + 1] = d[i + 2] = g;
          }
          ctx.putImageData(id, 0, 0);
        } catch (e) { /* ignore */ }
        URL.revokeObjectURL(url);
        c.toBlob((b) => resolve(b || blob), 'image/png');
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(blob); };
      img.src = url;
    });
  }
  async function transcribeBlob(blob, onProgress) {
    const T = await loadTesseract();
    let img = blob;
    try { img = await preprocessForOCR(blob); } catch (e) { img = blob; }
    const { data } = await T.recognize(img, OCR_LANGS, {
      logger: (m) => { if (m.status === 'recognizing text' && onProgress) onProgress(Math.round(m.progress * 100)); }
    });
    return (data.text || '').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  }

  const fmtDate = (iso) => iso ? new Date(iso + 'T00:00:00').toLocaleDateString(LOC, { month: 'short', day: 'numeric' }) : '';
  function dueInfo(iso, done) {
    if (!iso) return { cls: '', label: 'No date' };
    const today = new Date(); today.setHours(0,0,0,0);
    const days = Math.round((new Date(iso + 'T00:00:00') - today) / 86400000);
    if (done) return { cls: '', label: fmtDate(iso) };
    if (days < 0) return { cls: 'overdue', label: 'Overdue · ' + fmtDate(iso) };
    if (days === 0) return { cls: 'soon', label: 'Today' };
    if (days === 1) return { cls: 'soon', label: 'Tomorrow' };
    if (days <= 3) return { cls: 'soon', label: 'In ' + days + ' days' };
    return { cls: '', label: fmtDate(iso) };
  }
  // Exam urgency for the calendar: red at ≤1 day, orange at ≤3 days, otherwise days-left.
  function examUrgency(iso) {
    if (!iso) return { cls: '', label: 'Exam' };
    const today = new Date(); today.setHours(0,0,0,0);
    const days = Math.round((new Date(iso + 'T00:00:00') - today) / 86400000);
    if (days < 0) return { cls: 'red', label: 'Past' };
    if (days === 0) return { cls: 'red', label: 'Today!' };
    if (days === 1) return { cls: 'red', label: 'Tomorrow!' };
    if (days <= 3) return { cls: 'orange', label: 'In ' + days + ' days' };
    return { cls: '', label: days + ' days left' };
  }

  /* ---------- Subject colours & days ---------- */
  const COLORS = ['#e06666', '#e9a23b', '#ead24a', '#5fd08a', '#5cc7e0', '#7aa2ff', '#b98bff', '#ff8ac4'];
  const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  const DAYS_SHORT = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

  /* ---------- Calendar reminders (.ics — real iOS notifications via Calendar) ---------- */
  const pad2 = (n) => String(n).padStart(2, '0');
  const icsEsc = (s) => String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
  function icsStamp(d) {
    return d.getUTCFullYear() + pad2(d.getUTCMonth()+1) + pad2(d.getUTCDate()) + 'T' +
           pad2(d.getUTCHours()) + pad2(d.getUTCMinutes()) + pad2(d.getUTCSeconds()) + 'Z';
  }
  const icsLocal = (iso, h, m) => iso.replace(/-/g, '') + 'T' + pad2(h) + pad2(m) + '00';
  function hwTitle(item) { return (item.title && item.title.trim()) || item.subject || 'Homework'; }
  function vevent(item) {
    if (!item.dueDate) return '';
    const summary = 'Homework: ' + hwTitle(item);
    const desc = [item.subject ? ('Subject: ' + item.subject) : '', item.className ? ('Class: ' + item.className) : '', item.notes || ''].filter(Boolean).join('\\n');
    const alarm = (trig) => ['BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(summary), 'TRIGGER:' + trig, 'END:VALARM'];
    return [
      'BEGIN:VEVENT',
      'UID:' + item.id + '@homework-tracker',
      'DTSTAMP:' + icsStamp(new Date()),
      'DTSTART:' + icsLocal(item.dueDate, 8, 0),
      'DTEND:' + icsLocal(item.dueDate, 8, 30),
      'SUMMARY:' + icsEsc(summary),
      desc ? ('DESCRIPTION:' + desc) : '',
      ...alarm('-P1D'),
      ...alarm('PT0S'),
      'END:VEVENT'
    ].filter(Boolean).join('\r\n');
  }
  function buildICS(items) {
    const events = items.map(vevent).filter(Boolean);
    if (!events.length) return null;
    return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Homework Tracker//EN', 'CALSCALE:GREGORIAN', ...events, 'END:VCALENDAR'].join('\r\n');
  }
  function downloadICS(filename, text) {
    const blob = new Blob([text], { type: 'text/calendar' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  /* ---------- Flickering wordmark letters (failing-bulb effect) ---------- */
  function Flick({ text }) {
    return text.split('').map((ch, i) =>
      <span key={i} className="fl" style={{ animationDelay: ((i * 0.83 + (ch.charCodeAt(0) % 7) * 0.31) % 5).toFixed(2) + 's' }}>{ch}</span>);
  }

  /* ---------- Ghost logo ---------- */
  function Ghost() {
    return (
      <svg className="ghost" viewBox="0 0 24 24" fill="#f5f5f7" aria-hidden="true">
        <path d="M3 21V11a9 9 0 0 1 18 0v10l-3-2-3 2-3-2-3 2-3-2Z"/>
        <circle cx="9" cy="10.5" r="1.35" fill="#000"/>
        <circle cx="15" cy="10.5" r="1.35" fill="#000"/>
      </svg>
    );
  }

  /* ---------- A notepad that grows as you type, so nothing is hidden ---------- */
  function Notepad({ value, onChange, placeholder, minHeight }) {
    const ref = useRef(null);
    const fit = () => { const el = ref.current; if (!el) return; el.style.height = 'auto'; el.style.height = Math.max(minHeight || 150, el.scrollHeight) + 'px'; };
    useEffect(fit, [value]);
    return <textarea ref={ref} className="notepad" value={value || ''} placeholder={placeholder}
      style={{ minHeight: (minHeight || 150) + 'px' }}
      onChange={e => { onChange(e.target.value); fit(); }} />;
  }

  /* ---------- Sheet (add / edit homework) ---------- */
  function Sheet({ initial, subjectColors, classSubjects, prefillDate, newKind, onClose, onSaved }) {
    const kind = initial ? (initial.kind || 'homework') : (newKind || 'homework');
    const isExam = kind === 'exam';
    const kindWord = isExam ? 'exam' : 'homework';
    const [title, setTitle] = useState(initial ? (initial.title || '') : '');
    const [subject, setSubject] = useState(initial ? initial.subject : '');
    const [className, setClassName] = useState(initial ? (initial.className || '') : '');
    const [dueDate, setDueDate] = useState(initial ? initial.dueDate : (prefillDate || ''));
    const [notes, setNotes] = useState(initial ? initial.notes : '');
    const [color, setColor] = useState(initial ? (initial.color || '') : '');
    const [corte, setCorte] = useState(initial ? corteOf(initial) : 1);
    const [maxPts, setMaxPts] = useState(initial ? String(maxOf(initial)) : String(GRADE_MAX));
    const [subtasks, setSubtasks] = useState(initial && initial.subtasks ? initial.subtasks.map(s => ({ ...s })) : []);
    const [staged, setStaged] = useState([]);
    const [err, setErr] = useState(false);
    const [ocr, setOcr] = useState(null);
    const colorTouched = useRef(!!initial);
    const titleRef = useRef(null);

    const addSubtask = () => setSubtasks(s => [...s, { id: uid(), text: '', done: false }]);
    const setSubtaskText = (id, text) => setSubtasks(s => s.map(x => x.id === id ? { ...x, text } : x));
    const toggleSubtask = (id) => setSubtasks(s => s.map(x => x.id === id ? { ...x, done: !x.done } : x));
    const removeSubtask = (id) => setSubtasks(s => s.filter(x => x.id !== id));

    // typing a subject you've used before adopts its colour (unless you pick one yourself)
    const onSubjectChange = (v) => {
      setSubject(v); setErr(false);
      if (!colorTouched.current) {
        const c = subjectColors[v.trim().toLowerCase()];
        setColor(c || '');
      }
    };
    // tapping a class chip fills subject + colour (tap again to clear)
    const pickSubject = (s, c) => {
      setErr(false);
      if (subject.trim().toLowerCase() === s.toLowerCase()) { setSubject(''); return; }
      setSubject(s);
      if (!colorTouched.current) setColor(c || '');
    };
    const pickColor = (c) => { colorTouched.current = true; setColor(color === c ? '' : c); };

    useEffect(() => {
      let urls = [];
      if (initial) {
        getAttsFor(initial.id).then(atts => {
          const withUrls = atts.map(a => ({ ...a, url: URL.createObjectURL(a.blob) }));
          urls = withUrls.map(a => a.url); setStaged(withUrls);
        });
      }
      setTimeout(() => titleRef.current && titleRef.current.focus(), 120);
      return () => urls.forEach(URL.revokeObjectURL);
    }, []);

    const addFiles = (fileList) => {
      const added = Array.from(fileList).map(f => ({ id: uid(), name: f.name || ('photo-' + Date.now() + '.jpg'), type: f.type, blob: f, url: URL.createObjectURL(f) }));
      setStaged(s => [...s, ...added]);
    };
    const removeStaged = (id) => setStaged(s => {
      const gone = s.find(x => x.id === id);
      if (gone && !gone.homeworkId) URL.revokeObjectURL(gone.url);
      return s.filter(x => x.id !== id);
    });

    async function transcribeStaged() {
      const todo = staged.filter(a => isImage(a) && !a.text);
      if (!todo.length) return;
      setOcr({ pct: 0, i: 0, n: todo.length });
      try {
        const results = {};
        for (let i = 0; i < todo.length; i++) {
          const a = todo[i];
          results[a.id] = await transcribeBlob(a.blob, (pct) => setOcr({ pct, i: i + 1, n: todo.length }));
        }
        setStaged(s => s.map(x => results[x.id] !== undefined ? { ...x, text: results[x.id] } : x));
        // Note: transcripts stay attached to each photo (view them by tapping the photo).
        // They are NOT dumped into your notes, so Notes stays only what you type.
      } catch (e) {
        alert(e.message || 'Transcription failed.');
      } finally {
        setOcr(null);
      }
    }

    async function save() {
      const ttl = title.trim(), subj = subject.trim();
      if (!ttl && !subj) { setErr(true); titleRef.current && titleRef.current.focus(); return; }
      const id = initial ? initial.id : uid();
      const cleanSubs = subtasks.filter(s => s.text.trim()).map(s => ({ id: s.id, text: s.text.trim(), done: !!s.done }));
      const mp = parseFloat(String(maxPts).replace(',', '.'));
      const hw = { id, kind, title: ttl, subject: subj, classNo: initial ? (initial.classNo || '') : '',
        corte, max: (isFinite(mp) && mp > 0) ? mp : GRADE_MAX,
        className: className.trim(), dueDate, notes: notes.trim(), color, subtasks: cleanSubs,
        grade: initial ? (initial.grade || '') : '', archived: initial ? (initial.archived || false) : false,
        done: initial ? initial.done : false, createdAt: initial ? initial.createdAt : Date.now() };
      await putHW(hw);
      const prev = initial ? await getAttsFor(id) : [];
      const stagedIds = new Set(staged.map(s => s.id));
      for (const p of prev) if (!stagedIds.has(p.id)) await delAtt(p.id);
      for (const s of staged) await putAtt({ id: s.id, homeworkId: id, name: s.name, type: s.type, blob: s.blob, text: s.text || '' });
      onSaved();
    }

    return (
      <div className="backdrop" onClick={(e) => { if (e.target.classList.contains('backdrop')) onClose(); }}>
        <div className="sheet">
          <div className="sheet-top">
            <h2>{(initial ? 'Edit ' : 'New ') + kindWord}</h2>
            <button className="sheet-x" onClick={onClose} aria-label="Close">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>

          <label>{isExam ? 'Exam title' : 'Homework title'}</label>
          <input ref={titleRef} type="text" className={err ? 'err' : ''} value={title}
            onChange={e => { setTitle(e.target.value); setErr(false); }} placeholder={isExam ? 'e.g. Midterm — Unit 3' : 'e.g. Exercises page 42'} autoComplete="off" />

          <label>Subject</label>
          {classSubjects.length > 0 &&
            <div className="subjchips">
              {classSubjects.map(cs =>
                <button type="button" key={cs.subject}
                  className={'schip2' + (subject.trim().toLowerCase() === cs.subject.toLowerCase() ? ' on' : '')}
                  onClick={() => pickSubject(cs.subject, cs.color)}>
                  <i style={{ background: cs.color || '#f5f5f7' }}></i>{cs.subject}
                </button>)}
            </div>}
          <input type="text" value={subject} onChange={e => onSubjectChange(e.target.value)}
            placeholder={classSubjects.length ? 'or type a new subject' : 'e.g. Mathematics'} autoComplete="off"
            style={color ? { color } : undefined} />
          <p className="field-help">
            {classSubjects.length
              ? 'Tap one of your schedule classes, or type one. You can leave it blank (homework with no class).'
              : 'Optional. Add classes in the Schedule tab to pick them here with one tap.'}
          </p>

          <label>Colour</label>
          <div className="swatches">
            <button type="button" className={'swatch none' + (color ? '' : ' on')} onClick={() => pickColor('')} title="Default (white)"></button>
            {COLORS.map(c =>
              <button type="button" key={c} className={'swatch' + (color === c ? ' on' : '')}
                style={{ background: c }} onClick={() => pickColor(c)} title={c}></button>)}
          </div>

          <label>Class / group (optional)</label>
          <input type="text" value={className} onChange={e => setClassName(e.target.value)} placeholder="e.g. 10-B · Group 7" autoComplete="off" />

          <label>{isExam ? 'Exam date' : 'Due / finish by'}</label>
          <input type="date" value={dueDate} onChange={e => setDueDate(e.target.value)} />

          <label>Corte</label>
          <div className="daypick">
            {CORTES.map(n => <button type="button" key={n} className={'dchip' + (corte === n ? ' on' : '')} onClick={() => setCorte(n)}>Corte {n}</button>)}
          </div>

          <label>Graded out of</label>
          <input type="text" inputMode="decimal" value={maxPts} onChange={e => setMaxPts(e.target.value)} placeholder="20" />
          <p className="field-help">How many points this is worth — put 15 if it's graded 14/15, 20 if it's out of 20.</p>

          <label>Notepad</label>
          <Notepad value={notes} onChange={setNotes} placeholder={isExam ? 'Anything you need to remember — what it covers, pages to study, what the professor said…' : 'Anything you need to remember — the instructions, pages, questions, what the professor said…'} />
          <p className="field-help">Free text. Whatever you write here you can read back any time by opening the {isExam ? 'exam' : 'homework'}.</p>

          <label>{isExam ? 'Topics / checklist' : 'Subtasks'}</label>
          {subtasks.map(st =>
            <div className="subtask-row" key={st.id}>
              <button type="button" className={'stcheck' + (st.done ? ' on' : '')} onClick={() => toggleSubtask(st.id)} aria-label="Toggle step">
                <svg viewBox="0 0 24 24" fill="none" strokeWidth="3.2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12l5 5L20 6"/></svg>
              </button>
              <input type="text" value={st.text} onChange={e => setSubtaskText(st.id, e.target.value)} placeholder={isExam ? 'Topic to study…' : 'Step…'} autoComplete="off" />
              <button type="button" className="strm" onClick={() => removeSubtask(st.id)} aria-label="Remove">✕</button>
            </div>)}
          <div className="file-btn wide" onClick={addSubtask}>＋ Add {isExam ? 'topic' : 'subtask'}</div>

          <label>Attachments — photos &amp; files</label>
          <div className="file-btns">
            <label className="file-btn">＋ Photo
              <input type="file" accept="image/*" capture="environment" multiple hidden onChange={e => { addFiles(e.target.files); e.target.value = ''; }} />
            </label>
            <label className="file-btn">＋ File
              <input type="file" multiple hidden onChange={e => { addFiles(e.target.files); e.target.value = ''; }} />
            </label>
          </div>
          {staged.length > 0 &&
            <div className="staged">
              {staged.map(a =>
                <div className="att" key={a.id}>
                  <span>{isImage(a) ? '🖼' : '📎'}</span>
                  <span className="name">{a.name}</span>
                  {a.text ? <span className="ok" title="Transcribed">✓</span> : null}
                  <span className="rm" onClick={() => removeStaged(a.id)}>✕</span>
                </div>)}
            </div>}
          {staged.some(a => isImage(a) && !a.text) &&
            <div className={'file-btn wide' + (ocr ? ' busy' : '')} onClick={ocr ? null : transcribeStaged}>
              {ocr ? ('Transcribing ' + ocr.i + '/' + ocr.n + ' · ' + ocr.pct + '%') : '⛯ Transcribe photo text'}
            </div>}

          <div style={{ height: '78px' }}></div>
        </div>

        <div className="sheet-fabs">
          <button className="fab save" onClick={save} aria-label={initial ? 'Save changes' : ('Save ' + kindWord)}>
            <svg viewBox="0 0 24 24" fill="none" stroke="#000" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12l5 5L20 6"/></svg>
          </button>
        </div>
      </div>
    );
  }

  /* ---------- Photo viewer: image on top, transcript below ---------- */
  function copyToClipboard(str) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(str);
    return new Promise((res, rej) => {
      try {
        const ta = document.createElement('textarea');
        ta.value = str; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); res();
      } catch (e) { rej(e); }
    });
  }
  function PhotoViewer({ att, onClose, onChanged }) {
    const [ocr, setOcr] = useState(null);
    const [copied, setCopied] = useState('');
    const text = att.text || '';
    const aiPrompt = 'This is text transcribed by OCR from a photo of my homework, so it may have mistakes. '
      + 'Please clean it up; if it contains math problems, rewrite each one clearly in standard notation (use LaTeX where it helps) '
      + 'so it is unambiguous, then help me solve it step by step.\n\n"""\n' + text + '\n"""';
    async function transcribe() {
      setOcr({ pct: 0 });
      try {
        const t = await transcribeBlob(att.blob, (pct) => setOcr({ pct }));
        await putAtt({ id: att.id, homeworkId: att.homeworkId, name: att.name, type: att.type, blob: att.blob, text: t });
        await onChanged();
      } catch (e) { alert(e.message || 'Transcription failed.'); }
      finally { setOcr(null); }
    }
    async function copy(str, tag) {
      try { await copyToClipboard(str); setCopied(tag); setTimeout(() => setCopied(''), 1600); }
      catch (e) { alert('Could not copy automatically — long-press the text to copy.'); }
    }
    return (
      <div className="backdrop" onClick={(e) => { if (e.target.classList.contains('backdrop')) onClose(); }}>
        <div className="sheet">
          <div className="sheet-top">
            <h2>Photo</h2>
            <button className="sheet-x" onClick={onClose} aria-label="Close">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
          <img className="viewer-img" src={att.url} alt={att.name} />
          <a className="link" href={att.url} download={att.name} style={{ display: 'inline-block', marginBottom: '6px' }}>Download image</a>
          {text
            ? <React.Fragment>
                <div className="transcript"><span className="tlabel">Transcript</span>{text}</div>
                <div className="photo-tools">
                  <button className="link" onClick={() => copy(text, 't')}>{copied === 't' ? '✓ Copied' : 'Copy text'}</button>
                  <button className="link" onClick={() => copy(aiPrompt, 'ai')}>{copied === 'ai' ? '✓ Copied' : 'Copy for AI'}</button>
                  <button className={'link' + (ocr ? ' busy' : '')} onClick={ocr ? null : transcribe}>{ocr ? ('Re-reading · ' + ocr.pct + '%') : 'Re-transcribe'}</button>
                </div>
              </React.Fragment>
            : <div className={'file-btn wide' + (ocr ? ' busy' : '')} onClick={ocr ? null : transcribe}>
                {ocr ? ('Transcribing · ' + ocr.pct + '%') : '⛯ Transcribe this photo'}
              </div>}
          <div style={{ height: '20px' }}></div>
        </div>
      </div>
    );
  }

  /* ---------- Card (compact summary — tap to open details) ---------- */
  function Card({ item, atts, onToggle, onOpen }) {
    const di = dueInfo(item.dueDate, item.done);
    const displayTitle = (item.title && item.title.trim()) || item.subject || '(untitled)';
    const showSubjectLine = item.title && item.title.trim() && item.subject;
    const isExam = item.kind === 'exam';
    const subs = item.subtasks || [];
    const subsDone = subs.filter(s => s.done).length;
    const imgCount = atts.filter(isImage).length;
    const fileCount = atts.length - imgCount;
    return (
      <div className="card">
        <div className={'hw' + (item.done ? ' done' : '')}>
          <button className="check" onClick={() => onToggle(item)} aria-label="Toggle done">
            <svg viewBox="0 0 24 24" fill="none" strokeWidth="3.2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12l5 5L20 6"/></svg>
          </button>
          <div className="body" onClick={() => onOpen(item)} style={{ cursor: 'pointer' }}>
            <p className="title" style={!item.done && item.color ? { color: item.color } : undefined}>{displayTitle}</p>
            {showSubjectLine && <p className="subtitle" style={!item.done && item.color ? { color: item.color } : undefined}>{item.subject}</p>}
            {item.classNo && <p className="subtitle">{item.classNo}</p>}
            <div className="meta">
              {isExam && <span className="kind-tag exam">Exam</span>}
              {item.className && <span className="tag">{item.className}</span>}
              <span className={'due ' + di.cls}>{di.label}</span>
              {item.grade !== '' && item.grade != null && <span className="grade-tag">{item.grade} / {maxOf(item)}</span>}
              {subs.length > 0 && <span className="tag">{subsDone}/{subs.length} done</span>}
              {item.notes && item.notes.trim() && <span className="tag">📝 Note</span>}
              {imgCount > 0 && <span className="tag">📷 {imgCount}</span>}
              {fileCount > 0 && <span className="tag">📎 {fileCount}</span>}
            </div>
          </div>
        </div>
      </div>
    );
  }

  /* ---------- Detail view (read-only, with an Edit button) ---------- */
  function DetailSheet({ item, atts, onClose, onEdit, onToggle, onDelete, onChanged }) {
    const [viewer, setViewer] = useState(null);
    const [noteEdit, setNoteEdit] = useState(false);
    const [draft, setDraft] = useState(item.notes || '');
    useEffect(() => { setDraft(item.notes || ''); }, [item.id, item.notes]);
    const saveNote = async () => {
      setNoteEdit(false);
      if ((draft || '') === (item.notes || '')) return;
      await putHW({ ...item, notes: draft });
      await onChanged();
    };
    const di = dueInfo(item.dueDate, item.done);
    const isExam = item.kind === 'exam';
    const subs = item.subtasks || [];
    const subsDone = subs.filter(s => s.done).length;
    const displayTitle = (item.title && item.title.trim()) || item.subject || '(untitled)';
    const images = atts.filter(isImage);
    const hasTranscript = images.some(a => a.text);
    async function toggleSub(stId) {
      const subtasks = subs.map(s => s.id === stId ? { ...s, done: !s.done } : s);
      await putHW({ ...item, subtasks });
      await onChanged();
    }
    return (
      <div className="backdrop" onClick={(e) => { if (e.target.classList.contains('backdrop')) onClose(); }}>
        <div className="sheet">
          <div className="sheet-top">
            <h2>{isExam ? 'Exam' : 'Homework'}</h2>
            <button className="sheet-x" onClick={onClose} aria-label="Close">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
          <p className="detail-title" style={item.color ? { color: item.color } : undefined}>{displayTitle}</p>
          <div className="meta">
            {item.subject && <span className="tag">{item.subject}</span>}
            {item.className && <span className="tag">{item.className}</span>}
            {item.classNo && <span className="tag">{item.classNo}</span>}
            <span className={'due ' + di.cls}>{di.label}</span>
            <span className="tag">Corte {corteOf(item)}</span>
            {item.grade !== '' && item.grade != null && <span className="grade-tag">{item.grade} / {maxOf(item)}</span>}
          </div>
          <div className="notepad-block">
            <div className="np-head">
              <span className="stitle">Notepad</span>
              <button className={'np-edit' + (noteEdit ? ' on' : '')} onClick={() => noteEdit ? saveNote() : setNoteEdit(true)}>
                {noteEdit ? 'Done' : (item.notes ? 'Edit' : '＋ Add')}
              </button>
            </div>
            {noteEdit
              ? <Notepad value={draft} onChange={setDraft} placeholder="Write anything you need to remember…" minHeight={130} />
              : (item.notes ? <p className="notes" onClick={() => setNoteEdit(true)}>{item.notes}</p>
                            : <p className="np-empty" onClick={() => setNoteEdit(true)}>Nothing written yet — tap ＋ Add to jot something down.</p>)}
          </div>
          {subs.length > 0 &&
            <div className="subtasks">
              <span className="stitle">{isExam ? 'Topics' : 'Subtasks'} · {subsDone}/{subs.length}</span>
              {subs.map(st =>
                <div key={st.id} className={'subtask' + (st.done ? ' done' : '')} onClick={() => toggleSub(st.id)}>
                  <span className="box"><svg viewBox="0 0 24 24" fill="none" strokeWidth="3.2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12l5 5L20 6"/></svg></span>
                  <span className="stx">{st.text}</span>
                </div>)}
            </div>}
          {atts.length > 0 &&
            <div className="attachments">
              {atts.map(a => isImage(a)
                ? <img key={a.id} className="thumb" src={a.url} alt={a.name} onClick={() => setViewer(a)} style={{ cursor: 'pointer' }} />
                : <a key={a.id} className="att" href={a.url} download={a.name}>📎 <span className="name">{a.name}</span></a>)}
            </div>}
          {images.length > 0 &&
            <p className="tap-hint">{hasTranscript ? 'Tap a photo to view it and read its transcript' : 'Tap a photo to view it and transcribe the text'}</p>}

          <div className="detail-foot">
            <button className="btn primary wide-one" onClick={() => onEdit(item)}>Edit</button>
            <div className="detail-links">
              <button className="link" onClick={() => onToggle(item)}>{item.done ? 'Mark not done' : 'Mark done'}</button>
              {item.dueDate && !item.done &&
                <button className="link" onClick={() => downloadICS(hwTitle(item).replace(/\s+/g, '_') + '.ics', buildICS([item]))}>🔔 Remind me</button>}
              <button className="link danger" onClick={() => onDelete(item)}>Delete</button>
            </div>
          </div>
          <div style={{ height: '20px' }}></div>
        </div>
        {viewer && <PhotoViewer att={viewer} onClose={() => setViewer(null)} onChanged={onChanged} />}
      </div>
    );
  }

  /* ---------- Semester create / edit sheet ---------- */
  function SemesterSheet({ initial, onClose, onSaved, onDelete }) {
    const [name, setName] = useState(initial ? initial.name : '');
    const [start, setStart] = useState(initial ? initial.start : '');
    const [end, setEnd] = useState(initial ? initial.end : '');
    const [err, setErr] = useState('');

    async function save() {
      if (!name.trim()) { setErr('Please name the semester.'); return; }
      if (!start || !end) { setErr('Please set a start and end date.'); return; }
      if (end < start) { setErr('End date must be after the start date.'); return; }
      const id = initial ? initial.id : uid();
      await putSem({ id, name: name.trim(), start, end, createdAt: initial ? initial.createdAt : Date.now() });
      onSaved(id);
    }
    return (
      <div className="backdrop" onClick={(e) => { if (e.target.classList.contains('backdrop')) onClose(); }}>
        <div className="sheet">
          <div className="sheet-top">
            <h2>{initial ? 'Edit semester' : 'New semester'}</h2>
            <button className="sheet-x" onClick={onClose} aria-label="Close">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
          <label>Name</label>
          <input type="text" value={name} onChange={e => { setName(e.target.value); setErr(''); }} placeholder="e.g. Fall 2026 · 1st Semester" autoComplete="off" />
          <label>Starts</label>
          <input type="date" value={start} onChange={e => { setStart(e.target.value); setErr(''); }} />
          <label>Ends</label>
          <input type="date" value={end} onChange={e => { setEnd(e.target.value); setErr(''); }} />
          {err && <p className="form-err">{err}</p>}
          {initial &&
            <div className="sheet-actions">
              <button className="btn danger wide-one" onClick={() => onDelete(initial)}>Delete semester</button>
            </div>}
          <div style={{ height: '78px' }}></div>
        </div>

        <div className="sheet-fabs">
          <button className="fab save" onClick={save} aria-label={initial ? 'Save changes' : 'Save semester'}>
            <svg viewBox="0 0 24 24" fill="none" stroke="#000" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12l5 5L20 6"/></svg>
          </button>
        </div>
      </div>
    );
  }

  /* ---------- Calendar view ---------- */
  const pad2c = (n) => String(n).padStart(2, '0');
  const toIso = (d) => d.getFullYear() + '-' + pad2c(d.getMonth()+1) + '-' + pad2c(d.getDate());

  function Calendar({ items, semesters, selId, onSelSem, onNewSem, onEditSem, onEditItem, onAddForDay }) {
    const today = new Date(); today.setHours(0,0,0,0);
    const todayIso = toIso(today);
    const sem = semesters.find(s => s.id === selId) || null;

    const [cursor, setCursor] = useState(() => {
      const base = sem ? new Date(sem.start + 'T00:00:00') : today;
      return new Date(base.getFullYear(), base.getMonth(), 1);
    });
    const [selDay, setSelDay] = useState(todayIso);

    useEffect(() => {
      if (sem) { const d = new Date(sem.start + 'T00:00:00'); setCursor(new Date(d.getFullYear(), d.getMonth(), 1)); }
    }, [selId]);

    const byDay = {};
    for (const it of items) if (it.dueDate) (byDay[it.dueDate] = byDay[it.dueDate] || []).push(it);

    const first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
    const startOffset = (first.getDay() + 6) % 7; // Monday-first
    const gridStart = new Date(first); gridStart.setDate(1 - startOffset);
    const cells = [];
    for (let i = 0; i < 42; i++) { const d = new Date(gridStart); d.setDate(gridStart.getDate() + i); cells.push(d); }

    const monthLabel = cursor.toLocaleDateString(LOC, { month: 'long', year: 'numeric' });
    const inSem = (iso) => sem ? (iso >= sem.start && iso <= sem.end) : true;
    const move = (n) => setCursor(new Date(cursor.getFullYear(), cursor.getMonth() + n, 1));

    let weekInfo = null, range = null;
    if (sem) {
      const s = new Date(sem.start + 'T00:00:00'), e = new Date(sem.end + 'T00:00:00');
      const fmt = (d) => d.toLocaleDateString(LOC, { month: 'short', day: 'numeric', year: 'numeric' });
      range = fmt(s) + ' — ' + fmt(e);
      const totalWeeks = Math.max(1, Math.ceil((e - s) / (7*86400000)) + 1);
      if (today >= s && today <= e) weekInfo = 'Week ' + (Math.floor((today - s) / (7*86400000)) + 1) + ' / ' + totalWeeks;
    }

    const dayItems = (byDay[selDay] || []).slice().sort((a,b) => (a.done?1:0) - (b.done?1:0));
    const fmtSel = new Date(selDay + 'T00:00:00').toLocaleDateString(LOC, { weekday: 'long', month: 'short', day: 'numeric' });

    return (
      <div className="cal-wrap">
        <div className="sembar">
          <button className={'schip' + (!selId ? ' on' : '')} onClick={() => onSelSem(null)}>All</button>
          {semesters.map(s => <button key={s.id} className={'schip' + (selId === s.id ? ' on' : '')} onClick={() => onSelSem(s.id)}>{s.name}</button>)}
          <button className="schip newitem" onClick={onNewSem}>＋ Semester</button>
        </div>
        {sem &&
          <div className="seminfo">
            <span>{range}</span>
            <span>{weekInfo && <span className="wk">{weekInfo}</span>} <button className="link" onClick={() => onEditSem(sem)}>Edit</button></span>
          </div>}

        <div className="cal-head">
          <button className="cal-nav" onClick={() => move(-1)} aria-label="Previous month">‹</button>
          <span className="mlabel">{monthLabel}</span>
          <button className="cal-nav" onClick={() => move(1)} aria-label="Next month">›</button>
        </div>

        <div className="cal-grid">
          {DAYS_SHORT.map(d => <div key={d} className="cal-dow">{d}</div>)}
          {cells.map((d, i) => {
            const iso = toIso(d);
            const out = d.getMonth() !== cursor.getMonth();
            const its = byDay[iso] || [];
            const cls = ['cal-cell'];
            if (out) cls.push('out');
            if (!inSem(iso)) cls.push('dim');
            if (iso === todayIso) cls.push('today');
            if (iso === selDay) cls.push('sel');
            return (
              <div key={i} className={cls.join(' ')} onClick={() => setSelDay(iso)}>
                <span className="dnum">{d.getDate()}</span>
                {its.length > 0 &&
                  <div className="cal-dots">
                    {its.slice(0,4).map((it, j) => {
                      const col = it.done ? '#555' : (it.color || '#f5f5f7');
                      return it.kind === 'exam'
                        ? <i key={j} className="ex" style={{ borderColor: col }}></i>
                        : <i key={j} style={{ background: col }}></i>;
                    })}
                    {its.length > 4 && <span className="cal-more">+{its.length - 4}</span>}
                  </div>}
              </div>
            );
          })}
        </div>

        <div className="cal-legend">
          <span><i></i> Homework</span>
          <span><i className="dot-ex"></i> Exam</span>
        </div>

        <div className="day-detail">
          <h3>{fmtSel}</h3>
          {dayItems.length
            ? dayItems.map(it => {
                const u = it.kind === 'exam' ? examUrgency(it.dueDate) : null;
                const dotColor = u && !it.done ? (u.cls === 'red' ? '#e06666' : u.cls === 'orange' ? '#e9a23b' : (it.color || '#f5f5f7')) : (it.color || '#f5f5f7');
                return (
                <div key={it.id} className={'drow' + (it.done ? ' done' : '')} onClick={() => onEditItem(it)}>
                  <span className={'dot' + (it.kind === 'exam' ? ' ex' : '')} style={it.kind === 'exam' ? { borderColor: dotColor } : { background: dotColor }}></span>
                  <span className="dsub">{(it.title && it.title.trim()) || it.subject || '(untitled)'}</span>
                  {it.kind === 'exam' && (it.done
                    ? <span className="exam-badge">Exam</span>
                    : <span className={'exam-badge ' + u.cls}>{u.label}</span>)}
                  {it.subject && it.title && it.title.trim() && <span className="dmeta">{it.subject}</span>}
                </div>);
              })
            : <div className="day-empty">Nothing due this day.</div>}
          <button className="link add-day" onClick={() => onAddForDay(selDay)}>＋ Add for this day</button>
        </div>
      </div>
    );
  }

  /* ---------- Class create / edit sheet ---------- */
  function ClassSheet({ initial, subjectColors, onClose, onSaved, onDelete }) {
    const [subject, setSubject] = useState(initial ? initial.subject : '');
    const [color, setColor] = useState(initial ? (initial.color || '') : '');
    const [day, setDay] = useState(initial ? initial.day : 0);
    const [start, setStart] = useState(initial ? initial.start : '08:00');
    const [end, setEnd] = useState(initial ? initial.end : '09:00');
    const [room, setRoom] = useState(initial ? (initial.room || '') : '');
    const [err, setErr] = useState('');
    const touched = useRef(!!initial);

    const onSub = (v) => { setSubject(v); setErr(''); if (!touched.current) { const c = subjectColors[v.trim().toLowerCase()]; setColor(c || ''); } };
    const pick = (c) => { touched.current = true; setColor(color === c ? '' : c); };

    async function save() {
      if (!subject.trim()) { setErr('Please enter a subject.'); return; }
      if (!start || !end) { setErr('Please set start and end times.'); return; }
      if (end <= start) { setErr('End time must be after the start time.'); return; }
      const id = initial ? initial.id : uid();
      await putClass({ id, subject: subject.trim(), color, day, start, end, room: room.trim(), createdAt: initial ? initial.createdAt : Date.now() });
      onSaved();
    }

    return (
      <div className="backdrop" onClick={(e) => { if (e.target.classList.contains('backdrop')) onClose(); }}>
        <div className="sheet">
          <div className="sheet-top">
            <h2>{initial ? 'Edit class' : 'New class'}</h2>
            <button className="sheet-x" onClick={onClose} aria-label="Close">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
          <label>Subject *</label>
          <input type="text" value={subject} onChange={e => onSub(e.target.value)} placeholder="e.g. Mathematics" autoComplete="off" style={color ? { color } : undefined} />

          <label>Colour</label>
          <div className="swatches">
            <button type="button" className={'swatch none' + (color ? '' : ' on')} onClick={() => pick('')} title="Default (white)"></button>
            {COLORS.map(c => <button type="button" key={c} className={'swatch' + (color === c ? ' on' : '')} style={{ background: c }} onClick={() => pick(c)}></button>)}
          </div>

          <label>Day</label>
          <div className="daypick">
            {DAYS_SHORT.map((d, i) => <button type="button" key={d} className={'dchip' + (day === i ? ' on' : '')} onClick={() => setDay(i)}>{d}</button>)}
          </div>

          <div className="time-row">
            <div><label>Starts</label><input type="time" value={start} onChange={e => { setStart(e.target.value); setErr(''); }} /></div>
            <div><label>Ends</label><input type="time" value={end} onChange={e => { setEnd(e.target.value); setErr(''); }} /></div>
          </div>

          <label>Room / note</label>
          <input type="text" value={room} onChange={e => setRoom(e.target.value)} placeholder="e.g. Room 204" autoComplete="off" />

          {err && <p className="form-err">{err}</p>}
          {initial &&
            <div className="sheet-actions">
              <button className="btn danger wide-one" onClick={() => onDelete(initial)}>Delete class</button>
            </div>}
          <div style={{ height: '78px' }}></div>
        </div>

        <div className="sheet-fabs">
          <button className="fab save" onClick={save} aria-label={initial ? 'Save changes' : 'Save class'}>
            <svg viewBox="0 0 24 24" fill="none" stroke="#000" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12l5 5L20 6"/></svg>
          </button>
        </div>
      </div>
    );
  }

  /* ---------- Render the weekly schedule to a downloadable image ---------- */
  function renderScheduleImage(title, days, byDay) {
    const draw = () => {
      const scale = 3, pad = 46, colW = 184, gap = 12, titleH = 88, dayHeadH = 40, cardH = 82, cardGap = 8;
      const N = days.length;
      const W = pad * 2 + N * colW + (N - 1) * gap;
      const maxRows = Math.max(1, ...days.map(d => (byDay[d] || []).length));
      const H = pad + titleH + dayHeadH + maxRows * (cardH + cardGap) - cardGap + pad;
      const canvas = document.createElement('canvas');
      canvas.width = W * scale; canvas.height = H * scale;
      const ctx = canvas.getContext('2d'); ctx.scale(scale, scale);
      ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1;
      for (let x = 0; x <= W; x += 48) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = 0; y <= H; y += 48) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

      const clip = (text, maxW) => {
        if (ctx.measureText(text).width <= maxW) return text;
        let t = text;
        while (t.length && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
        return t + '…';
      };

      ctx.fillStyle = '#f5f5f7'; ctx.font = '700 38px Inter, -apple-system, sans-serif';
      ctx.fillText(clip(title, W - pad * 2), pad, pad + 34);
      ctx.fillStyle = '#7a7a80'; ctx.font = '500 16px "JetBrains Mono", ui-monospace, monospace';
      ctx.fillText('WEEKLY SCHEDULE', pad, pad + 62);

      const gridTop = pad + titleH;
      days.forEach((d, i) => {
        const x = pad + i * (colW + gap);
        ctx.fillStyle = '#f5f5f7'; ctx.font = '700 18px Inter, sans-serif';
        ctx.fillText(DAYS_SHORT[d].toUpperCase(), x, gridTop + 20);
        ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.beginPath(); ctx.moveTo(x, gridTop + 32); ctx.lineTo(x + colW, gridTop + 32); ctx.stroke();
        let cy = gridTop + dayHeadH;
        for (const c of (byDay[d] || [])) {
          const col = c.color || '#f5f5f7';
          ctx.fillStyle = 'rgba(255,255,255,0.03)'; ctx.fillRect(x, cy, colW, cardH);
          ctx.fillStyle = col; ctx.fillRect(x, cy, 4, cardH);
          ctx.fillStyle = '#9a9aa2'; ctx.font = '500 14px "JetBrains Mono", ui-monospace, monospace';
          ctx.fillText(c.start + '–' + c.end, x + 13, cy + 24);
          ctx.fillStyle = col; ctx.font = '700 19px Inter, sans-serif';
          ctx.fillText(clip(c.subject, colW - 24), x + 13, cy + 49);
          if (c.room) { ctx.fillStyle = '#7a7a80'; ctx.font = '400 13px Inter, sans-serif'; ctx.fillText(clip(c.room, colW - 24), x + 13, cy + 70); }
          cy += cardH + cardGap;
        }
      });

      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'schedule.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      }, 'image/png');
    };
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(draw);
  }

  /* ---------- Schedule view ---------- */
  function Schedule({ classes, semesters, selId, onEdit, onNew }) {
    const sem = semesters.find(s => s.id === selId) || null;
    const title = sem ? sem.name : 'Weekly Schedule';

    for (const c of classes) (byDay[c.day] = byDay[c.day] || []).push(c);

    const viewDays = [0,1,2,3,4,5,6];
    const imageDays = [0,1,2,3,4].concat([5,6].filter(d => (byDay[d] || []).length));

    return (
      <div className="sched-wrap">
        <div className="sched-head">
          <span className="mlabel">{title}</span>
          <button className="link" onClick={onNew}>＋ Add class</button>
        </div>

        {classes.length === 0 &&
          <div className="day-empty">No classes yet — tap “＋ Add class” to build your schedule.</div>}

        {classes.length > 0 && viewDays.map(d =>
          <div className="sched-day" key={d}>

        {classes.length > 0 &&

          </React.Fragment>}

    );
