  /* ---------- Grades view: three cortes, each worth a slice of the final ---------- */
  /* ---------- Grades view: semester scoping, /100 & /20 score, cortes breakdown & single lowest-grade highlight ---------- */
  function Grades({ items, classes, semesters, selId, onSelSem, onNewSem, onEditSem, onPatch, onEditItem }) {
    const [weights, setWeights] = useState(loadCorteW);
    const [showW, setShowW] = useState(false);
    const setW = (i, val) => {
      const n = parseFloat(String(val).replace(',', '.'));
      const next = weights.slice();
      next[i] = isNaN(n) ? 0 : Math.max(0, Math.min(100, n));
      setWeights(next); saveCorteW(next);
    };
    const wTotal = weights.reduce((a, b) => a + (Number(b) || 0), 0);

    const sem = semesters.find(s => s.id === selId) || null;
    const semClasses = selId ? classes.filter(c => c.semesterId === selId || (!c.semesterId && semesters.length <= 1)) : classes;
    const semItems = selId ? items.filter(it => {
      if (it.semesterId === selId) return true;
      const matchSubj = semClasses.some(c => c.subject.trim().toLowerCase() === (it.subject || '').trim().toLowerCase());
      if (matchSubj) return true;
      if (sem && it.dueDate && it.dueDate >= sem.start && it.dueDate <= sem.end) return true;
      return false;
    }) : items;

    const subjects = []; const seen = new Set();
    for (const c of semClasses) {
      const k = (c.subject || '').trim().toLowerCase();
      if (k && !seen.has(k)) {
        seen.add(k);
        subjects.push({ key: k, subject: c.subject.trim(), color: c.color || '', credits: c.credits || 0 });
      }
    }
    const bySubj = {};
    for (const it of semItems) { const k = (it.subject || '').trim().toLowerCase(); if (seen.has(k)) (bySubj[k] = bySubj[k] || []).push(it); }

    const results = subjects.map(s => ({ ...s, list: bySubj[s.key] || [], g: classGrade(bySubj[s.key] || [], weights) }));
    const currents = results.map(r => r.g.current).filter(a => a !== null);
    const overall = currents.length ? (currents.reduce((a, b) => a + b, 0) / currents.length) : null;
    const widgetRows = results.map(r => ({ subject: r.subject, color: r.color, avg: r.g.current, count: r.list.filter(x => gradeNum(x.grade) !== null).length }));
    const titleFor = (it) => (it.title && it.title.trim()) || it.subject || '(untitled)';
    const fmt = (n) => n == null ? '—' : n.toFixed(2).replace(/\.?0+$/, '') || '0';

    // Calculate single lowest grade across ALL classes in view
    const allGradedItems = [];
    for (const r of results) {
      for (const it of r.list) {
        const g = gradeNum(it.grade);
        if (g !== null) {
          const s20 = (g / maxOf(it)) * 20;
          allGradedItems.push({ id: it.id, s20, subject: r.subject });
        }
      }
    }
    let lowestItemId = null;
    if (allGradedItems.length > 0) {
      allGradedItems.sort((a, b) => a.s20 - b.s20);
      lowestItemId = allGradedItems[0].id;
    }

    // Calculate corte averages across all classes in this semester
    const corteAverages = CORTES.map((c, i) => {
      const scores = results.map(r => r.g.per[i] ? r.g.per[i].score : null).filter(s => s !== null);
      return scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : null;
    });

    return (
      <div className="grades-wrap">
        <div className="sembar">
          <button className={'schip' + (!selId ? ' on' : '')} onClick={() => onSelSem(null)}>All</button>
          {semesters.map(s => <button key={s.id} className={'schip' + (selId === s.id ? ' on' : '')} onClick={() => onSelSem(s.id)}>{s.name}</button>)}
          {sem && <button className="schip edit-sem-btn" onClick={() => onEditSem(sem)} title="Edit semester name">✏️ Edit</button>}
          <button className="schip newitem" onClick={onNewSem}>＋ Semester</button>
        </div>

        {/* Career Degree Tracker: 10 Semesters & Credit Units */}
        <CareerCard semesters={semesters} classes={classes} items={items} selSemId={selId} onSelSem={onSelSem} />

        {/* Big Overall Card: /100 and /20 + 3 Cortes Breakdown */}
        <div className="grades-overall-card">
          <div className="grades-overall-top">
            <div>
              <span className="gnum-100">
                {overall != null ? (overall * 5).toFixed(1) : '—'}
                <small> / 100</small>
              </span>
              <span className="glabel-sub">
                {overall != null ? overall.toFixed(2) + ' / 20 Average' : 'No grades recorded yet'}
              </span>
            </div>
            <div style={{ textAlign: 'right' }}>
              <span className="glabel">{sem ? sem.name : 'Overall'}<br/>Average</span>
              {sem && <button className="link" onClick={() => onEditSem(sem)} style={{ display: 'inline-block', marginTop: '4px' }}>Edit</button>}
            </div>
          </div>

          <div className="corte-summary-grid">
            {CORTES.map((c, i) => {
              const w = Number(weights[i]) || 0;
              const avg20 = corteAverages[i];
              const ptsW = avg20 != null ? (avg20 / 20) * w : null;
              return (
                <div className="corte-sum-card" key={c}>
                  <span className="corte-sum-name">Corte {c} <small>({w}%)</small></span>
                  <span className="corte-sum-pts">
                    {ptsW != null ? ptsW.toFixed(1) : '—'}
                    <small> / {w}</small>
                  </span>
                  <span className="corte-sum-20">
                    {avg20 != null ? avg20.toFixed(2) + ' / 20' : '—'}
                  </span>
                </div>
              );
            })}
          </div>
        </div>

        <button className="wtoggle" onClick={() => setShowW(v => !v)}>
          <span>Cortes · {weights.map(w => w + '%').join(' / ')}</span>
          <span className="wcaret">{showW ? '▴' : '▾'}</span>
        </button>
        {showW && (
          <div className="wpanel">
            <p className="field-help">How much of the final grade each corte is worth. Standard Venezuela university model: 15% / 30% / 55%.</p>
            <div className="wrow">
              {CORTES.map((c, i) =>
                <div className="wcell" key={c}>
                  <span className="wlab">Corte {c}</span>
                  <NumCell value={weights[i]} onCommit={(s) => setW(i, s)} label={'Corte ' + c + ' weight'} min={0} max={100} cls="wnum" />
                  <span className="wpct">%</span>
                </div>)}
            </div>
            {Math.abs(wTotal - 100) > 0.01 && <p className="wwarn">These add up to {fmt(wTotal)}% — they should add up to 100%.</p>}
            <button className="btn ghost wreset" onClick={() => { setWeights(DEFAULT_CORTE_W.slice()); saveCorteW(DEFAULT_CORTE_W.slice()); }}>Reset to 15 / 30 / 55</button>
          </div>
        )}

        {!semClasses.length && (
          <div className="day-empty">
            {sem ? 'No classes in “' + sem.name + '” yet. Add classes in the Schedule tab to track your grades here.' : 'Create classes in the Schedule tab first. Then every homework and exam for those classes shows up here, sorted into its corte, with a box for its grade.'}
          </div>
        )}

        {results.map(r => {
          return (
            <div className="grade-sec" key={r.key}>
              <div className="grade-head">
                <span className="grade-subj" style={r.color ? { color: r.color } : undefined}>
                  {r.subject}
                  {r.credits ? <span className="subj-uc">{r.credits} UC</span> : null}
                </span>
                <span className="grade-avg">{r.g.current == null ? '—' : (r.g.current * 5).toFixed(1) + ' / 100'}<small style={{ fontSize: '13px', color: 'var(--dim)', marginLeft: '6px' }}>({r.g.current == null ? '—' : r.g.current.toFixed(2)} / 20)</small></span>
              </div>
              {r.g.current != null && <p className="grade-locked">{((r.g.locked / 20) * 100).toFixed(1)}% of the total class grade earned so far · {fmt(r.g.weighted)}% evaluated</p>}
              {CORTES.map((c, i) => {
                const list = r.list.filter(it => corteOf(it) === c).sort((a, b) => (a.dueDate || '').localeCompare(b.dueDate || ''));
                const p = r.g.per[i];
                const corteWeight = Number(weights[i]) || 0;
                const ptsEarnedInCorte = p ? (p.score / 20) * corteWeight : null;

                return (
                  <div className="corte-block" key={c}>
                    <div className="corte-head">
                      <span className="corte-name">Corte {c} <em>· {fmt(corteWeight)}%</em></span>
                      <span className="corte-score">
                        {ptsEarnedInCorte != null ? ptsEarnedInCorte.toFixed(1) + ' / ' + corteWeight + ' pts' : '—'}
                        {p ? <em> ({p.score.toFixed(2)} / 20)</em> : null}
                      </span>
                    </div>
                    {list.length ? list.map(it => {
                      const gVal = gradeNum(it.grade);
                      const itemScore20 = gVal !== null ? (gVal / maxOf(it)) * 20 : null;
                      const isFailing = itemScore20 !== null && itemScore20 < 10;
                      const isLowest = it.id === lowestItemId;
                      const inCls = isFailing ? 'low-fail' : (isLowest ? 'low-warn' : '');

                      return (
                        <div className="grade-row" key={it.id}>
                          <button className="corte-chip" title="Tap to move to another corte"
                            onClick={() => onPatch(it, { corte: corteOf(it) === 3 ? 1 : corteOf(it) + 1 })}>C{corteOf(it)}</button>
                          <span className="grade-kind">{it.kind === 'exam' ? 'EXAM' : 'HW'}</span>
                          <span className="grade-name" onClick={() => onEditItem(it)}>
                            {titleFor(it)}
                            {isFailing && <span className="grade-badge danger" style={{ marginLeft: '6px' }}>Low &lt;10</span>}
                            {!isFailing && isLowest && <span className="grade-badge warn" style={{ marginLeft: '6px' }}>Lowest Grade</span>}
                          </span>
                          <NumCell value={it.grade} onCommit={(s) => onPatch(it, { grade: s })} label="Grade" min={0} max={maxOf(it)} allowEmpty cls={inCls} />
                          <span className="grade-slash">/</span>
                          <NumCell value={maxOf(it)} onCommit={(s) => onPatch(it, { max: parseFloat(s) })} label="Out of" min={0.5} max={1000} cls="max-in" />
                        </div>
                      );
                    }) : <div className="day-empty small">Nothing in this corte yet.</div>}
                  </div>
                );
              })}
            </div>
          );
        })}

        {results.length > 0 && (
          <React.Fragment>
            <div className="grades-actions">
              <button className="btn primary" onClick={() => renderGradesImage(sem ? sem.name + ' - Grades' : 'Grades', widgetRows)}>⬇ Download grades widget</button>
            </div>
            <p className="sched-note">Save the image, then add it with a photo-widget app (e.g. Widgetsmith) to see your averages on your home screen.</p>
          </React.Fragment>
        )}
      </div>
    );
  }

  
  /* ---------- Cloud Sync & Backup Sheet (Cloudflare + GitHub) ---------- */
  async function syncWithCloudflare({ workerUrl, syncKey, mode = 'sync' }) {
    if (!workerUrl || !syncKey) throw new Error('Please enter your Cloudflare Worker URL and Secret Key.');
    let clean = workerUrl.trim().replace(/\/+$/, '');
    if (!clean.includes('/api/sync') && !clean.endsWith('sync')) {
      clean = clean + '/api/sync';
    }
    const targetUrl = clean + (clean.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(syncKey.trim());

    if (mode === 'push') {
      const payload = await getUniversalBackupPayload();
      const res = await fetch(targetUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('Cloudflare error: ' + res.status + ' ' + (await res.text()));
      return { action: 'pushed', count: (payload.homework || []).length };
    }

    if (mode === 'pull') {
      const res = await fetch(targetUrl, { method: 'GET' });
      if (!res.ok) throw new Error('Cloudflare error: ' + res.status + ' ' + (await res.text()));
      const remoteData = await res.json();
      const payload = remoteData.data || remoteData;
      const count = await applyUniversalBackupPayload(payload);
      return { action: 'pulled', count };
    }

    // mode === 'sync' (2-way smart sync)
    let remoteData = null;
    const getRes = await fetch(targetUrl, { method: 'GET' });
    if (getRes.status === 404) {
      return await syncWithCloudflare({ workerUrl, syncKey, mode: 'push' });
    }
    if (!getRes.ok) throw new Error('Cloudflare error: ' + getRes.status);
    remoteData = await getRes.json();
    const payload = remoteData.data || remoteData;

    const localPayload = await getUniversalBackupPayload();
    const remoteDate = new Date(payload.exportedAt || 0).getTime();
    const localDate = new Date(localPayload.exportedAt || 0).getTime();
    const lastSyncDate = new Date(localStorage.getItem('phantom_cf_last_sync') || 0).getTime();

    if (remoteDate > lastSyncDate && remoteDate > localDate) {
      const count = await applyUniversalBackupPayload(payload);
      return { action: 'pulled', count };
    } else {
      const postRes = await fetch(targetUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(localPayload)
      });
      if (!postRes.ok) throw new Error('Cloudflare push error: ' + postRes.status);
      return { action: 'pushed', count: (localPayload.homework || []).length };
    }
  }

  function SyncSheet({ onClose, onReload }) {
    // Cloudflare state
    const [cfUrl, setCfUrl] = useState(() => localStorage.getItem('phantom_cf_url') || '');
    const [cfKey, setCfKey] = useState(() => localStorage.getItem('phantom_cf_key') || '');
    const [cfAuto, setCfAuto] = useState(() => localStorage.getItem('phantom_cf_auto') === 'true');
    const [cfLastSync, setCfLastSync] = useState(() => localStorage.getItem('phantom_cf_last_sync') || '');
    const [showGuide, setShowGuide] = useState(false);

    // GitHub Gist state
    const [token, setToken] = useState(() => localStorage.getItem('phantom_gh_token') || '');
    const [gistId, setGistId] = useState(() => localStorage.getItem('phantom_gist_id') || '');
    const [ghLastSync, setGhLastSync] = useState(() => localStorage.getItem('phantom_last_sync') || '');
    const [autoSync, setAutoSync] = useState(() => localStorage.getItem('phantom_auto_sync') === 'true');

    const [tab, setTab] = useState('cloudflare'); // 'cloudflare' | 'github' | 'file'
    const [busy, setBusy] = useState(false);
    const [msg, setMsg] = useState('');
    const fileRef = useRef(null);

    const saveCf = (u, k, a) => {
      localStorage.setItem('phantom_cf_url', u.trim());
      localStorage.setItem('phantom_cf_key', k.trim());
      localStorage.setItem('phantom_cf_auto', a ? 'true' : 'false');
    };

    const saveGh = (t, g, a) => {
      localStorage.setItem('phantom_gh_token', t.trim());
      localStorage.setItem('phantom_gist_id', g.trim());
      localStorage.setItem('phantom_auto_sync', a ? 'true' : 'false');
    };

    const handleCfAction = async (actionType) => {
      if (!cfUrl.trim() || !cfKey.trim()) {
        alert('Please enter your Cloudflare Worker URL and Secret Key.');
        return;
      }
      setBusy(true); setMsg('Connecting to Cloudflare...');
      try {
        const res = await syncWithCloudflare({ workerUrl: cfUrl, syncKey: cfKey, mode: actionType });
        const now = new Date().toISOString();
        setCfLastSync(now); localStorage.setItem('phantom_cf_last_sync', now);
        saveCf(cfUrl, cfKey, cfAuto);
        if (res.action === 'pulled') {
          setMsg('Successfully downloaded ' + res.count + ' items from Cloudflare!');
          alert('Sync complete: newer cloud data restored!');
        } else {
          setMsg('Successfully uploaded data to Cloudflare at ' + new Date().toLocaleTimeString());
          alert('Saved to Cloudflare cloud successfully!');
        }
        if (onReload) onReload();
      } catch (err) {
        alert('Cloudflare Sync Error: ' + err.message);
        setMsg('Error: ' + err.message);
      } finally {
        setBusy(false);
      }
    };

    const handleCreateGist = async () => {
      if (!token.trim()) { alert('Please enter your GitHub Personal Access Token (PAT) first.'); return; }
      setBusy(true); setMsg('Creating private Gist on GitHub...');
      try {
        const payload = await getUniversalBackupPayload();
        const res = await fetch('https://api.github.com/gists', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + token.trim(),
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            description: 'Phantom OS Universal Cloud Backup',
            public: false,
            files: {
              'phantom_os_backup.json': { content: JSON.stringify(payload, null, 2) }
            }
          })
        });
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.message || ('GitHub API error: ' + res.status));
        }
        const created = await res.json();
        setGistId(created.id);
        saveGh(token, created.id, autoSync);
        const now = new Date().toISOString();
        setGhLastSync(now); localStorage.setItem('phantom_last_sync', now);
        setMsg('Private Gist created successfully! ID: ' + created.id);
        alert('Cloud backup created successfully!');
      } catch (err) {
        alert('Could not create Gist: ' + err.message);
        setMsg('Error: ' + err.message);
      } finally {
        setBusy(false);
      }
    };

    const handlePushGh = async () => {
      if (!token.trim() || !gistId.trim()) { alert('Please enter your GitHub Token and Gist ID.'); return; }
      setBusy(true); setMsg('Uploading local database to GitHub Gist...');
      try {
        const payload = await getUniversalBackupPayload();
        const res = await fetch('https://api.github.com/gists/' + gistId.trim(), {
          method: 'PATCH',
          headers: {
            'Authorization': 'Bearer ' + token.trim(),
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            description: 'Phantom OS Universal Cloud Backup',
            files: {
              'phantom_os_backup.json': { content: JSON.stringify(payload, null, 2) }
            }
          })
        });
        if (!res.ok) throw new Error('GitHub API error ' + res.status);
        const now = new Date().toISOString();
        setGhLastSync(now); localStorage.setItem('phantom_last_sync', now);
        saveGh(token, gistId, autoSync);
        setMsg('Pushed to GitHub at ' + new Date().toLocaleTimeString());
        alert('Pushed current data to GitHub cloud!');
      } catch (err) {
        alert('Push failed: ' + err.message);
        setMsg('Error: ' + err.message);
      } finally {
        setBusy(false);
      }
    };

    const handlePullGh = async () => {
      if (!token.trim() || !gistId.trim()) { alert('Please enter your GitHub Token and Gist ID.'); return; }
      setBusy(true); setMsg('Downloading from GitHub Gist...');
      try {
        const res = await fetch('https://api.github.com/gists/' + gistId.trim(), {
          headers: {
            'Authorization': 'Bearer ' + token.trim(),
            'Accept': 'application/vnd.github.v3+json'
          }
        });
        if (!res.ok) throw new Error('GitHub API error ' + res.status);
        const gist = await res.json();
        const fileObj = gist.files && gist.files['phantom_os_backup.json'];
        if (!fileObj || !fileObj.content) throw new Error('No phantom_os_backup.json found in this Gist.');
        const remoteData = JSON.parse(fileObj.content);
        const count = await applyUniversalBackupPayload(remoteData, onReload);
        const now = new Date().toISOString();
        setGhLastSync(now); localStorage.setItem('phantom_last_sync', now);
        saveGh(token, gistId, autoSync);
        setMsg('Pulled ' + count + ' items from GitHub at ' + new Date().toLocaleTimeString());
        alert('Sync complete! ' + count + ' items restored from GitHub cloud.');
      } catch (err) {
        alert('Pull failed: ' + err.message);
        setMsg('Error: ' + err.message);
      } finally {
        setBusy(false);
      }
    };

    return (
      <div className="backdrop" onClick={(e) => { if (e.target.classList.contains('backdrop')) onClose(); }}>
        <div className="sheet" style={{ maxHeight: '90vh', overflowY: 'auto' }}>
          <div className="sheet-top">
            <h2>Cross-Device Cloud Sync</h2>
            <button className="sheet-x" onClick={onClose} aria-label="Close">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>

          <div className="viewtabs" style={{ margin: '8px 0 16px 0', borderBottom: '1px solid var(--line-subtle)' }}>
            <button className={tab === 'cloudflare' ? 'active' : ''} onClick={() => setTab('cloudflare')}>☁️ Cloudflare</button>
            <button className={tab === 'github' ? 'active' : ''} onClick={() => setTab('github')}>🐙 GitHub</button>
            <button className={tab === 'file' ? 'active' : ''} onClick={() => setTab('file')}>📲 AirDrop / File</button>
          </div>

          <div className="sync-modal-body">
            {tab === 'cloudflare' && (
              <React.Fragment>
                <div className="sync-card">
                  <h3>Cloudflare Worker (Laptop ⇄ Phone)</h3>
                  <div className="sync-status">
                    {cfLastSync ? ('Last synced: ' + new Date(cfLastSync).toLocaleString()) : 'Not synced yet'}
                  </div>
                  {msg && <p style={{ fontSize: '12px', color: 'var(--accent)', margin: '4px 0 8px' }}>{msg}</p>}
                  <div className="sync-row">
                    <button className="btn primary sm" disabled={busy || !cfUrl || !cfKey} onClick={() => handleCfAction('sync')}>
                      🔄 Sync Now
                    </button>
                    <button className="btn sm" disabled={busy || !cfUrl || !cfKey} onClick={() => handleCfAction('push')}>
                      ⬆ Push to Cloud
                    </button>
                    <button className="btn sm" disabled={busy || !cfUrl || !cfKey} onClick={() => handleCfAction('pull')}>
                      ⬇ Pull to Device
                    </button>
                  </div>
                </div>

                <div className="sync-card">
                  <h3>Cloudflare Settings</h3>
                  <p className="field-help" style={{ margin: '0 0 8px' }}>Enter the same Worker URL and Secret Key on your laptop and phone to keep them privately synced in real-time.</p>

                  <label>Cloudflare Worker URL</label>
                  <input type="text" value={cfUrl} onChange={e => { setCfUrl(e.target.value); saveCf(e.target.value, cfKey, cfAuto); }} placeholder="https://my-phantom-sync.yourname.workers.dev/api/sync" />

                  <label>Secret Sync Key / Passphrase</label>
                  <input type="password" value={cfKey} onChange={e => { setCfKey(e.target.value); saveCf(cfUrl, e.target.value, cfAuto); }} placeholder="e.g. your_secret_passphrase" />

                  <label style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: 'pointer', marginTop: '12px' }}>
                    <input type="checkbox" checked={cfAuto} onChange={e => { setCfAuto(e.target.checked); saveCf(cfUrl, cfKey, e.target.checked); }} />
                    <span style={{ fontSize: '13px' }}>Sync automatically on app launch</span>
                  </label>

                  <div style={{ marginTop: '14px' }}>
                    <button type="button" className="link" onClick={() => setShowGuide(g => !g)} style={{ fontSize: '12px' }}>
                      {showGuide ? 'Hide Cloudflare 2-minute setup guide ▴' : 'How to set up your free Cloudflare Worker ▾'}
                    </button>
                    {showGuide && (
                      <div style={{ marginTop: '8px', padding: '10px', background: 'rgba(255,255,255,0.03)', borderRadius: '8px', fontSize: '12px', lineHeight: '1.5' }}>
                        <p><strong>Step 1:</strong> Log in at <a href="https://dash.cloudflare.com" target="_blank" rel="noopener noreferrer" style={{ color: 'var(--accent)' }}>dash.cloudflare.com</a> (100% free account).</p>
                        <p><strong>Step 2:</strong> Go to <em>Workers &amp; Pages</em> &rarr; <em>Create Worker</em> &rarr; <em>Deploy</em>.</p>
                        <p><strong>Step 3:</strong> Click <em>Edit code</em>, paste the code from <code>cloudflare-worker.js</code> in this repo, and deploy.</p>
                        <p><strong>Step 4:</strong> In Worker <em>Settings &rarr; KV Namespace Bindings</em>, add <code>HOMEWORK_KV</code> bound to a KV namespace.</p>
                        <p><strong>Step 5:</strong> Copy your worker URL, paste it above, pick any passphrase, and you are all set!</p>
                      </div>
                    )}
                  </div>
                </div>
              </React.Fragment>
            )}

            {tab === 'github' && (
              <React.Fragment>
                <div className="sync-card">
                  <h3>GitHub Gist Status</h3>
                  <div className="sync-status">
                    {ghLastSync ? ('Last synced: ' + new Date(ghLastSync).toLocaleString()) : 'Not synced yet'}
                  </div>
                  {msg && <p style={{ fontSize: '12px', color: 'var(--accent)', margin: '4px 0 8px' }}>{msg}</p>}
                  <div className="sync-row">
                    <button className="btn primary sm" disabled={busy || !token || !gistId} onClick={handlePushGh}>
                      ⬆ Push to Gist
                    </button>
                    <button className="btn sm" disabled={busy || !token || !gistId} onClick={handlePullGh}>
                      ⬇ Pull from Gist
                    </button>
                  </div>
                </div>

                <div className="sync-card">
                  <h3>GitHub Configuration</h3>
                  <label>GitHub Personal Access Token (with 'gist' scope)</label>
                  <input type="password" value={token} onChange={e => { setToken(e.target.value); saveGh(e.target.value, gistId, autoSync); }} placeholder="ghp_xxxxxxxxxxxx" />

                  <label>Gist ID</label>
                  <input type="text" value={gistId} onChange={e => { setGistId(e.target.value); saveGh(token, e.target.value, autoSync); }} placeholder="e.g. 7f8a9b..." />

                  <div style={{ marginTop: '10px' }}>
                    <button className="btn sm ghost" disabled={busy || !token.trim()} onClick={handleCreateGist}>
                      ＋ Create New Backup Gist
                    </button>
                  </div>
                </div>
              </React.Fragment>
            )}

            {tab === 'file' && (
              <div className="sync-card">
                <h3>AirDrop &amp; Direct File Transfer</h3>
                <p className="field-help" style={{ margin: '0 0 10px' }}>Instantly AirDrop your full database to your phone or PC, or export a backup JSON file.</p>
                <div className="sync-row">
                  <button className="btn sm primary" onClick={universalExportData}>
                    📲 AirDrop / Share Backup
                  </button>
                  <button className="btn sm" onClick={() => fileRef.current && fileRef.current.click()}>
                    📁 Import JSON
                  </button>
                  <input ref={fileRef} type="file" accept="application/json" hidden onChange={e => {
                    if (e.target.files[0]) universalImportData(e.target.files[0], onReload);
                    e.target.value = '';
                  }} />
                </div>
              </div>
            )}
          </div>
          <div style={{ height: '30px' }}></div>
        </div>
      </div>
    );
  }

  function HomeworkApp({ onHome, onBack }) {
    const [items, setItems] = useState([]);
    const [attsByHw, setAttsByHw] = useState({});
    const [filter, setFilter] = useState('todo');
    const [search, setSearch] = useState('');
    const [sheet, setSheet] = useState(null);
    const [addMenu, setAddMenu] = useState(false);
    const [mode, setMode] = useState('list');           // 'list' | 'exams' | 'grades' | 'cal' | 'sched'
    const [semesters, setSemesters] = useState([]);
    const [selSem, setSelSem] = useState(() => localStorage.getItem('hw_sem') || null);
    const [semSheet, setSemSheet] = useState(null);
    const [classes, setClasses] = useState([]);
    const [classSheet, setClassSheet] = useState(null);
    const [delTarget, setDelTarget] = useState(null);
    const [detailId, setDetailId] = useState(null);
    const [syncOpen, setSyncOpen] = useState(false);
    const urlsRef = useRef([]);
    const importRef = useRef(null);

    const load = useCallback(async () => {
      const [hw, atts, sems, cls] = [await getAllHW(), await getAllAtts(), await getAllSem(), await getAllClasses()];
      urlsRef.current.forEach(URL.revokeObjectURL); urlsRef.current = [];
      const map = {};
      for (const a of atts) {
        const url = URL.createObjectURL(a.blob); urlsRef.current.push(url);
        (map[a.homeworkId] ||= []).push({ ...a, url });
      }
      setItems(hw); setAttsByHw(map);
      setSemesters(sems.slice().sort((a, b) => (a.start || '').localeCompare(b.start || '')));
      setClasses(cls);
    }, []);

    useEffect(() => {
      openDB().then(d => {
        db = d;
        load();
        // Quiet background Cloudflare auto-sync
        const cfAuto = localStorage.getItem('phantom_cf_auto') === 'true';
        const cfUrl = localStorage.getItem('phantom_cf_url');
        const cfKey = localStorage.getItem('phantom_cf_key');
        if (cfAuto && cfUrl && cfKey) {
          syncWithCloudflare({ workerUrl: cfUrl, syncKey: cfKey, mode: 'sync' })
            .then(res => {
              if (res && res.action === 'pulled') load();
            })
            .catch(e => console.warn('Background Cloudflare auto-sync skipped:', e));
        }
      });
    }, []);

    const chooseSem = (id) => { setSelSem(id); try { if (id) localStorage.setItem('hw_sem', id); else localStorage.removeItem('hw_sem'); } catch (e) {} };
    const deleteSem = async (s) => {
      if (!confirm('Delete this semester? (Your homework is not deleted.)')) return;
      await delSemRec(s.id);
      if (selSem === s.id) chooseSem(null);
      setSemSheet(null); load();
    };
    const deleteClass = async (c) => {
      if (!confirm('Delete this class?')) return;
      await delClassRec(c.id); setClassSheet(null); load();
    };

    const unassignedClasses = classes.filter(c => !c.semesterId);
    const unassignedHW = items.filter(i => !i.semesterId);
    const totalUnassigned = unassignedClasses.length + unassignedHW.length;

    const groupIntoSemester = async (semId) => {
      if (!semId) return;
      let count = 0;
      for (const c of classes) {
        if (!c.semesterId) { await putClass({ ...c, semesterId: semId }); count++; }
      }
      for (const it of items) {
        if (!it.semesterId) { await putHW({ ...it, semesterId: semId }); count++; }
      }
      await load();
      alert('Grouped ' + count + ' items into semester!');
    };

    const activeItems = items.filter(i => !i.archived);
    const semObj = semesters.find(s => s.id === selSem);
    const semActiveItems = selSem ? activeItems.filter(i => {
      if (i.semesterId === selSem) return true;
      if (classes.some(c => c.semesterId === selSem && c.subject.trim().toLowerCase() === (i.subject || '').trim().toLowerCase())) return true;
      if (semObj && i.dueDate && i.dueDate >= semObj.start && i.dueDate <= semObj.end) return true;
      return false;
    }) : activeItems;
    const homeworkItems = semActiveItems.filter(i => (i.kind || 'homework') !== 'exam');
    const examItems = semActiveItems.filter(i => i.kind === 'exam');
    const openCount = homeworkItems.filter(i => !i.done).length;

    // remember the colour last used for each subject, so new entries match
    const subjectColors = {};
    for (const c of classes) if (c.subject && c.color) subjectColors[c.subject.trim().toLowerCase()] = c.color;
    for (const i of items) if (i.subject && i.color) subjectColors[i.subject.trim().toLowerCase()] = i.color;

    // subjects you can tap-to-pick when adding homework, taken from your schedule classes
    const classSubjects = [];
    const seenSubj = new Set();
    const semClassesForPick = selSem ? classes.filter(c => c.semesterId === selSem || (!c.semesterId && semesters.length <= 1)) : classes;
    for (const c of semClassesForPick) {
      const key = (c.subject || '').trim().toLowerCase();
      if (key && !seenSubj.has(key)) { seenSubj.add(key); classSubjects.push({ subject: c.subject.trim(), color: c.color || '' }); }
    }

    function remindAll() {
      const ics = buildICS(activeItems.filter(i => !i.done && i.dueDate));
      if (!ics) { alert('No upcoming homework with a due date to add.'); return; }
      downloadICS('homework.ics', ics);
    }

    const sortByDue = (a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      const ad = a.dueDate || '9999-99-99', bd = b.dueDate || '9999-99-99';
      if (ad !== bd) return ad < bd ? -1 : 1;
      return (a.createdAt||0) - (b.createdAt||0);
    };
    let view = homeworkItems.filter(i => filter === 'all' ? true : filter === 'done' ? i.done : !i.done);
    if (search.trim()) {
      const t = search.toLowerCase();
      view = view.filter(i => (i.title||'').toLowerCase().includes(t) || (i.subject||'').toLowerCase().includes(t) ||
        (i.classNo||'').toLowerCase().includes(t) ||
        (i.className||'').toLowerCase().includes(t) || (i.notes||'').toLowerCase().includes(t));
    }
    view = view.slice().sort(sortByDue);
    const examView = examItems.slice().sort(sortByDue);
    const detailItem = detailId ? items.find(i => i.id === detailId) : null;

    const toggle = async (it) => { await putHW({ ...it, done: !it.done }); load(); };
    const patchItem = async (it, patch) => { await putHW({ ...it, ...patch }); load(); };
    const removeAtts = async (id) => { for (const a of await getAttsFor(id)) await delAtt(a.id); };
    const reallyDelete = async (it, keepGrade) => {
      await removeAtts(it.id);
      if (keepGrade) await putHW({ ...it, archived: true });
      else await delHWrec(it.id);
      setDelTarget(null); load();
    };
    const del = (it) => {
      const hasGrade = it.grade !== '' && it.grade != null;
      if (hasGrade) { setDelTarget(it); return; }
      if (confirm('Delete this item and its attachments?')) reallyDelete(it, false);
    };

    const exportData = universalExportData;
    const importData = (file) => universalImportData(file, load);

    return (
      <React.Fragment>
        <header className="has-nav">
          <button className="backbtn" onClick={onBack} aria-label="Back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <button className="homebtn" onClick={onHome} aria-label="Home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          </button>
          <div className="brand">
            <Ghost />
            <div className="wordmark"><Flick text="HOMEWORK" /></div>
          </div>
          <div className="viewtabs">
            <button className={mode === 'list' ? 'active' : ''} onClick={() => setMode('list')}>Homework</button>
            <button className={mode === 'exams' ? 'active' : ''} onClick={() => setMode('exams')}>Exams</button>
            <button className={mode === 'grades' ? 'active' : ''} onClick={() => setMode('grades')}>Grades</button>
            <button className={mode === 'cal' ? 'active' : ''} onClick={() => setMode('cal')}>Calendar</button>
            <button className={mode === 'sched' ? 'active' : ''} onClick={() => setMode('sched')}>Schedule</button>
          </div>
        </header>

        <main>
          {mode === 'list' ? (
            <React.Fragment>
              <div className="sembar">
                <button className={'schip' + (!selSem ? ' on' : '')} onClick={() => chooseSem(null)}>All</button>
                {semesters.map(s => <button key={s.id} className={'schip' + (selSem === s.id ? ' on' : '')} onClick={() => chooseSem(s.id)}>{s.name}</button>)}
                {semObj && <button className="schip edit-sem-btn" onClick={() => setSemSheet({ editing: semObj })} title="Edit semester name">✏️ Edit</button>}
                <button className="schip newitem" onClick={() => setSemSheet({})}>＋ Semester</button>
              </div>

              {selSem && (unassignedClasses.length > 0 || unassignedHW.length > 0) && (
                <div className="unassigned-banner">
                  <div className="unassigned-text">
                    <strong>{unassignedClasses.length} class{unassignedClasses.length === 1 ? '' : 'es'} &amp; {unassignedHW.length} homework{unassignedHW.length === 1 ? '' : 's'}</strong> in “All”
                  </div>
                  <button className="btn primary sm" onClick={() => groupIntoSemester(selSem)}>
                    Group into “{semObj ? semObj.name : 'this semester'}”
                  </button>
                </div>
              )}

              <div className="toolbar">
                <input className="search" placeholder="Search homework…" value={search} onChange={e => setSearch(e.target.value)} />
              </div>
              <div className="filters">
                {[['todo','To do'],['done','Done'],['all','All']].map(([f,lbl]) =>
                  <button key={f} className={filter === f ? 'active' : ''} onClick={() => setFilter(f)}>{lbl}</button>)}
              </div>

              {view.length === 0
                ? <div className="empty">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.3"><rect x="4" y="4" width="16" height="16"/><path d="M8 9h8M8 13h6"/></svg>
                    <p>{filter === 'todo' ? 'All caught up' : 'Nothing here yet'}</p>
                  </div>
                : view.map(it => <Card key={it.id} item={it} atts={attsByHw[it.id] || []} onToggle={toggle} onOpen={(i)=>setDetailId(i.id)} />)}

              <div className="footer-tools">
                <button className="link" onClick={remindAll}>🔔 Add to Calendar</button>
                <button className="link" onClick={() => setSyncOpen(true)}>🔄 Cloud Sync</button>
                <button className="link" onClick={exportData}>Backup</button>
                <button className="link" onClick={() => importRef.current.click()}>Restore</button>
                <input ref={importRef} type="file" accept="application/json" hidden onChange={e => { if (e.target.files[0]) importData(e.target.files[0]); e.target.value = ''; }} />
              </div>
            </React.Fragment>
          ) : mode === 'exams' ? (
            <React.Fragment>
              <div className="sembar">
                <button className={'schip' + (!selSem ? ' on' : '')} onClick={() => chooseSem(null)}>All</button>
                {semesters.map(s => <button key={s.id} className={'schip' + (selSem === s.id ? ' on' : '')} onClick={() => chooseSem(s.id)}>{s.name}</button>)}
                {semObj && <button className="schip edit-sem-btn" onClick={() => setSemSheet({ editing: semObj })} title="Edit semester name">✏️ Edit</button>}
                <button className="schip newitem" onClick={() => setSemSheet({})}>＋ Semester</button>
              </div>
              <div className="sched-head"><span className="mlabel">Exams</span></div>
              {examView.length === 0
                ? <div className="empty">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.3"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>
                    <p>No exams yet — tap ＋ and pick Exam</p>
                  </div>
                : examView.map(it => <Card key={it.id} item={it} atts={attsByHw[it.id] || []} onToggle={toggle} onOpen={(i)=>setDetailId(i.id)} />)}
            </React.Fragment>
          ) : mode === 'grades' ? (
            <Grades items={items} classes={classes} semesters={semesters} selId={selSem}
              onSelSem={chooseSem} onNewSem={() => setSemSheet({})} onEditSem={(s) => setSemSheet({ editing: s })}
              onPatch={patchItem} onEditItem={(i)=>setDetailId(i.id)} />
          ) : mode === 'cal' ? (
            <Calendar items={activeItems} semesters={semesters} selId={selSem}
              onSelSem={chooseSem} onNewSem={() => setSemSheet({})} onEditSem={(s) => setSemSheet({ editing: s })}
              onEditItem={(i) => setDetailId(i.id)} onAddForDay={(iso) => setSheet({ date: iso, prefillSem: selSem })} />
          ) : (
            <Schedule classes={classes} semesters={semesters} selId={selSem}
              onSelSem={chooseSem} onNewSem={() => setSemSheet({})} onEditSem={(s) => setSemSheet({ editing: s })}
              onGroupUnassigned={groupIntoSemester}
              onNew={() => setClassSheet({ selSem })} onEdit={(c) => setClassSheet({ editing: c, selSem })} />

          )}
        </main>

        {mode !== 'cal' && mode !== 'sched' &&
          <button className="add" onClick={() => setAddMenu(true)} aria-label="Add">＋</button>}
        {addMenu &&
          <div className="addmenu-backdrop" onClick={() => setAddMenu(false)}>
            <div className="addmenu" onClick={e => e.stopPropagation()}>
              <button onClick={() => { setAddMenu(false); setSheet({ newKind: 'exam', prefillSem: selSem }); }}>📝 New exam</button>
              <button onClick={() => { setAddMenu(false); setSheet({ newKind: 'homework', prefillSem: selSem }); }}>📓 New homework</button>
            </div>
          </div>}

        {delTarget &&
          <div className="backdrop" style={{ alignItems: 'center' }} onClick={(e) => { if (e.target.classList.contains('backdrop')) setDelTarget(null); }}>
            <div className="dialog">
              <h2>Delete “{(delTarget.title && delTarget.title.trim()) || delTarget.subject || 'this item'}”?</h2>
              <p className="dialog-text">It has a grade of {delTarget.grade} / {maxOf(delTarget)} in corte {corteOf(delTarget)}. Do you want to keep that grade counting toward your average?</p>
              <button className="btn ghost wide-one" onClick={() => reallyDelete(delTarget, true)}>Delete, keep the grade</button>
              <button className="btn danger wide-one" onClick={() => reallyDelete(delTarget, false)}>Delete everything</button>
              <button className="btn ghost wide-one" onClick={() => setDelTarget(null)}>Cancel</button>
            </div>
          </div>}

        {detailItem && <DetailSheet item={detailItem} atts={attsByHw[detailItem.id] || []}
          onClose={() => setDetailId(null)}
          onEdit={(it) => { setDetailId(null); setSheet({ editing: it }); }}
          onToggle={toggle}
          onDelete={(it) => { setDetailId(null); del(it); }}
          onChanged={load} />}

        {sheet && <Sheet initial={sheet.editing || null} semesters={semesters} prefillDate={sheet.date || ''} prefillSem={sheet.prefillSem || selSem || ''} newKind={sheet.newKind || 'homework'} subjectColors={subjectColors} classSubjects={classSubjects} onClose={() => setSheet(null)} onSaved={() => { setSheet(null); load(); }} />}
        {semSheet && <SemesterSheet initial={semSheet.editing || null} unassignedCount={totalUnassigned} onGroupUnassigned={groupIntoSemester} onClose={() => setSemSheet(null)} onDelete={deleteSem} onSaved={(id) => { setSemSheet(null); chooseSem(id); load(); }} />}
        {classSheet && <ClassSheet initial={classSheet.editing || null} semesters={semesters} selSem={classSheet.selSem || selSem || ''} subjectColors={subjectColors} onClose={() => setClassSheet(null)} onDelete={deleteClass} onSaved={() => { setClassSheet(null); load(); }} />}
        {syncOpen && <SyncSheet onClose={() => setSyncOpen(false)} onReload={load} />}
      </React.Fragment>
    );
  }

  /* ---------- Notes module ---------- */
  function NoteSheet({ initial, onClose, onSaved, onDelete }) {
    const [title, setTitle] = useState(initial ? (initial.title || '') : '');
    const [body, setBody] = useState(initial ? (initial.body || '') : '');
    const [color, setColor] = useState(initial ? (initial.color || '') : '');
    const ref = useRef(null);
    useEffect(() => { setTimeout(() => ref.current && ref.current.focus(), 120); }, []);
    async function save() {
      const t = title.trim(), bd = body.trim();
      if (!t && !bd) { onClose(); return; }
      const id = initial ? initial.id : uid();
      await putNote({ id, title: t, body: bd, color, pinned: initial ? !!initial.pinned : false,
        createdAt: initial ? initial.createdAt : Date.now(), updatedAt: Date.now() });
      onSaved();
    }
    return (
      <div className="backdrop" onClick={(e) => { if (e.target.classList.contains('backdrop')) onClose(); }}>
        <div className="sheet">
          <div className="sheet-top">
            <h2>{initial ? 'Edit note' : 'New note'}</h2>
            <button className="sheet-x" onClick={onClose} aria-label="Close">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
          <label>Title</label>
          <input ref={ref} type="text" value={title} onChange={e => setTitle(e.target.value)} placeholder="Title" autoComplete="off" style={color ? { color } : undefined} />
          <label>Note</label>
          <textarea value={body} onChange={e => setBody(e.target.value)} placeholder="Write anything…" style={{ minHeight: '180px' }} />
          <label>Colour</label>
          <Swatches color={color} onChange={setColor} />


          {initial &&
            <div className="sheet-actions"><button className="btn danger wide-one" onClick={() => onDelete(initial)}>Delete note</button></div>}
          <div style={{ height: '78px' }}></div>
        </div>
        <div className="sheet-fabs">
          <button className="fab save" onClick={save} aria-label="Save note">
            <svg viewBox="0 0 24 24" fill="none" stroke="#000" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12l5 5L20 6"/></svg>
          </button>
        </div>
      </div>
    );
  }

  function NoteView({ note, onClose, onEdit, onDelete, onTogglePin }) {
    return (
      <div className="backdrop" onClick={(e) => { if (e.target.classList.contains('backdrop')) onClose(); }}>
        <div className="sheet">
          <div className="sheet-top">
            <h2>Note</h2>
            <button className="sheet-x" onClick={onClose} aria-label="Close">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
          {note.title && <p className="detail-title" style={note.color ? { color: note.color } : undefined}>{note.title}</p>}
          {note.body && <p className="note-full">{note.body}</p>}
          <div className="detail-foot">
            <button className="btn primary wide-one" onClick={() => onEdit(note)}>Edit</button>
            <div className="detail-links">
              <button className="link" onClick={() => onTogglePin(note)}>{note.pinned ? '★ Unpin' : '☆ Pin'}</button>
              <button className="link danger" onClick={() => onDelete(note)}>Delete</button>
            </div>
          </div>
          <div style={{ height: '20px' }}></div>
        </div>
      </div>
    );
  }

  function NotesApp({ onHome, onBack }) {
    const [notes, setNotes] = useState([]);
    const [search, setSearch] = useState('');
    const [sheet, setSheet] = useState(null);
    const [viewId, setViewId] = useState(null);
    const load = useCallback(async () => { setNotes(await getAllNotes()); }, []);
    useEffect(() => {
      openDB().then(d => {
        db = d;
        load();
        // Quiet background Cloudflare auto-sync
        const cfAuto = localStorage.getItem('phantom_cf_auto') === 'true';
        const cfUrl = localStorage.getItem('phantom_cf_url');
        const cfKey = localStorage.getItem('phantom_cf_key');
        if (cfAuto && cfUrl && cfKey) {
          syncWithCloudflare({ workerUrl: cfUrl, syncKey: cfKey, mode: 'sync' })
            .then(res => {
              if (res && res.action === 'pulled') load();
            })
            .catch(e => console.warn('Background Cloudflare auto-sync skipped:', e));
        }
      });
    }, []);
    async function togglePin(n) { await putNote({ ...n, pinned: !n.pinned, updatedAt: Date.now() }); load(); }

    }, []);
    useEffect(() => {

        // Quiet background Cloudflare auto-sync
        const cfAuto = localStorage.getItem('phantom_cf_auto') === 'true';
        const cfUrl = localStorage.getItem('phantom_cf_url');

        if (cfAuto && cfUrl && cfKey) {

            .then(res => {
              if (res && res.action === 'pulled') load();
            })
            .catch(e => console.warn('Background Cloudflare auto-sync skipped:', e));
        }
      });
    }, []);
    const dayIso = (back) => { const d = new Date(); d.setDate(d.getDate() - back); return toIso(d); };
    const isDone = (h, iso) => !!log[h.id + '|' + iso];
    async function toggle(h, iso) {
      const key = h.id + '|' + iso;
      if (log[key]) await delFrom('hlog', key); else await putIn('hlog', { key, habitId: h.id, date: iso });
      load();
    }
    function streak(h) {
      let n = 0;
      for (let i = 0; i < 400; i++) {
        const iso = dayIso(i);
        if (isDone(h, iso)) n++;
        else if (i > 0) break;            // today not done yet doesn't break the streak
        else if (i === 0) continue;
      }
      return n;
    }
    async function del(h) {
      if (!confirm('Delete this habit and its history?')) return;
      await delFrom('habits', h.id);
      for (const k of Object.keys(log)) if (k.startsWith(h.id + '|')) await delFrom('hlog', k);
      setSheet(null); load();
    }
    const today = todayIsoStr();
    const doneToday = habits.filter(h => isDone(h, today)).length;

      <React.Fragment>
        <ModHeader text="HEALTH" onBack={onBack} onHome={onHome} />

                        <span>{h.icon || '•'}</span>
                      </button>
                      <div className="habit-body" onClick={() => setSheet({ editing: h })}>
                        <p className="title" style={h.color ? { color: h.color } : undefined}>{h.name}</p>
                        <div className="week-dots">
                          {[6,5,4,3,2,1,0].map(b => {
                            const iso = dayIso(b);
                            return <i key={b} className={isDone(h, iso) ? 'on' : ''} style={isDone(h, iso) && h.color ? { background: h.color } : undefined}
                              onClick={(e) => { e.stopPropagation(); toggle(h, iso); }}></i>;
                          })}
                        </div>
                      </div>
                      <span className="streak">{st > 0 ? '🔥 ' + st : '—'}</span>

                );
              })}

  /* ================= FINANCES (USD + Bs, Venezuela) ================= */
  const CUR = ['USD', 'Bs'];
  const CAT = ['Food','Transport','School','Fun','Health','Home','Gift','Other'];
  const money = (n, c) => (c === 'Bs' ? 'Bs ' : '$') + (Math.round(n * 100) / 100).toLocaleString(LOC, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  /* How a price is quoted / paid (Venezuela):
     Bs  — priced in bolívares      → real cost uses the PARALELO rate
     USD — priced in $ but charged in Bs at the BCV rate (shops, local services)
     Div — divisas: you actually pay in dollars (Zelle, cash, card) → no conversion */
  const MODES = [
    { id: 'Bs',  label: 'Bs',        help: 'Priced in bolívares — real cost uses the paralelo rate.' },
    { id: 'USD', label: '$ (BCV)',   help: 'Priced in $ but charged in Bs at the BCV rate.' },
    { id: 'Div', label: '$ divisas', help: 'You pay in real dollars (Zelle, cash, card) — no conversion.' }
  ];
  const modeOf = (o) => o.mode || (o.cur === 'Bs' ? 'Bs' : 'Div');   // back-compat with older entries
  const modeCur = (m) => (m === 'Bs' ? 'Bs' : 'USD');
  // What it really costs you in dollars.
  function realUSD(amount, mode, bcv, par) {
    if (mode === 'Bs')  return par > 0 ? amount / par : null;
    if (mode === 'USD') return (bcv > 0 && par > 0) ? (amount * bcv) / par : null;
    return amount;                                    // Div — already dollars
  }
  // How much it moves the wallet it came from, in that wallet's own currency.
  function walletDelta(amount, mode, walletCur, bcv, par) {
    if (walletCur === 'Bs') {
      if (mode === 'Bs')  return amount;
      if (mode === 'USD') return bcv > 0 ? amount * bcv : 0;
      return par > 0 ? amount * par : 0;
    }
    if (mode === 'Bs') return par > 0 ? amount / par : 0;
    return amount;
  }
  /* ---------- Live exchange rates (BCV + paralelo), fetched on-device ---------- */
  const RATE_SOURCES = [
    { name: 'DolarAPI', url: 'https://ve.dolarapi.com/v1/dolares',
      parse: (j) => {
        if (!Array.isArray(j)) return null;
        const val = (o) => { if (!o) return null; const n = Number(o.promedio != null ? o.promedio : (o.venta != null ? o.venta : o.compra)); return isFinite(n) && n > 0 ? n : null; };
        const find = (f) => j.find(x => String(x.fuente || x.nombre || '').toLowerCase().includes(f));
        return { bcv: val(find('oficial')), par: val(find('paralelo')) };
      } },
    { name: 'PyDolarVe', url: 'https://pydolarve.org/api/v1/dollar?page=criptodolar',
      parse: (j) => {
        const m = j && j.monitors; if (!m) return null;
        const val = (o) => { const n = o && Number(o.price); return isFinite(n) && n > 0 ? n : null; };
        return { bcv: val(m.bcv), par: val(m.enparalelovzla || m.paralelo || m.binance) };
      } },
    { name: 'PyDolarVe BCV', url: 'https://pydolarve.org/api/v1/dollar?page=bcv',
      parse: (j) => {
        const m = j && j.monitors; if (!m) return null;
        const val = (o) => { const n = o && Number(o.price); return isFinite(n) && n > 0 ? n : null; };
        return { bcv: val(m.usd || m.bcv), par: null };

  async function fetchFromSource(src, ms) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    try {
      const res = await fetch(src.url, { signal: ctrl.signal, cache: 'no-store' });
      if (!res.ok) return null;
      const parsed = src.parse(await res.json());
      if (!parsed || (!parsed.bcv && !parsed.par)) return null;
      return { bcv: parsed.bcv, par: parsed.par, src: src.name };
    } catch (e) { return null; }
    finally { clearTimeout(timer); }

  async function fetchRates() {

    for (const s of RATE_SOURCES) {
      const r = await fetchFromSource(s, 9000);
      if (!r) continue;
      if (r.bcv && r.par) return r;
      best = best ? { bcv: best.bcv || r.bcv, par: best.par || r.par, src: best.src + ' + ' + r.src } : r;
      if (best.bcv && best.par) return best;
    }

  /* Tiny safe calculator — digits and + - * / ( ) only, no eval. */
  function calcEval(str) {
    const s = String(str || '').replace(/,/g, '.').replace(/\s+/g, '');
    if (!s || !/^[0-9+\-*/().]+$/.test(s)) return null;
    let i = 0;
    const peek = () => s[i];
    function factor() {
      if (peek() === '+') { i++; return factor(); }
      if (peek() === '-') { i++; return -factor(); }
      if (peek() === '(') { i++; const v = expr(); if (peek() === ')') i++; return v; }
      const start = i;
      while (i < s.length && /[0-9.]/.test(s[i])) i++;
      const n = parseFloat(s.slice(start, i));
      return isNaN(n) ? NaN : n;
    }
    function term() {
      let v = factor();
      while (peek() === '*' || peek() === '/') { const op = s[i++]; const r = factor(); v = op === '*' ? v * r : (r === 0 ? NaN : v / r); }
      return v;
    }
    function expr() {
      let v = term();
      while (peek() === '+' || peek() === '-') { const op = s[i++]; const r = term(); v = op === '+' ? v + r : v - r; }
      return v;
    }
    const val = expr();
    if (i < s.length) return null;
    return isFinite(val) ? val : null;
  }

    if (!at) return '';
    const mins = Math.round((Date.now() - at) / 60000);
    if (mins < 2) return 'just now';
    if (mins < 60) return mins + ' min ago';
    const h = Math.round(mins / 60);
    if (h < 24) return h + (h === 1 ? ' hour ago' : ' hours ago');
    const d = Math.round(h / 24);
    return d + (d === 1 ? ' day ago' : ' days ago');
  }

                : subs.slice().sort((a, b) => a.day - b.day).map(s =>
                    <div key={s.id} className="card fin-row" onClick={() => setSSheet({ editing: s })} style={{ cursor: 'pointer' }}>
                      <div className="fin-left">
                        <span className="fin-name">{s.name}</span>
                        <span className="fin-sub">Day {s.day} of each month</span>
                      </div>
                      <span className="fin-amtwrap">
                        <span className="fin-amt">{money(s.amount, modeCur(modeOf(s)))}</span>
                        {convLine(s) && <span className="fin-real">{convLine(s)}</span>}
                      </span>
                    </div>)}
            </React.Fragment>
          ) : (
            <React.Fragment>
              <label>Amount</label>
              <input type="text" inputMode="decimal" value={calcVal} onChange={e => setCalcVal(e.target.value)}
                placeholder="e.g. 1200   ·   350*3" style={{ fontSize: '26px' }} />
              <p className="field-help">You can type simple math too: + − * / and ( ).</p>
              <label>This amount is in</label>
              <div className="daypick">
                <button type="button" className={'dchip' + (calcCur === 'Bs' ? ' on' : '')} onClick={() => setCalcCur('Bs')}>Bolívares</button>
                <button type="button" className={'dchip' + (calcCur === 'USD' ? ' on' : '')} onClick={() => setCalcCur('USD')}>Dollars</button>
              </div>
              {calcNum == null
                ? <div className="day-empty">{calcVal.trim() ? 'That is not a valid amount.' : 'Type an amount to convert.'}</div>
                : calcCur === 'Bs' ? (
                  <React.Fragment>
                    <h3 className="sec-title">{money(calcNum, 'Bs')} is…</h3>
                    <div className="card fin-row"><div className="fin-left">
                      <span className="fin-name">{par ? money(calcNum / par, 'USD') : '—'}</span>
                      <span className="fin-sub">at paralelo — what it's really worth</span></div></div>
                    <div className="card fin-row"><div className="fin-left">
                      <span className="fin-name">{bcv ? money(calcNum / bcv, 'USD') : '—'}</span>
                      <span className="fin-sub">at BCV — the official rate</span></div></div>
                  </React.Fragment>
                ) : (
                  <React.Fragment>
                    <h3 className="sec-title">{money(calcNum, 'USD')} is…</h3>
                    <div className="card fin-row"><div className="fin-left">
                      <span className="fin-name">{bcv ? money(calcNum * bcv, 'Bs') : '—'}</span>
                      <span className="fin-sub">at BCV — what a shop charges you in Bs</span></div></div>
                    <div className="card fin-row"><div className="fin-left">
                      <span className="fin-name">{par ? money(calcNum * par, 'Bs') : '—'}</span>
                      <span className="fin-sub">at paralelo — what it costs you to buy those Bs</span></div></div>
                    {bcv > 0 && par > 0 &&
                      <div className="card fin-row"><div className="fin-left">
                        <span className="fin-name">{money(calcNum * bcv / par, 'USD')}</span>
                        <span className="fin-sub">real cost if you pay it in Bs at the BCV rate</span></div></div>}
                  </React.Fragment>
                )}
              {(!par || !bcv) && <p className="field-help">Set both rates in the Money tab to see every conversion.</p>}
            </React.Fragment>
          )}
        </main>
        {tab !== 'calc' &&
          <button className="add" onClick={() => { if (tab === 'subs') setSSheet({}); else if (tab === 'money') setWSheet({}); else setTSheet({}); }} aria-label="Add">＋</button>}
        {wSheet && <WalletSheet initial={wSheet.editing || null} onClose={() => setWSheet(null)} onSaved={() => { setWSheet(null); load(); }} onDelete={delWallet} />}
        {tSheet && <TxSheet initial={tSheet.editing || null} wallets={wallets} onClose={() => setTSheet(null)} onSaved={() => { setTSheet(null); load(); }} onDelete={delTx} />}
        {sSheet && <SubSheet initial={sSheet.editing || null} onClose={() => setSSheet(null)} onSaved={() => { setSSheet(null); load(); }} onDelete={delSub} />}
      </React.Fragment>
    );
  }

  /* ---------- Placeholder for modules not built yet ---------- */
  function ComingSoon({ name, icon, onHome, onBack }) {
    return (
      <React.Fragment>
        <header className="has-nav">
          <button className="backbtn" onClick={onBack} aria-label="Back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <button className="homebtn" onClick={onHome} aria-label="Home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          </button>
          <div className="brand"><Ghost /><div className="wordmark"><Flick text={name.toUpperCase()} /></div></div>
        </header>
        <main>
          <div className="empty" style={{ paddingTop: '80px' }}>
            <div style={{ fontSize: '46px', marginBottom: '10px' }}>{icon}</div>
            <p>{name}</p>
            <p style={{ marginTop: '12px', textTransform: 'none', letterSpacing: 0, fontSize: '13px', color: 'var(--muted)', lineHeight: 1.6 }}>
              Coming soon — just tell me to build this next and I will. 🙂
            </p>
          </div>
        </main>
      </React.Fragment>
    );
  }

  /* ---------- Hub (home screen) ---------- */
  /* ---------- Hub (smart home screen) ---------- */
  /* ---------- Hub (smart home screen) ---------- */
  /* ---------- Hub (smart home screen) ---------- */
  function Hub({ onOpen }) {
    const [hw, setHw] = useState([]);
    const [habits, setHabits] = useState([]);
    const [hlog, setHlog] = useState({});
    const [wallets, setWallets] = useState([]);
    const [txs, setTxs] = useState([]);
    const [notes, setNotes] = useState([]);
    const [ideas, setIdeas] = useState([]);
    const [loaded, setLoaded] = useState(false);
    const [quickMenu, setQuickMenu] = useState(false);
    const [syncOpen, setSyncOpen] = useState(false);
    const importRef = useRef(null);

    const refreshData = useCallback(async () => {
      try {
        const d = await openDB();
        db = d;
        const [h, hab, hl, w, t, n, id] = await Promise.all([
          getAllHW(),
          allOf('habits'),
          allOf('hlog'),
          allOf('wallets'),
          allOf('transactions'),
          getAllNotes(),
          allOf('ideas')
        ]);
        setHw(h.filter(i => !i.archived));
        setHabits(hab);
        const m = {}; for (const r of hl) m[r.key] = true; setHlog(m);
        setWallets(w);
        setTxs(t);
        setNotes(n);
        setIdeas(id);
      } catch (err) {
        console.error(err);
      } finally {
        setLoaded(true);
      }
    }, []);

    useEffect(() => {
      refreshData();
    }, [refreshData]);

    const today = todayIsoStr();
    const todayD = new Date(); todayD.setHours(0,0,0,0);

    const pendingHw = hw.filter(i => !i.done);
    const upcoming = pendingHw.filter(i => {
      if (!i.dueDate) return false;
      const days = Math.round((new Date(i.dueDate + 'T00:00:00') - todayD) / 86400000);
      return days >= 0 && days <= 2;
    }).sort((a, b) => (a.dueDate || '').localeCompare(b.dueDate || ''));

    const overdueCount = pendingHw.filter(i => i.dueDate && new Date(i.dueDate + 'T00:00:00') < todayD).length;
    const examsPending = pendingHw.filter(i => i.kind === 'exam').length;

    const isDone = (h) => !!hlog[h.id + '|' + today];
    const habitsDone = habits.filter(isDone).length;

    const toggleHabit = async (h, e) => {
      e.stopPropagation();
      const key = h.id + '|' + today;
      if (hlog[key]) {
        await delFrom('hlog', key);
        setHlog(prev => { const n = { ...prev }; delete n[key]; return n; });
      } else {
        await putIn('hlog', { key, habitId: h.id, date: today });
        setHlog(prev => ({ ...prev, [key]: true }));
      }
    };

    const fxMode = localStorage.getItem('fx_mode') || 'auto';
    let autoFx = null;
    try { autoFx = JSON.parse(localStorage.getItem('fx_auto') || 'null'); } catch(e) {}
    const manBcv = parseFloat(String(localStorage.getItem('fx_bcv') || '0').replace(',', '.')) || 0;
    const manPar = parseFloat(String(localStorage.getItem('fx_par') || localStorage.getItem('fx_rate') || '0').replace(',', '.')) || 0;
    const useAuto = fxMode === 'auto' && autoFx;
    const bcv = (useAuto && autoFx.bcv) ? autoFx.bcv : manBcv;
    const par = (useAuto && autoFx.par) ? autoFx.par : manPar;
    const balOf = (w) => (w.start || 0) + txs.filter(t => t.walletId === w.id)
      .reduce((s, t) => s + walletDelta(t.amount, modeOf(t), w.cur, bcv, par) * (t.kind === 'in' ? 1 : -1), 0);
    const totalUSD = wallets.filter(w => w.cur === 'USD').reduce((s, w) => s + balOf(w), 0);
    const totalBs = wallets.filter(w => w.cur === 'Bs').reduce((s, w) => s + balOf(w), 0);
    const combined = par > 0 ? totalUSD + totalBs / par : null;

    const hour = new Date().getHours();
    const greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
    const doingIdeas = ideas.filter(i => i.status === 'doing').length;

    const mods = [
      { id: 'homework', icon: '\uD83D\uDCDA', name: 'Homework', sub: pendingHw.length ? pendingHw.length + ' pending' + (examsPending ? ' (' + examsPending + ' exams)' : '') : 'All caught up', ready: true },
      { id: 'finances', icon: '\uD83D\uDCB5', name: 'Finances', sub: combined != null ? '\u2248 ' + money(combined, 'USD') : (wallets.length ? wallets.length + ' wallets' : 'Track $ & Bs'), ready: true },
      { id: 'notes', icon: '\uD83D\uDCDD', name: 'Notes', sub: notes.length ? notes.length + ' notes' : 'Quick notes', ready: true },
      { id: 'ideas', icon: '\uD83D\uDCA1', name: 'Ideas & Projects', sub: doingIdeas ? doingIdeas + ' in progress' : (ideas.length ? ideas.length + ' ideas' : 'Projects & lists'), ready: true },
      { id: 'health', icon: '\u2764\uFE0F', name: 'Health', sub: habits.length ? habitsDone + '/' + habits.length + ' habits today' : 'Habits & streaks', ready: true },
    ];

    return (
      <React.Fragment>
        <header className="hub-header">
          <div className="brand"><Ghost /><div className="wordmark"><Flick text="PHANTOM" /></div></div>
        </header>
        <main>
          <section className="hub-hero">
            <p className="eyebrow">{greeting} {'\u00B7'} PHANTOM OS</p>
            <h1 className="hero-title">Your day<br/><span className="dim">at a glance.</span></h1>
          </section>

          {/* Smart Dashboard: Upcoming Deadlines */}
          {loaded && (upcoming.length > 0 || overdueCount > 0) && (
            <div className="dash-section" onClick={() => onOpen('homework')} style={{ cursor: 'pointer' }}>
              <div className="dash-header">
                <span className="dash-label">{'\u23F0'} Upcoming & Urgent</span>
                <span className="dash-badge">{pendingHw.length} to do</span>
              </div>
              {overdueCount > 0 && (
                <div className="dash-alert">{'\uD83D\uDD34'} {overdueCount} overdue item{overdueCount > 1 ? 's' : ''}</div>
              )}
              {upcoming.slice(0, 3).map(it => {
                const di = dueInfo(it.dueDate, false);
                const isExam = it.kind === 'exam';
                return (
                  <div key={it.id} className="dash-item">
                    <span className="dash-dot" style={{ background: it.color || '#f5f5f7' }}></span>
                    <span className="dash-text">{isExam ? '\uD83D\uDCDD ' : ''}{(it.title && it.title.trim()) || it.subject || '(untitled)'}</span>
                    <span className={'dash-due ' + di.cls}>{di.label}</span>
                  </div>
                );
              })}
              {upcoming.length > 3 && (
                <div className="dash-more">+{upcoming.length - 3} more in Homework {'\u203A'}</div>
              )}
            </div>
          )}

          {/* Smart Dashboard: Habits Today */}
          {loaded && habits.length > 0 && (
            <div className="dash-section">
              <div className="dash-header" onClick={() => onOpen('health')} style={{ cursor: 'pointer' }}>
                <span className="dash-label">{'\uD83D\uDD25'} Habits {'\u00B7'} {habitsDone}/{habits.length} today</span>
                <span className="dash-badge" style={{ color: habitsDone === habits.length ? '#5fd08a' : 'inherit' }}>
                  {habitsDone === habits.length ? '\u2713 Completed' : 'Tap icon to check'}
                </span>
              </div>
              <div className="dash-habits">
                {habits.map(h => {
                  const done = isDone(h);
                  return (
                    <button
                      type="button"
                      key={h.id}
                      className={'dash-habit' + (done ? ' on' : '')}
                      style={done && h.color ? { borderColor: h.color, color: h.color, background: 'rgba(255,255,255,0.14)' } : undefined}
                      onClick={(e) => toggleHabit(h, e)}
                      title={h.name + (done ? ' (Done)' : '')}
                    >
                      {h.icon || '\u2022'}
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          {/* Smart Dashboard: Money Glance */}
          {loaded && wallets.length > 0 && (
            <div className="dash-section" onClick={() => onOpen('finances')} style={{ cursor: 'pointer' }}>
              <div className="dash-header">
                <span className="dash-label">{'\uD83D\uDCB5'} Money Balance</span>
                {par > 0 && <span className="dash-badge">Par: Bs {par.toFixed(2)}</span>}
              </div>
              <div className="dash-fin-bar">
                <div><span className="fin-lab">USD</span><span className="dash-fin-pill">{money(totalUSD, 'USD')}</span></div>
                <div><span className="fin-lab">Bol{'\u00ED'}vares</span><span className="dash-fin-pill">{money(totalBs, 'Bs')}</span></div>
                {combined != null && <div><span className="fin-lab">Total Real</span><span className="dash-fin-pill" style={{ color: '#5fd08a' }}>{'\u2248'} {money(combined, 'USD')}</span></div>}
              </div>
            </div>
          )}

          {/* Space navigation cards */}
          <div className="hub-grid">
            {mods.map(m =>
              <button key={m.id} className={'hub-card' + (m.ready ? '' : ' soon')} onClick={() => onOpen(m.id)}>
                <span className="hub-ic">{m.icon}</span>
                <span className="hub-name">{m.name}{!m.ready && <span className="soon-tag">Soon</span>}</span>
                <span className="hub-sub">{m.sub}</span>
              </button>)}
          </div>

          {/* Universal Backup & Restore in Hub */}
          <div className="footer-tools" style={{ padding: '16px 0 40px' }}>
            <button className="link" onClick={() => setSyncOpen(true)}>🔄 Cloud Sync</button>
            <button className="link" onClick={universalExportData}>{'\\u2B07'} Backup All Data</button>
            <button className="link" onClick={() => importRef.current && importRef.current.click()}>{'\\u2B06'} Restore</button>
            <input ref={importRef} type="file" accept="application/json" hidden onChange={e => {
              if (e.target.files[0]) universalImportData(e.target.files[0], refreshData);
              e.target.value = '';
            }} />
          </div>
          {syncOpen && <SyncSheet onClose={() => setSyncOpen(false)} onReload={refreshData} />}
        </main>

        {/* Quick Action Floating Button (+) */}
        <button className="add" onClick={() => setQuickMenu(true)} aria-label="Quick action">{'\uFF0B'}</button>
        {quickMenu &&
          <div className="addmenu-backdrop" onClick={() => setQuickMenu(false)}>
            <div className="addmenu" onClick={e => e.stopPropagation()}>
              <button onClick={() => { setQuickMenu(false); onOpen('homework'); }}>{'\uD83D\uDCD3'} New Homework</button>
              <button onClick={() => { setQuickMenu(false); onOpen('finances'); }}>{'\uD83D\uDCB5'} New Expense / Money</button>
              <button onClick={() => { setQuickMenu(false); onOpen('notes'); }}>{'\uD83D\uDCDD'} New Note</button>
              <button onClick={() => { setQuickMenu(false); onOpen('ideas'); }}>{'\uD83D\uDCA1'} New Idea / Project</button>
              <button onClick={() => { setQuickMenu(false); onOpen('health'); }}>{'\u2764\uFE0F'} New Habit</button>
            </div>
          </div>}
      </React.Fragment>
    );
  }

        function Root() {
    const [stack, setStack] = useState(['hub']);
    const screen = stack[stack.length - 1];
    const go = (s) => setStack(st => [...st, s]);
    const back = () => setStack(st => st.length > 1 ? st.slice(0, -1) : st);
    const home = () => setStack(['hub']);
    const nav = { onBack: back, onHome: home };
    if (screen === 'homework') return <HomeworkApp {...nav} />;
    if (screen === 'notes') return <NotesApp {...nav} />;
    if (screen === 'finances') return <FinanceApp {...nav} />;
    if (screen === 'ideas') return <IdeasApp {...nav} />;
    if (screen === 'health') return <HealthApp {...nav} />;
    return <Hub onOpen={go} />;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Root />);

  /* Ask the browser to keep our data forever (prevents iOS from evicting IndexedDB). */
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(() => {});
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
  </script>

  <script>
    // Transform and run the app source manually (classic JSX runtime, since
    // React is loaded as a plain global, not an ES module).
    var src = document.getElementById('app-source').textContent;
    var out = Babel.transform(src, {
      presets: [['react', { runtime: 'classic' }]]
    }).code;
    var s = document.createElement('script');
    s.text = out;
    document.head.appendChild(s);
  </script>
