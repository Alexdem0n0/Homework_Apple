<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Homework</title>

  <!-- Add-to-home-screen / PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Homework" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />

  <!-- The phone's own typeface (SF Pro) is used throughout; Inter is only a fallback off-Apple -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      /* Mostly black. Blue appears on text only -- active tabs, dates, amounts,
         links -- never as a big filled block. Text is a soft off-white rather
         than pure white: #fff on black causes halation and is hard on the eyes. */
      /* iOS dark mode. True black base with the standard elevated greys on top.
         Labels follow Apple's own opacity ladder rather than pure #fff. */
      --bg: #000000;
      --panel: #1C1C1E;                       /* secondarySystemGroupedBackground */
      --panel-lit: #1C1C1E;
      --panel-2: #2C2C2E;                     /* tertiarySystemGroupedBackground */
      --line: rgba(84,84,88,0.55);            /* separator */
      --line-strong: rgba(84,84,88,0.85);
      --text: #EDEDF0;                        /* label, eased off pure white */
      --dim: rgba(235,235,245,0.62);          /* secondaryLabel */
      --muted: rgba(235,235,245,0.60);
      --faint: rgba(235,235,245,0.32);        /* tertiaryLabel */
      --accent: #409CFF;                      /* systemBlue, a touch lighter */
      --accent-ink: #FFFFFF;
      --overdue: #FF6961;                     /* systemRed dark */
      --soon: #FFB340;                        /* systemOrange dark */
      --good: #30D158;                        /* systemGreen dark */
      /* Glass material -- used ONLY on sheets, headers, menus and floating
         controls. Scrolling lists stay opaque so they never stutter. */
      --glass: rgba(30,30,32,0.72);
      --glass-strong: rgba(44,44,46,0.82);
      --glass-line: rgba(84,84,88,0.5);
      --glass-blur: blur(28px) saturate(180%);
      --glass-sheen: none;
      /* On an iPhone this resolves to SF Pro -- the actual system typeface. */
      --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif;
      --font-serif: var(--font-sans);
      --font-mono: ui-monospace, 'SF Mono', 'JetBrains Mono', monospace;
      --r-card: 12px;
      --r-tile: 14px;
      --r-pill: 100px;
      --elev-1: 0 4px 12px rgba(0,0,0,0.40);
      --elev-2: 0 6px 20px rgba(0,0,0,0.45);
      --elev-3: 0 12px 34px rgba(0,0,0,0.55);
    }
    /* If the phone is set to Reduce Transparency, swap every glass surface for a
       solid one. Same layout, no blur. */
    @media (prefers-reduced-transparency: reduce) {
      :root {
        --glass: #1C1C1E; --glass-strong: #2C2C2E; --glass-blur: none;
        --glass-line: rgba(84,84,88,0.6); --glass-sheen: none;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      font-family: var(--font-serif);
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased; overflow-x: hidden;
    }
    .mono { font-family: var(--font-mono); }

    /* Small uppercase interface chrome stays in the grotesque -- a serif at 9-11px
       with 2px letter-spacing is hard to read and looks like a mistake. */
    label, .eyebrow, .tag, .due, .kind-tag, .grade-tag, .soon-tag, .glabel,
    .viewtabs button, .filters button, .schip, .schip2, .dchip, .btn, .link,
    .empty p, .stitle, .corte-name, .wlab, .np-edit, .grade-kind, .corte-chip,
    .wtoggle, .chip, .file-btn, .sched-note, .caption, .wordmark, .np-head .stitle {
      font-family: var(--font-sans);
    }

    /* ---------- Background: grid + subtle static glow (no animation = smoother) ---------- */
    /* Grid paper plus two soft static glows. Painted once and never animated,
       so they cost nothing while scrolling, and they give the frosted nav bar
       and sheets something to pick up. */
    .bg {
      position: fixed; inset: 0; z-index: -3;
      background: var(--bg);
    }
    .grid {
      position: fixed; inset: 0; z-index: -2; pointer-events: none;
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 58px 58px;
      -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 32%, #000 45%, transparent 100%);
              mask-image: radial-gradient(ellipse 90% 70% at 50% 32%, #000 45%, transparent 100%);
    }
    .glow {
      position: fixed; z-index: -1; pointer-events: none; border-radius: 50%;
      filter: blur(70px); opacity: 0.05; background: radial-gradient(circle, #cfe0f5 0%, transparent 70%);
      width: 70vw; height: 70vw; left: 15vw; top: -10vh;
    }
    .glow.two { top: auto; bottom: -20vh; left: -10vw; width: 60vw; height: 60vw; opacity: 0.035; }

    /* corner registration ticks (phantom vibe) */
    .ticks { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
    .ticks span { position: absolute; width: 14px; height: 14px; border: 1px solid rgba(255,255,255,0.14); }
    .ticks .tl { top: 10px; left: 10px; border-right: none; border-bottom: none; }
    .ticks .tr { top: 10px; right: 10px; border-left: none; border-bottom: none; }
    .watermark {
      position: fixed; left: 14px; bottom: 10px; z-index: -1; pointer-events: none;
      font-size: 11px; color: rgba(255,255,255,0.14); letter-spacing: 1px;
    }
    .boot-msg {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 40px; font-size: 12px; letter-spacing: 1px;
      color: var(--muted); line-height: 1.8;
    }
    .boot-msg .dots::after { content: ''; animation: dots 1.4s steps(4, end) infinite; }
    @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75%, 100% { content: '...'; } }

    /* ---------- Header ---------- */
    header {
      position: sticky; top: 0; z-index: 10;
      padding: calc(16px + env(safe-area-inset-top)) 18px 14px;
      border-bottom: 1px solid var(--glass-line);
      background: var(--glass);
      -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
      box-shadow: var(--glass-sheen);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .homebtn, .backbtn { position: absolute; top: calc(14px + env(safe-area-inset-top)); z-index: 12;
      width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--glass-line);
      background: var(--glass-strong); color: var(--text);
      -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
      box-shadow: var(--glass-sheen);
      display: grid; place-items: center; cursor: pointer; transition: transform .15s; }
    .homebtn { right: 16px; }
    .backbtn { left: 16px; }
    .homebtn:active, .backbtn:active { transform: scale(.9); }
    .homebtn svg { width: 18px; height: 18px; }
    .backbtn svg { width: 21px; height: 21px; }
    /* in a module, centre the logo between the back (left) and home (right) buttons */
    header.has-nav .brand { justify-content: center; padding: 0 46px; }

    /* hub / home screen */
    .hub-header { position: sticky; top: 0; z-index: 10; padding: calc(16px + env(safe-area-inset-top)) 18px 14px;
      border-bottom: 1px solid var(--glass-line); background: var(--glass);
      -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); box-shadow: var(--glass-sheen); }
    .hub-hero { padding: 34px 2px 20px; }
    .hub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 6px 0 40px; }
    .hub-card { text-align: left; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--line);
      border-radius: var(--r-tile);
      background: var(--panel-lit); box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), var(--elev-2);
      padding: 18px 16px; cursor: pointer; min-height: 122px; color: var(--text); font-family: inherit; transition: transform .15s, border-color .2s; }
    .hub-card:active { transform: scale(.97); border-color: var(--line-strong); }
    .hub-ic { font-size: 27px; line-height: 1; }
    .hub-name { font-size: 16.5px; font-weight: 600; letter-spacing: 0; margin-top: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .hub-sub { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
    .hub-card.soon { opacity: .7; }
    .soon-tag { font-size: 8px; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); border: 1px solid var(--line); padding: 2px 5px; }

    /* notes list */
    .note-card { padding: 14px 16px; }
    .note-row { display: flex; gap: 12px; align-items: flex-start; }
    .note-body { flex: 1; min-width: 0; }
    .note-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .note-prev { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
    .pin { flex: 0 0 auto; background: none; border: none; color: var(--faint); font-size: 19px; cursor: pointer; line-height: 1; padding: 2px 4px; }
    .pin.on { color: #ead24a; }
    /* full note in the read-only view */
    .note-full { white-space: pre-wrap; word-break: break-word; line-height: 1.6; font-size: 15px; color: rgba(255,255,255,0.85); margin: 6px 0 0; }

    /* checklist group titles */
    .group-head { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--text);
      margin: 16px 0 2px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
    .head-mark { flex: 0 0 auto; width: 26px; text-align: center; color: var(--faint); font-size: 15px; }
    .head-input { font-weight: 600; letter-spacing: 1px; }

    /* health */
    .habit-card { padding: 14px 16px; }
    .habit-row { display: flex; align-items: center; gap: 14px; }
    .hcheck { flex: 0 0 auto; width: 46px; height: 46px; border: 1px solid var(--line-strong); background: transparent;
      font-size: 21px; display: grid; place-items: center; cursor: pointer; transition: background .2s, transform .15s; }
    .hcheck.on { background: var(--accent); }
    .hcheck:active { transform: scale(.9); }
    .habit-body { flex: 1; min-width: 0; cursor: pointer; }
    .week-dots { display: flex; gap: 6px; margin-top: 8px; }
    .week-dots i { width: 13px; height: 13px; border: 1px solid var(--line-strong); display: block; cursor: pointer; }
    .week-dots i.on { background: #f5f5f7; border-color: #f5f5f7; }
    .streak { flex: 0 0 auto; font-size: 13px; color: var(--soon); font-family: 'JetBrains Mono', ui-monospace, monospace; }

    /* finances */
    .fin-totals { display: flex; gap: 12px; padding: 18px 2px 14px; border-bottom: 1px solid var(--line); }
    .fin-totals > div { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .fin-lab { font-size: 9.5px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--faint); }
    .fin-val { font-size: 21px; font-weight: 600; letter-spacing: -0.3px; word-break: break-all; }
    .fin-val.up { color: var(--good); } .fin-val.down { color: var(--overdue); }
    .fin-combined { font-size: 12px; color: var(--muted); margin: 10px 2px 0; letter-spacing: .3px; }
    .sec-title { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--faint); margin: 28px 0 10px; }
    .fin-row { display: flex; align-items: center; gap: 12px; padding: 13px 15px; }
    .fin-left { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .fin-name { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fin-sub { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fin-amt { flex: 0 0 auto; font-size: 15px; font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .fin-amt.up { color: var(--good); } .fin-amt.down { color: var(--overdue); }
    .fin-amtwrap { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
    .fin-real { font-size: 10.5px; color: var(--faint); font-family: 'JetBrains Mono', ui-monospace, monospace; white-space: nowrap; }
    .ghost { width: 30px; height: 30px; flex: 0 0 auto; animation: floaty 4.5s ease-in-out infinite; }
    .wordmark { line-height: 0.92; font-weight: 700; letter-spacing: 3px; font-size: 15px; }
    .wordmark .ring { display: inline-block; width: 0.6em; height: 0.6em; border: 2px solid currentColor;
      border-radius: 50%; vertical-align: 0.04em; margin: 0 0.04em; box-sizing: border-box; }

    main { max-width: 660px; margin: 0 auto; padding: 0 18px calc(104px + env(safe-area-inset-bottom)); }

    /* ---------- Hero ---------- */
    .hero { padding: 30px 2px 22px; border-bottom: 1px solid var(--line); }
    .eyebrow { margin: 0 0 16px; font-size: 11px; letter-spacing: 3.5px; text-transform: uppercase; color: var(--faint); }
    .hero-title { margin: 0; font-weight: 400; font-size: clamp(30px, 8vw, 44px); line-height: 1.06; letter-spacing: -0.5px; }
    .hero-title .dim { color: var(--dim); }
    .hero-sub { margin: 16px 0 0; font-size: 12px; letter-spacing: 1px; color: var(--muted); }

    /* ---------- Toolbar ---------- */
    .toolbar { display: flex; align-items: center; gap: 16px; padding: 18px 2px; }
    .search {
      flex: 1; background: transparent; border: none; border-bottom: 1px solid var(--line);
      color: var(--text); padding: 8px 2px; font-size: 15px; outline: none; transition: border-color .25s;
    }
    .search:focus { border-color: var(--line-strong); }
    .search::placeholder { color: var(--faint); }
    .filters { display: flex; gap: 22px; overflow-x: auto; -ms-overflow-style: none; scrollbar-width: none; padding: 2px 2px 12px; }
    .filters::-webkit-scrollbar { display: none; }
    .filters button {
      background: none; border: none; color: var(--faint); font-size: 12px; letter-spacing: 1.5px; white-space: nowrap; flex: 0 0 auto;
      text-transform: uppercase; cursor: pointer; padding: 6px 0; position: relative; transition: color .2s;
    }
    .filters button.active { color: var(--text); }
    .filters button.active::after { content: ''; position: absolute; left: 0; right: 0; bottom: -2px; height: 1.5px; background: var(--accent);
      transform-origin: left; animation: uline .25s ease; }
    @keyframes uline { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    /* ---------- Cards (sharp corners, thin borders) ---------- */
    /* Cards live in scrolling lists, so they are OPAQUE -- no backdrop-filter.
       This is what keeps scrolling smooth on the phone. */
    .card {
      border: 1px solid var(--line); background: var(--panel-lit); border-radius: var(--r-card);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.045), var(--elev-1);
      padding: 16px; margin-bottom: 12px; animation: cardIn .3s cubic-bezier(.2,.7,.3,1) both;
    }
    @keyframes cardIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .hw { display: flex; gap: 14px; align-items: flex-start; }
    .check {
      flex: 0 0 auto; width: 26px; height: 26px; border: 1px solid var(--line-strong); background: transparent;
      cursor: pointer; display: grid; place-items: center; margin-top: 2px; transition: background .2s ease, border-color .2s ease;
    }
    .check:active { transform: scale(.9); }
    .check { border-radius: 50%; }
    .hw.done .check { background: var(--accent); border-color: var(--accent); }
    .check svg { width: 14px; height: 14px; stroke: var(--accent-ink); opacity: 0; transition: opacity .2s; }
    .hw.done .check svg { opacity: 1; }
    .body { flex: 1 1 auto; min-width: 0; }
    .title { font-size: 18px; font-weight: 600; margin: 0 0 4px; letter-spacing: 0; word-break: break-word; }
    .hw.done .title { color: var(--muted); text-decoration: line-through; }
    .subtitle { margin: 0 0 6px; font-size: 14px; color: var(--muted); letter-spacing: 0.1px; }
    .hw.done .subtitle { color: var(--faint); }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 2px; }
    .tag { font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); border: 1px solid var(--line); padding: 3px 9px; border-radius: var(--r-pill); }
    .due { font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; padding: 3px 9px; border-radius: var(--r-pill);
      border: 1px solid rgba(127,163,212,0.35); color: var(--accent); }
    .due.overdue { color: var(--overdue); border-color: rgba(196,112,122,0.45); }
    .due.soon { color: var(--soon); border-color: rgba(200,154,106,0.4); }
    .notes { font-size: 15.5px; color: rgba(255,255,255,0.68); margin: 10px 0 0; white-space: pre-wrap; word-break: break-word; line-height: 1.55; }
    .attachments { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .thumb { width: 64px; height: 64px; object-fit: cover; border: 1px solid var(--line); border-radius: 12px; }
    .att { display: flex; align-items: center; gap: 7px; text-decoration: none; border: 1px solid var(--line); border-radius: var(--r-pill);
      color: var(--text); padding: 7px 10px; font-size: 12px; }
    .att .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }

    /* action buttons — bigger, real tap targets */
    .row-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .row-actions .link {
      border: 1px solid var(--line); padding: 10px 15px; font-size: 11.5px; letter-spacing: 1px; color: var(--dim);
    }
    .row-actions .link:active { background: rgba(127,163,212,0.12); color: var(--text); }
    .row-actions .link.danger { color: #c98282; border-color: rgba(224,102,102,0.32); }
    .row-actions .link.danger:active { background: rgba(224,102,102,0.12); color: var(--overdue); }

    .link { background: none; border: none; color: var(--accent); font-size: 11.5px; letter-spacing: 1.5px;
      text-transform: uppercase; cursor: pointer; padding: 0; transition: color .2s; }
    .link:active { color: var(--text); }
    .link.danger:active { color: var(--overdue); }
    .link.busy { color: var(--soon); }

    /* transcription block + photo tools */
    .transcript { margin-top: 12px; border: 1px solid var(--line); border-left: 2px solid var(--line-strong);
      background: rgba(255,255,255,0.02); padding: 11px 13px; font-size: 13px; line-height: 1.55;
      color: rgba(255,255,255,0.72); white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow: auto; }
    .transcript .tlabel { display: block; font-size: 9.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--faint); margin-bottom: 7px; }
    .photo-tools { display: flex; flex-wrap: wrap; gap: 14px 18px; margin-top: 14px; }
    .tap-hint { font-size: 11px; color: var(--faint); letter-spacing: .3px; margin: 10px 0 0; }

    /* read-only detail view */
    .detail-title { font-size: 22px; font-weight: 500; letter-spacing: -0.3px; margin: 4px 0 12px; word-break: break-word; line-height: 1.2; }
    .detail-foot { margin-top: 28px; }
    .detail-links { display: flex; flex-wrap: wrap; gap: 12px 20px; justify-content: center; margin-top: 18px; }
    .detail-links .link { padding: 6px 0; }

    /* delete-with-grade dialog */
    .dialog { width: 100%; max-width: 460px; margin: 0 18px; background: var(--glass-strong); border: 1px solid var(--glass-line);
      border-radius: 24px; -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); box-shadow: var(--glass-sheen), var(--elev-3);
      padding: 24px 22px calc(24px + env(safe-area-inset-bottom)); animation: slideUp .28s cubic-bezier(.2,.8,.2,1); }
    .dialog h2 { margin: 0 0 10px; font-size: 17px; font-weight: 500; letter-spacing: -0.2px; }
    .dialog-text { font-size: 13.5px; color: var(--muted); line-height: 1.5; margin: 0 0 22px; }
    .dialog .btn + .btn { margin-top: 10px; }

    /* logo: gentle float + failing-bulb letter flicker */
    @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    .wordmark .fl { display: inline-block; animation: bulb 5s linear infinite; }
    @keyframes bulb { 0%, 88%, 100% { opacity: 1; } 89% { opacity: .3; } 90.5% { opacity: 1; } 92% { opacity: .55; } 93.5% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .ghost, .wordmark .fl { animation: none !important; } }

    .empty { text-align: center; color: var(--faint); padding: 70px 20px; animation: cardIn .4s both; }
    .empty svg { width: 42px; height: 42px; opacity: .35; margin-bottom: 14px; }
    .empty p { margin: 0; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }

    .footer-tools { text-align: center; margin: 26px 0 4px; display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; }

    /* view tabs */
    .viewtabs { display: flex; gap: 20px; margin-top: 12px; overflow-x: auto; -ms-overflow-style: none; scrollbar-width: none; }
    .viewtabs::-webkit-scrollbar { display: none; }
    .viewtabs button { background: none; border: none; color: var(--faint); font-size: 11px; letter-spacing: 2px; white-space: nowrap; flex: 0 0 auto;
      text-transform: uppercase; padding: 4px 0; position: relative; cursor: pointer; transition: color .2s; }
    .viewtabs button.active { color: var(--accent); }
    .viewtabs button.active::after { content: ''; position: absolute; left: 0; right: 0; bottom: -3px; height: 1.5px; background: var(--accent); }

    /* calendar */
    .cal-wrap { padding-top: 6px; }
    .sembar { display: flex; gap: 8px; overflow-x: auto; padding: 16px 0; -ms-overflow-style: none; scrollbar-width: none; }
    .sembar::-webkit-scrollbar { display: none; }
    .schip { white-space: nowrap; border-radius: var(--r-pill); border: 1px solid var(--line); background: none; color: var(--muted);
      padding: 8px 13px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
    .schip.on { border-color: var(--accent); color: var(--accent); }
    .schip.newitem { color: var(--faint); border-style: dashed; }
    .seminfo { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center;
      padding: 2px 2px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); letter-spacing: .5px; }
    .seminfo .wk { color: var(--soon); margin-right: 12px; }

    .cal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 2px; }
    .cal-head .mlabel { font-size: 15px; letter-spacing: .5px; text-transform: capitalize; }
    .cal-nav { background: none; border: 1px solid var(--line); color: var(--text); width: 38px; height: 38px; cursor: pointer; font-size: 18px; line-height: 1; }
    .cal-nav:active { background: rgba(255,255,255,0.08); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-dow { text-align: center; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); padding: 2px 0 6px; }
    .cal-cell { min-height: 46px; border: 1px solid var(--line); background: var(--panel); padding: 5px;
      display: flex; flex-direction: column; gap: 2px; cursor: pointer; }
    .cal-cell.out { opacity: .32; }
    .cal-cell.dim { opacity: .14; }
    .cal-cell.today { border-color: var(--line-strong); }
    .cal-cell.sel { background: rgba(127,163,212,0.14); border-color: var(--accent); }
    .cal-cell .dnum { font-size: 11.5px; color: var(--muted); }
    .cal-cell.today .dnum { color: var(--accent); font-weight: 600; }
    .cal-dots { display: flex; flex-wrap: wrap; gap: 3px; margin-top: auto; align-items: center; }
    .cal-dots i { width: 7px; height: 7px; border-radius: 50%; display: block; box-sizing: border-box; }
    .cal-dots i.ex { background: transparent !important; border: 2px solid #f5f5f7; }
    .cal-more { font-size: 8px; color: var(--faint); }
    .cal-legend { display: flex; gap: 20px; justify-content: center; padding: 14px 0 2px; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
    .cal-legend span { display: inline-flex; align-items: center; gap: 7px; }
    .cal-legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; box-sizing: border-box; background: #f5f5f7; }
    .cal-legend i.dot-ex { background: transparent; border: 2px solid #f5f5f7; }

    .day-detail { margin-top: 22px; }
    .day-detail h3 { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--faint); margin: 0 0 12px; }
    .drow { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); background: var(--panel-lit); padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
    .drow .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; box-sizing: border-box; }
    .drow .dot.ex { background: transparent !important; border: 2px solid #f5f5f7; }
    .drow .dsub { font-size: 15px; }
    .drow.done .dsub { color: var(--muted); text-decoration: line-through; }
    .drow .dmeta { margin-left: auto; font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); }
    .day-empty { color: var(--faint); font-size: 12px; letter-spacing: 1px; padding: 8px 2px; }
    .add-day { display: inline-block; margin-top: 8px; }

    .form-err { color: var(--overdue); font-size: 12px; margin: 16px 0 0; letter-spacing: .3px; }

    /* schedule / horario */
    .sched-wrap { padding-top: 8px; }
    .sched-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 2px; border-bottom: 1px solid var(--line); }
    .sched-head .mlabel { font-size: 15px; letter-spacing: .5px; }
    .sched-day { margin-top: 20px; }
    .sched-day h3 { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--faint); margin: 0 0 10px; }
    .cls { display: flex; align-items: center; gap: 14px; border: 1px solid var(--line); border-left: 3px solid #f5f5f7;
      background: var(--panel-lit); padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
    .cls-time { font-size: 13px; color: var(--muted); flex: 0 0 auto; }
    .cls-sub { font-size: 15px; font-weight: 500; }
    .cls-room { margin-left: auto; font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); }
    .cls-empty { color: #3a3a40; font-size: 14px; padding: 2px 2px 4px; }
    .sched-actions { margin-top: 26px; }
    .sched-actions .btn { width: 100%; }
    .sched-note { color: var(--faint); font-size: 12px; line-height: 1.5; letter-spacing: .3px; margin: 14px 2px 0; text-align: center; }

    /* day picker + time row (class sheet) */
    .daypick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .dchip { border-radius: var(--r-pill); border: 1px solid var(--line); background: none; color: var(--muted); padding: 10px 15px; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
    .dchip.on { border-color: var(--accent); color: var(--accent); background: rgba(127,163,212,0.10); }
    .time-row { display: flex; gap: 16px; }
    .time-row > div { flex: 1; }

    /* subject / class quick-pick chips (new-homework sheet) */
    .subjchips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 2px; }
    .schip2 { display: inline-flex; align-items: center; gap: 8px; border-radius: var(--r-pill); border: 1px solid var(--line);
      background: none; color: var(--muted); padding: 10px 13px; font-size: 13px; cursor: pointer; }
    .schip2 i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
    .schip2.on { border-color: var(--accent); color: var(--accent); background: rgba(127,163,212,0.10); }
    .field-help { font-size: 12px; color: var(--faint); margin: 9px 0 0; letter-spacing: .2px; line-height: 1.5; }

    /* ---------- Add button — round FAB in the corner (roomier list) ---------- */
    .add {
      position: fixed; right: calc(18px + env(safe-area-inset-right));
      bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 20;
      width: 60px; height: 60px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: var(--glass-strong); color: var(--text); border: 1px solid var(--glass-line);
      -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
      font-size: 30px; font-weight: 300; line-height: 1;
      cursor: pointer; box-shadow: var(--glass-sheen), var(--elev-3); transition: transform .15s;
    }
    .add:active { transform: scale(.9); }

    /* ---------- Sheet ---------- */
    .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.62);
      z-index: 30; display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .sheet {
      width: 100%; max-width: 660px; background: var(--glass); border: 1px solid var(--glass-line); border-bottom: none;
      border-radius: 26px 26px 0 0;
      -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
      padding: 24px 22px calc(24px + env(safe-area-inset-bottom));
      max-height: 92vh; overflow-y: auto; animation: slideUp .28s cubic-bezier(.2,.8,.2,1);
    }
    @keyframes slideUp { from { transform: translateY(40px); opacity: .5; } to { transform: none; opacity: 1; } }
    .sheet h2 { margin: 0 0 22px; font-size: 12px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; color: var(--faint); }
    label { display: block; font-size: 10.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--faint); margin: 22px 0 9px; }
    /* underline-only fields, matching the reference contact form */
    input[type=text], input[type=date], input[type=time], textarea {
      width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--line);
      color: var(--text); padding: 9px 2px; font-size: 16px; font-family: inherit; outline: none; transition: border-color .2s;
    }
    input:focus, textarea:focus { border-color: var(--line-strong); }
    input.err { border-color: var(--overdue); }
    textarea { min-height: 60px; resize: vertical; }
    /* free-text notepad on an assignment */
    textarea.notepad { line-height: 1.6; resize: none; overflow: hidden; }
    .notepad-block { margin-top: 20px; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--panel-lit); padding: 12px 14px 14px; }
    .np-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .np-head .stitle { margin: 0; font-size: 9.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--faint); }
    .np-edit { background: transparent; border: 1px solid var(--line-strong); color: var(--muted); font-family: inherit;
      font-size: 11px; letter-spacing: 1px; text-transform: uppercase; padding: 6px 12px; border-radius: var(--r-pill); cursor: pointer; flex: 0 0 auto; }
    .np-edit.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
    .np-edit:active { transform: scale(.96); }
    .notepad-block .notes { margin: 0; cursor: pointer; }
    .np-empty { margin: 0; font-size: 13px; color: var(--faint); cursor: pointer; }
    .file-btns { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
    .file-btn { flex: 1 1 130px; text-align: center; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted);
      padding: 14px; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; transition: border-color .2s, color .2s; }
    .file-btn:active { border-color: var(--accent); color: var(--accent); }
    .staged { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .staged .att .rm { color: var(--overdue); font-weight: 700; cursor: pointer; margin-left: 2px; }
    .staged .att .ok { color: var(--soon); font-weight: 700; margin-left: 2px; }
    .file-btn.wide { flex-basis: 100%; margin-top: 12px; }
    .file-btn.busy { color: var(--soon); border-color: rgba(217,178,106,0.4); border-style: solid; cursor: default; }
    /* subject colour swatches */
    .swatches { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
    .swatch { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); cursor: pointer; padding: 0; transition: transform .15s; }
    .swatch:active { transform: scale(.85); }
    .swatch.on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--accent); }
    .swatch.none { background: #f5f5f7; }
    .sheet-actions { display: flex; gap: 12px; margin-top: 30px; }
    .btn { flex: 1; padding: 16px; font-family: inherit; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: transform .15s, opacity .2s; }
    .btn:active { transform: scale(.97); }
    .btn { border-radius: 14px; }
    .btn.primary { background: var(--glass-strong); color: var(--accent); border: 1px solid var(--glass-line); font-weight: 700;
      -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
      box-shadow: var(--glass-sheen); display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn.ghost { background: var(--glass); color: var(--text); border: 1px solid var(--glass-line); font-weight: 500;
      -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); }
    .btn.danger { background: var(--glass); color: var(--overdue); border: 1px solid rgba(196,112,122,0.4); font-weight: 500;
      -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); }
    .btn.wide-one { width: 100%; }

    /* subtasks — in the sheet */
    .subtask-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .stcheck { flex: 0 0 auto; width: 26px; height: 26px; border: 1px solid var(--line-strong); background: transparent;
      display: grid; place-items: center; cursor: pointer; }
    .stcheck svg { width: 13px; height: 13px; stroke: var(--accent-ink); opacity: 0; }
    .stcheck.on { background: var(--accent); border-color: var(--accent); }
    .stcheck.on svg { opacity: 1; }
    .subtask-row input { flex: 1; }
    .strm { flex: 0 0 auto; background: none; border: none; color: var(--overdue); font-size: 16px; cursor: pointer; padding: 4px 6px; }

    /* subtasks — on a card */
    .subtasks { margin-top: 12px; display: flex; flex-direction: column; gap: 9px; }
    .subtasks .stitle { font-size: 9.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--faint); }
    .subtask { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; color: rgba(255,255,255,0.82); }
    .subtask .box { width: 19px; height: 19px; border: 1px solid var(--line-strong); display: grid; place-items: center; flex: 0 0 auto; }
    .subtask .box svg { width: 11px; height: 11px; stroke: var(--accent-ink); opacity: 0; }
    .subtask.done .box { background: var(--accent); border-color: var(--accent); }
    .subtask.done .box svg { opacity: 1; }
    .subtask.done .stx { color: var(--muted); text-decoration: line-through; }

    /* kind + grade tags */
    .kind-tag { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; padding: 3px 9px; border-radius: var(--r-pill); border: 1px solid var(--line-strong); color: var(--text); }
    .kind-tag.exam { color: var(--soon); border-color: rgba(200,154,106,0.5); }
    /* exam urgency badge (calendar day list) */
    .exam-badge { flex: 0 0 auto; font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; padding: 4px 9px;
      border: 1px solid var(--line-strong); color: var(--dim); white-space: nowrap; }
    .exam-badge.orange { color: #e9a23b; border-color: rgba(233,162,59,0.6); }
    .exam-badge.red { color: #ffb4b4; border-color: rgba(224,102,102,0.75); background: rgba(224,102,102,0.22); font-weight: 600; }
    .grade-tag { font-size: 10.5px; letter-spacing: 1px; padding: 3px 9px; border-radius: var(--r-pill); border: 1px solid rgba(127,168,140,0.5); color: var(--good); }

    /* grades view */
    .grades-wrap { padding-top: 10px; }
    .grades-overall { display: flex; align-items: center; justify-content: space-between; padding: 16px 2px 18px; border-bottom: 1px solid var(--line); }
    .grades-overall .gnum { font-size: 30px; font-weight: 600; letter-spacing: -0.5px; }
    .grades-overall .gnum.none { color: var(--faint); }
    .grades-overall .gnum small { font-size: 14px; color: var(--muted); font-weight: 400; }
    .grades-overall .glabel { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--faint); text-align: right; }
    .grade-sec { margin-top: 24px; }
    .grade-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; gap: 12px; }
    .grade-subj { font-size: 16px; font-weight: 500; }
    .grade-avg { font-size: 14px; color: var(--muted); font-family: 'JetBrains Mono', ui-monospace, monospace; flex: 0 0 auto; }
    .grade-row { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel-lit); padding: 10px 12px; margin-bottom: 8px; }
    .grade-kind { flex: 0 0 auto; font-size: 8.5px; letter-spacing: 1px; color: var(--faint); border: 1px solid var(--line); padding: 3px 7px; border-radius: var(--r-pill); }
    .grade-name { flex: 1; min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
    input.grade-in { flex: 0 0 auto; width: 58px; text-align: center; background: transparent;
      border: 1px solid var(--line-strong); border-radius: 10px; color: var(--text);
      font-size: 16px; font-family: inherit; padding: 8px 4px; outline: none; }
    .grade-in:focus { border-color: var(--accent); }
    .grade-slash { flex: 0 0 auto; font-size: 13px; color: var(--faint); }
    .grade-in.max-in { width: 46px; font-size: 14px; color: var(--muted); border-style: dashed; }
    .grade-locked { font-size: 11.5px; color: var(--faint); margin: -4px 0 12px; }
    .corte-block { margin-bottom: 16px; }
    .corte-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 0 2px 6px; }
    .corte-name { font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); }
    .corte-name em { font-style: normal; color: var(--faint); letter-spacing: .5px; }
    .corte-score { font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono', ui-monospace, monospace; flex: 0 0 auto; }
    .corte-score em { font-style: normal; color: var(--faint); font-size: 10.5px; }
    .corte-chip { flex: 0 0 auto; background: transparent; border: 1px solid var(--line-strong); color: var(--accent); font-family: inherit;
      font-size: 10.5px; letter-spacing: .5px; padding: 4px 8px; border-radius: var(--r-pill); cursor: pointer; }
    .corte-chip:active { background: rgba(127,163,212,0.16); color: var(--text); }
    .day-empty.small { font-size: 12px; padding: 10px 12px; }
    .wtoggle { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 16px;
      background: var(--panel-lit); border: 1px solid var(--line); color: var(--muted); font-family: inherit; font-size: 12px;
      letter-spacing: .6px; padding: 12px 14px; border-radius: 14px 14px 0 0; cursor: pointer; }
    .wcaret { color: var(--faint); }
    .wpanel { border: 1px solid var(--line); border-top: none; border-radius: 0 0 14px 14px; background: var(--panel-lit); padding: 12px 14px 14px; }
    .wrow { display: flex; gap: 10px; margin: 10px 0 4px; }
    .wcell { flex: 1; display: flex; align-items: center; gap: 4px; }
    .wlab { font-size: 10.5px; letter-spacing: .8px; text-transform: uppercase; color: var(--faint); flex: 1; }
    .grade-in.wnum { width: 48px; font-size: 15px; padding: 6px 2px; }
    .wpct { font-size: 12px; color: var(--faint); }
    .wwarn { font-size: 11.5px; color: #e0a44b; margin: 8px 0 0; }
    .wreset { margin-top: 12px; width: 100%; }
    .grades-actions { margin-top: 30px; }
    .grades-actions .btn { width: 100%; }

    /* + chooser popup (homework vs exam) */
    .addmenu-backdrop { position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,0.55); animation: fade .18s ease; }
    .addmenu { position: fixed; right: calc(18px + env(safe-area-inset-right)); bottom: calc(92px + env(safe-area-inset-bottom)); z-index: 26;
      display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
    .addmenu button { background: var(--glass-strong); color: var(--text); border: 1px solid var(--glass-line);
      border-radius: 18px; -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
      padding: 16px 18px; font-family: inherit; font-size: 14px; font-weight: 600;
      letter-spacing: .5px; cursor: pointer; box-shadow: var(--glass-sheen), var(--elev-3); display: flex; align-items: center; gap: 12px; width: 220px; justify-content: flex-start; }
    .addmenu button:active { transform: scale(.97); background: rgba(255,255,255,0.17); }

    /* full-screen photo viewer with transcript underneath */
    .viewer-img { width: 100%; max-height: 62vh; object-fit: contain; background: #000; border: 1px solid var(--line); display: block; margin-bottom: 6px; }

    /* round save / cancel buttons inside a sheet (match the corner add button) */
    .sheet-fabs {
      position: fixed; right: calc(18px + env(safe-area-inset-right));
      bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 40; display: flex; gap: 12px;
    }
    .fab { width: 58px; height: 58px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      cursor: pointer; border: none; transition: transform .15s; }
    .fab:active { transform: scale(.9); }
    .fab.save { background: var(--glass-strong); color: var(--text); border: 1px solid var(--glass-line);
      -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
      box-shadow: var(--glass-sheen), var(--elev-3); }
    .fab.save svg { stroke: var(--accent); }
    .fab svg { width: 24px; height: 24px; }

    /* sticky sheet header with a close (X) in the corner */
    .sheet-top { position: sticky; top: 0; z-index: 5; background: transparent;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin: 0 0 20px; padding: 2px 0 10px; }
    .sheet-top h2 { margin: 0; }
    .sheet-x { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%;
      background: var(--glass-strong); border: 1px solid var(--glass-line); color: var(--text); border-radius: 50%;
      -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
      display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform .15s; }
    .sheet-x:active { transform: scale(.9); }
    .sheet-x svg { width: 18px; height: 18px; }
    /* ==================================================================
       iOS layer. Everything below re-skins the app in Apple's own idiom:
       SF Pro type ramp, large titles, inset grouped lists, segmented
       controls, and true-black backgrounds with #1C1C1E surfaces on top.
       Kept as one block at the end so it is easy to read -- and to undo.
       ================================================================== */

    body { font-family: var(--font-sans); letter-spacing: -0.01em; }
    .ticks { display: none; }
    /* The grid and the two glows stay -- they are the app's own signature and
       they read fine under the iOS surfaces, which are opaque on top of them. */
    .grid {
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.045) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.045) 1px, transparent 1px);
      background-size: 54px 54px;
    }
    .glow { opacity: 0.075; background: radial-gradient(circle, #7FB6FF 0%, transparent 70%); }
    .glow.two { opacity: 0.05; background: radial-gradient(circle, #9DC4FF 0%, transparent 70%); }
    .watermark { color: rgba(235,235,245,0.14); font-size: 10px; }

    /* --- nav bar --- */
    header, .hub-header {
      border-bottom: 0.5px solid var(--glass-line);
      padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    }
    .brand { gap: 9px; }

    }
    .schip.on, .schip2.on, .dchip.on, .corte-chip { background: rgba(64,156,255,0.20); color: var(--accent); }

      -webkit-backdrop-filter: none; backdrop-filter: none;

      -webkit-backdrop-filter: none; backdrop-filter: none; }
    .link { text-transform: none; letter-spacing: -0.1px; font-size: 15px; color: var(--accent); }

    /* --- forms: iOS inset fields, not underlines --- */

      text-transform: none; letter-spacing: -0.05px; font-size: 13px; color: var(--dim);
      margin: 20px 0 7px; font-weight: 400;
    }
    input[type=text], input[type=date], input[type=time], textarea {

<body>
  <div class="bg"></div>

  <div class="glow"></div>
